<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minh Lỏ Game Mobile</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; color: white; touch-action: none; }
        #game-ui { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; border: 2px solid lime; z-index: 10; font-size: 14px; }
        #player { 
            position: absolute; width: 60px; height: 60px; background: lime; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; color: black; font-weight: bold;
            box-shadow: 0 0 15px lime; z-index: 5; font-size: 12px; text-align: center;
        }
        .item { position: absolute; font-weight: bold; font-size: 16px; padding: 5px; z-index: 1; }
        #message { 
            position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 24px; text-align: center; display: none; text-shadow: 0 0 10px gold; z-index: 20; width: 80%;
        }
        /* Nút điều khiển */
        #controls { position: fixed; bottom: 20px; left: 20px; display: grid; grid-template-columns: repeat(3, 50px); gap: 10px; z-index: 30; }
        .btn { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 10px; display: flex; align-items: center; justify-content: center; user-select: none; active { background: lime; } }
        #btn-n { position: fixed; bottom: 20px; right: 20px; width: 70px; height: 70px; background: gold; color: black; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; font-size: 30px; z-index: 30; border: 4px solid white; }
        .firework { position: absolute; font-size: 40px; animation: explode 1s forwards; pointer-events: none; z-index: 100; }
        @keyframes explode { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3) translate(var(--x), var(--y)); opacity: 0; } }
    </style>
</head>
<body>

<div id="game-ui">
    <div style="color: gold;">NHIỆM VỤ: Tìm 40 mảnh chữ!</div>
    <div>Minh: <span id="c1">0</span>/10 | Lỏ: <span id="c2">0</span>/10</div>
    <div>Skibidi: <span id="c3">0</span>/10 | Quá: <span id="c4">0</span>/10</div>
</div>

<div id="message"></div>
<div id="player">Minh Lỏ</div>

<div id="controls">
    <div></div><div class="btn" id="up">↑</div><div></div>
    <div class="btn" id="left">←</div><div class="btn" id="down">↓</div><div class="btn" id="right">→</div>
</div>

<div id="btn-n">N</div>

<script>
    const player = document.getElementById('player');
    const btnN = document.getElementById('btn-n');
    const counts = { 'Minh': 0, 'Lỏ': 0, 'Skibidi': 0, 'Quá': 0 };
    let px = window.innerWidth / 2, py = window.innerHeight / 2;
    let nPressed = 0, gameFinished = false;

    // Khởi tạo vị trí người chơi
    player.style.left = px + 'px';
    player.style.top = py + 'px';

    // Tạo các mảnh nhặt
    const words = ['Minh', 'Lỏ', 'Skibidi', 'Quá'];
    words.forEach(word => {
        for(let i=0; i<10; i++) {
            const el = document.createElement('div');
            el.className = 'item';
            el.innerText = word;
            el.style.color = `hsl(${Math.random()*360}, 100%, 70%)`;
            el.style.left = Math.random() * (window.innerWidth - 50) + 'px';
            el.style.top = Math.random() * (window.innerHeight - 150) + 'px';
            document.body.appendChild(el);
        }
    });

    // Hàm di chuyển chung
    function move(dx, dy) {
        if (gameFinished) return;
        px = Math.max(0, Math.min(window.innerWidth - 60, px + dx));
        py = Math.max(0, Math.min(window.innerHeight - 60, py + dy));
        player.style.left = px + 'px';
        player.style.top = py + 'px';
        checkCollision();
    }

    // Điều khiển bằng phím
    window.addEventListener('keydown', (e) => {
        const s = 20;
        if (e.key === 'ArrowUp' || e.key === 'w') move(0, -s);
        if (e.key === 'ArrowDown' || e.key === 's') move(0, s);
        if (e.key === 'ArrowLeft' || e.key === 'a') move(-s, 0);
        if (e.key === 'ArrowRight' || e.key === 'd') move(s, 0);
        if (e.key.toLowerCase() === 'n') handleN();
    });

    // Điều khiển bằng nút bấm trên màn hình
    const setupBtn = (id, dx, dy) => {
        const btn = document.getElementById(id);
        let timer;
        const start = () => { timer = setInterval(() => move(dx, dy), 50); };
        const stop = () => clearInterval(timer);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
        btn.addEventListener('touchend', stop);
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', stop);
    };

    setupBtn('up', 0, -15); setupBtn('down', 0, 15);
    setupBtn('left', -15, 0); setupBtn('right', 15, 0);

    btnN.addEventListener('click', handleN);
    btnN.addEventListener('touchstart', (e) => { e.preventDefault(); handleN(); });

    function checkCollision() {
        const items = document.querySelectorAll('.item');
        const pRect = player.getBoundingClientRect();
        items.forEach(item => {
            const iRect = item.getBoundingClientRect();
            if (!(pRect.right < iRect.left || pRect.left > iRect.right || pRect.bottom < iRect.top || pRect.top > iRect.bottom)) {
                const txt = item.innerText;
                counts[txt]++;
                if (txt === 'Minh') document.getElementById('c1').innerText = counts[txt];
                if (txt === 'Lỏ') document.getElementById('c2').innerText = counts[txt];
                if (txt === 'Skibidi') document.getElementById('c3').innerText = counts[txt];
                if (txt === 'Quá') document.getElementById('c4').innerText = counts[txt];
                item.remove();
                if (Object.values(counts).every(v => v >= 10)) {
                    gameFinished = true;
                    document.getElementById('message').style.display = 'block';
                    document.getElementById('message').innerText = "XONG! NHẤN 'N' 10 LẦN";
                    btnN.style.display = 'flex';
                }
            }
        });
    }

    function handleN() {
        if (!gameFinished || nPressed >= 10) return;
        nPressed++;
        document.getElementById('message').innerText = `KẾT HỢP: ${nPressed}/10`;
        if (nPressed === 10) {
            document.getElementById('message').innerHTML = "<h1 style='color:lime; font-size:50px;'>CHÚC MỪNG!</h1>";
            btnN.style.display = 'none';
            for (let i = 0; i < 10; i++) setTimeout(createFirework, i * 300);
        }
    }

    function createFirework() {
        const fw = document.createElement('div');
        fw.className = 'firework';
        fw.innerText = 'MINH';
        fw.style.left = Math.random() * (window.innerWidth - 50) + 'px';
        fw.style.top = Math.random() * (window.innerHeight - 50) + 'px';
        fw.style.setProperty('--x', (Math.random() - 0.5) * 400 + 'px');
        fw.style.setProperty('--y', (Math.random() - 0.5) * 400 + 'px');
        fw.style.color = `hsl(${Math.random()*360}, 100%, 50%)`;
        document.body.appendChild(fw);
        setTimeout(() => fw.remove(), 1000);
    }
</script>
</body>
</html>
