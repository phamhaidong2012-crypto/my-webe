<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI Fixed - Tank Drift & Dodge</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: white; pointer-events: none; z-index: 10; }
        .stat { font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #overdrive { color: #00ffff; font-size: 14px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">MÁU BOSS: <span id="hp" style="color: #ff3333;">3</span></div>
    <div id="overdrive">OVERDRIVE: TIẾN LÙI KẾT HỢP</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');
    const odTxt = document.getElementById('overdrive');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 225;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;

    let boss = { 
        x: ARENA_X, y: ARENA_Y, angle: 0, hp: 3, 
        isOD: false, odTimer: 0, speed: 0, rotSpeed: 0
    };
    
    let bullets = [];

    window.addEventListener('pointerdown', (e) => {
        if (Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y) <= ARENA_RADIUS) return;
        setTimeout(() => {
            const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
            bullets.push({ x: e.clientX, y: e.clientY, vx: Math.cos(angle) * 8.5, vy: Math.sin(angle) * 8.5 });
        }, 500);
    });

    function getDistToPath(px, py, b) {
        const t = ((px - b.x) * b.vx + (py - b.y) * b.vy) / (b.vx**2 + b.vy**2);
        if (t < 0) return Infinity;
        return Math.hypot(px - (b.x + t * b.vx), py - (b.y + t * b.vy));
    }

    function update() {
        if (boss.odTimer > 0) {
            boss.odTimer -= 16; boss.isOD = true; odTxt.style.display = 'block';
        } else {
            boss.isOD = false; odTxt.style.display = 'none';
        }

        let steer = 0;
        let drive = 0;
        let inDanger = false;
        const margin = boss.hp === 1 ? 38 : 46;

        bullets.forEach(b => {
            const dPath = getDistToPath(boss.x, boss.y, b);
            const dBullet = Math.hypot(b.x - boss.x, b.y - boss.y);

            if (dPath < margin && dBullet < 280) {
                inDanger = true;
                const side = (boss.x - b.x) * (-b.vy) + (boss.y - b.y) * b.vx;
                const targetAngle = Math.atan2(b.vy * (side > 0 ? 1 : -1), b.vx * (side > 0 ? 1 : -1));
                
                let diff = targetAngle - boss.angle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;

                // THÔNG MINH: Nếu góc lệch > 90 độ, chọn LÙI thay vì tiến để né nhanh hơn
                steer = diff > 0 ? 0.22 : -0.22;
                if (Math.abs(diff) < Math.PI / 2) {
                    drive = boss.isOD ? 7.5 : 5;
                } else {
                    drive = boss.isOD ? -7.5 : -5; // Kết hợp số lùi
                }
            }
        });

        // 1. Luôn cho phép xoay (không chặn steer)
        boss.angle += steer;

        // 2. Chỉ chặn di chuyển tiến/lùi nếu vượt biên, nhưng vẫn cho xoay thân
        if (drive !== 0) {
            let nx = boss.x + Math.cos(boss.angle) * drive;
            let ny = boss.y + Math.sin(boss.angle) * drive;
            
            // Kiểm tra biên vòng tròn
            if (Math.hypot(nx - ARENA_X, ny - ARENA_Y) < ARENA_RADIUS - 22) {
                boss.x = nx; boss.y = ny;
            } else {
                // Nếu bị kẹt biên, thử lùi lại nếu đang tiến (hoặc ngược lại)
                let rx = boss.x + Math.cos(boss.angle) * -drive;
                let ry = boss.y + Math.sin(boss.angle) * -drive;
                if (Math.hypot(rx - ARENA_X, ry - ARENA_Y) < ARENA_RADIUS - 22) {
                    boss.x = rx; boss.y = ry;
                }
            }
        }

        // Xử lý đạn và va chạm chuẩn xác
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            if (Math.hypot(b.x - boss.x, b.y - boss.y) < 22) {
                boss.hp--; boss.odTimer = 2000;
                hpTxt.innerText = boss.hp;
                bullets.splice(i, 1);
                if (boss.hp <= 0) { alert("BẠN ĐÃ THẮNG!"); location.reload(); }
                continue;
            }
            if (b.x < -50 || b.x > canvas.width+50 || b.y < -50 || b.y > canvas.height+50) bullets.splice(i,1);
        }
    }

    function draw() {
        ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Vẽ biên vòng tròn
        ctx.beginPath();
        ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = boss.isOD ? '#0ff' : '#333';
        ctx.setLineDash([10, 5]); ctx.stroke(); ctx.setLineDash([]);

        // Vẽ Boss Xe Tăng
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(boss.angle);
        
        if (boss.hp === 1) { ctx.shadowBlur = 20; ctx.shadowColor = boss.isOD ? "white" : "red"; }

        // Vẽ xích xe
        ctx.fillStyle = '#222';
        ctx.fillRect(-22, -22, 44, 10); ctx.fillRect(-22, 12, 44, 10);
        // Thân xe
        ctx.fillStyle = boss.isOD ? '#0ff' : (boss.hp === 1 ? '#ff00ff' : '#ff3333');
        ctx.fillRect(-18, -15, 36, 30);
        // Nòng pháo
        ctx.fillStyle = '#000'; ctx.fillRect(0, -4, 25, 8);
        ctx.restore();

        // Vẽ đạn
        ctx.fillStyle = '#0f0';
        bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
