<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trân Ngu Tank - Ultimate</title>
    <style>
        body { margin: 0; overflow: hidden; background: #999; font-family: sans-serif; touch-action: none; color: white; }
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; background: #aaa; }
        #main-menu { display: flex; }
        
        /* Hình 1: Menu chính */
        .btn-box { width: 100px; height: 100px; background: white; border: 8px solid black; color: black; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; text-align: center; font-size: 20px; margin: 20px; }
        #play-btn { background: #0f0; border: none; width: 150px; height: 60px; color: black; font-size: 25px; cursor: pointer; }

        /* Hình 2: Chỉnh màu */
        #color-menu { background: #888; border: 4px solid #00ffff; }
        .color-panel { background: white; padding: 20px; color: black; display: flex; gap: 20px; }
        input[type=range] { width: 150px; }

        /* Hình 3: Kỹ năng */
        #skill-menu { background: #888; border: 4px solid #00ffff; }
        .skill-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; background: #888; padding: 20px; }
        .skill-slot { width: 60px; height: 60px; background: white; border: 4px solid #ccc; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; font-size: 10px; color: black; font-weight: bold; }
        .tier-0 { border-color: #0f0; } /* Thường */
        .tier-1 { border-color: #00ffff; } /* Lạ */
        .tier-2 { border-color: #ff0; } /* Hiếm */
        .tier-3 { border-color: #f0f; } /* Huyền thoại */
        .selected { background: #cfc; }

        canvas { display: none; background: #1a1a1a; }
        #game-ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; display:none; }
    </style>
</head>
<body>

<div id="main-menu" class="screen">
    <div style="display: flex;">
        <div class="btn-box" onclick="showScreen('skill-menu')">kĩ<br>năng</div>
        <div class="btn-box" onclick="showScreen('color-menu')">màu<br>xe</div>
    </div>
    <button id="play-btn" onclick="startGame()">chơi<br><span style="font-size:12px">level: 1</span></button>
    <div style="margin-top:10px">Xu: <span id="coin-txt">1000</span></div>
</div>

<div id="color-menu" class="screen">
    <h1 style="color:white; -webkit-text-stroke: 1px black;">màu xe tăng</h1>
    <div class="color-panel">
        <div>
            Hue <span id="h-val">0</span><br><input type="range" id="h-range" min="0" max="360" value="0"><br>
            Sat <span id="s-val">0</span><br><input type="range" id="s-range" min="0" max="100" value="0"><br>
            Bri <span id="b-val">100</span><br><input type="range" id="b-range" min="0" max="100" value="100">
        </div>
        <div id="tank-preview" style="width:80px; height:100px; border:4px solid black; background:white; position:relative;">
            <div style="position:absolute; top:-20px; left:30px; width:20px; height:40px; border:4px solid black; background:inherit;"></div>
            <div style="position:absolute; top:30px; left:20px; width:40px; height:40px; border:4px solid black; background:inherit;"></div>
        </div>
    </div>
    <button class="btn-box" style="width:80px; height:40px; margin-top:20px" onclick="showScreen('main-menu')">XONG</button>
</div>

<div id="skill-menu" class="screen">
    <h1 style="color:white">kĩ năng</h1>
    <div class="skill-grid" id="skill-grid"></div>
    <p>Đã chọn: <span id="skill-count">0</span>/3</p>
    <button class="btn-box" style="width:80px; height:40px" onclick="showScreen('main-menu')">XONG</button>
</div>

<div id="game-ui">
    <div id="hp-txt">HP: 100</div>
    <div id="boss-hp-txt" style="color:red">BOSS: 100</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    let coins = 1000, level = 1, currentSkills = [];
    let tankColor = "hsl(0, 0%, 100%)";

    const skillsData = [
        { id: 's1', n: '5 viên', t: 0, p: 10 }, { id: 's2', n: 'Tốc +10%', t: 0, p: 10 }, { id: 's3', n: 'Dmg +10%', t: 0, p: 10 },
        { id: 's4', n: 'Laser', t: 1, p: 200 }, { id: 's5', n: 'Xuyên', t: 1, p: 200 }, { id: 's6', n: 'Làm chậm', t: 1, p: 200 },
        { id: 's7', n: 'Laser X', t: 2, p: 500 }, { id: 's8', n: 'Khiên', t: 2, p: 500 }, { id: 's9', n: 'Tạo tường', t: 2, p: 500 },
        { id: 's10', n: 'Khóa', t: 3, p: 1500 }, { id: 's11', n: 'Kiếm 180', t: 3, p: 1500 }, { id: 's12', n: 'Bom', t: 3, p: 1500 }
    ];

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'flex';
    }

    // Xử lý màu
    ['h','s','b'].forEach(k => {
        document.getElementById(k+'-range').oninput = function() {
            document.getElementById(k+'-val').innerText = this.value;
            let h = document.getElementById('h-range').value;
            let s = document.getElementById('s-range').value;
            let l = document.getElementById('b-range').value;
            tankColor = `hsl(${h}, ${s}%, ${l}%)`;
            document.getElementById('tank-preview').style.backgroundColor = tankColor;
        }
    });

    // Tạo danh sách kỹ năng
    const grid = document.getElementById('skill-grid');
    skillsData.forEach(s => {
        let div = document.createElement('div');
        div.className = `skill-slot tier-${s.t}`;
        div.innerHTML = s.n;
        div.onclick = () => {
            if(currentSkills.includes(s.id)) {
                currentSkills = currentSkills.filter(i => i !== s.id);
                div.classList.remove('selected');
            } else if(currentSkills.length < 3 && coins >= s.p) {
                coins -= s.p;
                currentSkills.push(s.id);
                div.classList.add('selected');
                document.getElementById('coin-txt').innerText = coins;
            }
            document.getElementById('skill-count').innerText = currentSkills.length;
        };
        grid.appendChild(div);
    });

    // --- LOGIC GAME ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let gameRunning = false;
    let player = { x: 100, y: 100, a: 0, hp: 100 };
    let boss = { x: 500, y: 300, a: 0, hp: 100, locked: false };
    let bullets = [], bombs = [];

    function startGame() {
        showScreen('none');
        canvas.style.display = 'block';
        document.getElementById('game-ui').style.display = 'block';
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        gameRunning = true;
        loop();
    }

    // Logic kỹ năng Huyền thoại
    function useHuyenThoai(id) {
        if(id === 's10') { // Khóa địch
            boss.locked = true;
            setTimeout(() => boss.locked = false, 5000);
        }
        if(id === 's12') { // Đặt bom
            bombs.push({ x: player.x, y: player.y, time: Date.now() });
        }
    }

    function loop() {
        if(!gameRunning) return;
        ctx.fillStyle = "#1a1a1a"; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Vẽ Tank Player
        ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.a);
        ctx.fillStyle = tankColor; ctx.fillRect(-20, -15, 40, 30);
        ctx.strokeStyle = "black"; ctx.lineWidth = 4; ctx.strokeRect(-20, -15, 40, 30);
        ctx.restore();

        // Vẽ Boss
        if(!boss.locked) { boss.x += (player.x - boss.x) * 0.01; boss.y += (player.y - boss.y) * 0.01; }
        ctx.fillStyle = boss.locked ? "blue" : "red"; ctx.fillRect(boss.x-20, boss.y-20, 40, 40);

        // Vẽ Bom (s12)
        bombs.forEach((b, i) => {
            ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, 7); ctx.fill();
            if(Date.now() - b.time > 20000 || Math.hypot(b.x-boss.x, b.y-boss.y) < 30) {
                boss.hp -= 50; bombs.splice(i, 1);
            }
        });

        requestAnimationFrame(loop);
    }

    window.onclick = () => { if(gameRunning) useHuyenThoai(currentSkills[0]); };
</script>
</body>
</html>
