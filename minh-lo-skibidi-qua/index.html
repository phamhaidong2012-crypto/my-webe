<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI v11 - Path Safety</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: white; pointer-events: none; z-index: 10; }
        .stat { font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">MÁU BOSS: <span id="hp" style="color: #ff3333;">3</span></div>
    <div style="font-size: 11px; color: #0f0;">PATH VALIDATION: ACTIVE | NO COLLISION DRIVE</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 225;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;
    const BOSS_HITBOX = 17; 

    let boss = { x: ARENA_X, y: ARENA_Y, angle: 0, hp: 3, targetX: ARENA_X, targetY: ARENA_Y, isMoving: false };
    let bullets = [];

    window.addEventListener('pointerdown', (e) => {
        if (Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y) <= ARENA_RADIUS) return;
        setTimeout(() => {
            const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
            bullets.push({ x: e.clientX, y: e.clientY, vx: Math.cos(angle) * 8.5, vy: Math.sin(angle) * 8.5 });
        }, 500);
    });

    function getDist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }

    function distPointToLine(px, py, b) {
        const t = ((px - b.x) * b.vx + (py - b.y) * b.vy) / (b.vx**2 + b.vy**2);
        if (t < 0) return getDist(px, py, b.x, b.y);
        return getDist(px, py, b.x + t * b.vx, b.y + t * b.vy);
    }

    // Kiểm tra xem một đoạn thẳng (đường di chuyển của Boss) có bị đạn cắt ngang không
    function isPathDangerous(startX, startY, endX, endY) {
        const steps = 10;
        for (let i = 0; i <= steps; i++) {
            let checkX = startX + (endX - startX) * (i / steps);
            let checkY = startY + (endY - startY) * (i / steps);
            if (bullets.some(b => distPointToLine(checkX, checkY, b) < 35)) return true;
        }
        return false;
    }

    function findSafePath() {
        let bestPoint = { x: boss.x, y: boss.y };
        let minScore = Infinity;

        for (let a = 0; a < Math.PI * 2; a += Math.PI / 10) {
            for (let r = 0; r < ARENA_RADIUS - 20; r += 45) {
                let tx = ARENA_X + Math.cos(a) * r;
                let ty = ARENA_Y + Math.sin(a) * r;

                let danger = 0;
                bullets.forEach(b => {
                    let d = distPointToLine(tx, ty, b);
                    if (d < 40) danger += (40 - d) * 100;
                });

                // Kiểm tra lộ trình di chuyển từ vị trí hiện tại đến điểm test
                if (isPathDangerous(boss.x, boss.y, tx, ty)) danger += 5000;

                let distToCenter = getDist(tx, ty, ARENA_X, ARENA_Y);
                let distFromBoss = getDist(tx, ty, boss.x, boss.y);
                
                let score = danger * 100 + distToCenter * 2 + distFromBoss;

                if (score < minScore) {
                    minScore = score;
                    bestPoint = { x: tx, y: ty };
                }
            }
        }

        // Chỉ đi nếu điểm mới an toàn hơn hẳn và lộ trình không có đạn
        if (!isPathDangerous(boss.x, boss.y, bestPoint.x, bestPoint.y) || bullets.length === 0) {
            boss.targetX = bestPoint.x;
            boss.targetY = bestPoint.y;
            boss.isMoving = true;
        } else {
            boss.isMoving = false; // Dừng lại nếu mọi đường đi đều nguy hiểm
        }
    }

    function update() {
        findSafePath();

        if (boss.isMoving) {
            const dx = boss.targetX - boss.x;
            const dy = boss.targetY - boss.y;
            const dist = getDist(boss.x, boss.y, boss.targetX, boss.targetY);

            if (dist > 2) {
                const angleToTarget = Math.atan2(dy, dx);
                let diff = angleToTarget - boss.angle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;

                let moveSpeed = 6;
                let steerLimit = 0.2;

                if (Math.abs(diff) > Math.PI / 2) {
                    let revDiff = diff > 0 ? diff - Math.PI : diff + Math.PI;
                    boss.angle += revDiff * steerLimit;
                    moveSpeed = -6;
                } else {
                    boss.angle += diff * steerLimit;
                    moveSpeed = 6;
                }

                // Dự phòng: Nếu bước đi tiếp theo đâm vào đạn, dừng lại
                let nextX = boss.x + Math.cos(boss.angle) * moveSpeed;
                let nextY = boss.y + Math.sin(boss.angle) * moveSpeed;
                
                if (!bullets.some(b => distPointToLine(nextX, nextY, b) < 32)) {
                    boss.x = nextX;
                    boss.y = nextY;
                } else {
                    boss.isMoving = false; // Emergency Brake
                }
            }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            if (getDist(b.x, b.y, boss.x, boss.y) < BOSS_HITBOX) {
                boss.hp--; hpTxt.innerText = boss.hp;
                bullets.splice(i, 1);
                if (boss.hp <= 0) { alert("VICTORY!"); location.reload(); }
                continue;
            }
            if (b.x < -100 || b.x > canvas.width+100 || b.y < -100 || b.y > canvas.height+100) bullets.splice(i, 1);
        }
    }

    function draw() {
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath(); ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = '#222'; ctx.stroke();

        // Đường kẻ xanh lá
        ctx.lineWidth = 1;
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x + b.vx * 400, b.y + b.vy * 400);
            ctx.strokeStyle = 'rgba(0, 255, 100, 0.2)';
            ctx.stroke();
        });

        // Boss
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(boss.angle);
        ctx.fillStyle = '#111'; ctx.fillRect(-22, -22, 44, 10); ctx.fillRect(-22, 12, 44, 10);
        ctx.fillStyle = (boss.hp === 1) ? '#ff00ff' : '#ff3333';
        ctx.fillRect(-18, -15, 36, 30);
        ctx.fillStyle = '#000'; ctx.fillRect(0, -4, 25, 8);
        ctx.restore();

        // Đạn
        ctx.fillStyle = '#0f0';
        bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
