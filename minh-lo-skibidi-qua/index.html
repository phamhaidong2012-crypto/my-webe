<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trân Ngu Tank Ultimate</title>
    <style>
        body { margin: 0; overflow: hidden; background: #999; font-family: sans-serif; touch-action: none; color: white; }
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; background: #aaa; }
        
        /* Giao diện chính */
        .btn-box { width: 100px; height: 100px; background: white; border: 8px solid black; color: black; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; text-align: center; font-size: 20px; margin: 20px; }
        #play-btn { background: #0f0; border: none; width: 150px; height: 60px; color: black; font-size: 25px; cursor: pointer; font-weight: bold; }

        /* Chỉnh màu */
        .color-panel { background: white; padding: 20px; color: black; display: flex; gap: 20px; border: 4px solid black; }
        
        /* Kỹ năng */
        .skill-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; background: #888; padding: 15px; border: 2px solid white; }
        .skill-slot { width: 50px; height: 50px; background: white; border: 4px solid #ccc; cursor: pointer; font-size: 8px; color: black; font-weight: bold; display: flex; align-items: center; justify-content: center; text-align: center; }
        .tier-0 { border-color: #0f0; } .tier-1 { border-color: #00ffff; } .tier-2 { border-color: #ff0; } .tier-3 { border-color: #f0f; }
        .selected-skill { background: #cfc; position: relative; }
        .selected-skill::after { content: "LẮP"; position: absolute; bottom: 0; font-size: 7px; background: green; color: white; width: 100%; text-align: center; }

        /* Pop-up Chi tiết */
        #skill-detail { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; background: #eee; border: 5px solid black; color: black; padding: 15px; display: none; flex-direction: column; align-items: center; z-index: 2000; }
        #video-sim { width: 100%; height: 100px; background: black; margin: 10px 0; position: relative; overflow: hidden; }
        .buy-btn { width: 100%; padding: 12px; font-weight: bold; border: none; color: white; cursor: pointer; margin-top: 10px; }
        .btn-green { background: #28a745; } .btn-red { background: #dc3545; }

        canvas { display: none; background: #1a1a1a; }
        #move-controls { position: fixed; bottom: 20px; left: 20px; display: none; grid-template-columns: repeat(3, 55px); gap: 5px; z-index: 100; }
        .ctrl-btn { width: 55px; height: 55px; background: rgba(255,255,255,0.3); border: 2px solid white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
</head>
<body>

<div id="main-menu" class="screen" style="display: flex;">
    <div style="font-size: 20px; color: gold; margin-bottom: 10px; -webkit-text-stroke: 1px black;">TIỀN: <span id="coin-txt">1000</span></div>
    <div style="display: flex;">
        <div class="btn-box" onclick="showScreen('skill-menu')">kĩ<br>năng</div>
        <div class="btn-box" onclick="showScreen('color-menu')">màu<br>xe</div>
    </div>
    <button id="play-btn" onclick="startGame()">chơi<br><span style="font-size:12px">level: 1</span></button>
</div>

<div id="color-menu" class="screen">
    <h1 style="color:white; -webkit-text-stroke: 1px black;">màu xe tăng</h1>
    <div class="color-panel">
        <div>
            Hue <input type="range" id="h-range" min="0" max="360" value="0"><br>
            Sat <input type="range" id="s-range" min="0" max="100" value="50"><br>
            Bri <input type="range" id="b-range" min="0" max="100" value="50">
        </div>
        <div id="preview-tank" style="width:60px; height:60px; border:3px solid black; background:hsl(0, 50%, 50%);"></div>
    </div>
    <button class="btn-box" style="height:40px; margin-top:20px" onclick="showScreen('main-menu')">XONG</button>
</div>

<div id="skill-menu" class="screen">
    <h1 style="color:white; -webkit-text-stroke: 1px black;">kĩ năng</h1>
    <div class="skill-grid" id="grid"></div>
    <div id="skill-detail">
        <h2 id="sd-name">Tên</h2>
        <div id="video-sim"><div id="sim-bullet" style="position:absolute; top:45px; width:10px; height:10px; background:yellow; border-radius:50%;"></div></div>
        <p id="sd-desc" style="font-size:11px; text-align:center"></p>
        <p>GIÁ: <span id="sd-price">0</span> Xu</p>
        <button id="buy-action" class="buy-btn">MUA</button>
        <button onclick="closeDetail()" style="margin-top:5px; background:none; border:none; text-decoration:underline;">Đóng</button>
    </div>
    <button class="btn-box" style="height:40px; margin-top:20px" onclick="showScreen('main-menu')">THOÁT</button>
</div>

<div id="move-controls">
    <div></div><div class="ctrl-btn" id="up">↑</div><div></div>
    <div class="ctrl-btn" id="left">⟲</div><div class="ctrl-btn" id="down">↓</div><div class="ctrl-btn" id="right">⟳</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    let coins = 1000, owned = [], active = [], tankCol = "hsl(0, 50%, 50%)";
    const skills = [
        { id: 's1', n: '5 VIÊN', t: 0, p: 10, d: 'Bắn liên tiếp 5 viên đạn thường.' },
        { id: 's4', n: 'LASER', t: 1, p: 200, d: 'Tia laser mạnh, không xuyên tường.' },
        { id: 's7', n: 'LASER X', t: 2, p: 500, d: 'Laser hiếm, xuyên mọi vật cản.' },
        { id: 's10', n: 'KHÓA', t: 3, p: 1500, d: 'Huyền thoại: Khóa địch 5 giây.' },
        { id: 's11', n: 'KIẾM', t: 3, p: 1500, d: 'Huyền thoại: Quét kiếm 180 độ.' },
        { id: 's12', n: 'BOM', t: 3, p: 1500, d: 'Huyền thoại: Đặt bom hẹn giờ.' }
    ];

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        if(id !== 'none') document.getElementById(id).style.display = 'flex';
    }

    function initGrid() {
        const g = document.getElementById('grid'); g.innerHTML = '';
        skills.forEach(s => {
            let d = document.createElement('div');
            d.className = `skill-slot tier-${s.t} ${active.includes(s.id)?'selected-skill':''}`;
            d.innerHTML = s.n;
            d.onclick = () => openDetail(s);
            g.appendChild(d);
        });
    }

    function openDetail(s) {
        const d = document.getElementById('skill-detail'); d.style.display = 'flex';
        document.getElementById('sd-name').innerText = s.n;
        document.getElementById('sd-desc').innerText = s.d;
        document.getElementById('sd-price').innerText = s.p;
        const btn = document.getElementById('buy-action');
        
        if(owned.includes(s.id)) {
            btn.innerText = active.includes(s.id) ? "ĐANG LẮP" : "LẮP CHIÊU";
            btn.className = "buy-btn btn-green";
            btn.onclick = () => { if(active.length<3 && !active.includes(s.id)) { active.push(s.id); initGrid(); closeDetail(); } };
        } else {
            btn.innerText = "MUA NGAY";
            btn.className = coins >= s.p ? "buy-btn btn-green" : "buy-btn btn-red";
            btn.onclick = () => { if(coins >= s.p) { coins -= s.p; owned.push(s.id); document.getElementById('coin-txt').innerText = coins; initGrid(); openDetail(s); } };
        }
    }

    function closeDetail() { document.getElementById('skill-detail').style.display = 'none'; }

    // Chỉnh màu xe
    ['h','s','b'].forEach(k => {
        document.getElementById(k+'-range').oninput = () => {
            let h = document.getElementById('h-range').value, s = document.getElementById('s-range').value, b = document.getElementById('b-range').value;
            tankCol = `hsl(${h}, ${s}%, ${b}%)`;
            document.getElementById('preview-tank').style.backgroundColor = tankCol;
        };
    });

    function startGame() {
        showScreen('none');
        document.getElementById('gameCanvas').style.display = 'block';
        document.getElementById('move-controls').style.display = 'grid';
        // Logic game maze và tank ở đây...
        alert("BẮT ĐẦU VỚI LEVEL 1");
    }

    initGrid();
</script>
</body>
</html>
