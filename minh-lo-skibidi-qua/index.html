<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tank Maze x2 Zoom - Mouse Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020202; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: #0f0; pointer-events: none; z-index: 10; font-weight: bold; }
        .hp-bar { color: #f00; font-size: 24px; }
        #death-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(136, 0, 0, 0.8); color: white; display: none;
            justify-content: center; align-items: center; flex-direction: column;
            font-size: 50px; font-weight: 900; z-index: 100;
        }
    </style>
</head>
<body>

<div id="ui">
    <div>TANK HP: <span id="p-hp" class="hp-bar">3</span> | BOSS HP: <span id="b-hp" class="hp-bar">5</span></div>
    <div style="font-size: 14px; color: #888;">GIỮ CHUỘT TRÁI ĐỂ DI CHUYỂN | CLICK/SPACE ĐỂ BẮN</div>
</div>

<div id="death-screen">
    <div id="status-msg">MISSION FAILED</div>
    <button onclick="location.reload()" style="margin-top:20px; padding:15px 30px; font-size:20px; cursor:pointer;">REBOOT SYSTEM</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const pHPText = document.getElementById('p-hp'), bHPText = document.getElementById('b-hp');
    const deathScreen = document.getElementById('death-screen'), statusMsg = document.getElementById('status-msg');

    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    // PHÓNG TO X2: Tăng GRID_SIZE lên 100
    const GRID_SIZE = 100, BULLET_SPEED = 7, BULLET_LIFE = 5000;
    const COLS = Math.floor(canvas.width / GRID_SIZE), ROWS = Math.floor(canvas.height / GRID_SIZE);
    
    let maze = [];
    class Cell {
        constructor(c, r) { this.c = c; this.r = r; this.walls = [true, true, true, true]; this.visited = false; }
        draw() {
            let x = this.c * GRID_SIZE, y = this.r * GRID_SIZE;
            ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 5; ctx.beginPath();
            if (this.walls[0]) { ctx.moveTo(x, y); ctx.lineTo(x + GRID_SIZE, y); }
            if (this.walls[1]) { ctx.moveTo(x + GRID_SIZE, y); ctx.lineTo(x + GRID_SIZE, y + GRID_SIZE); }
            if (this.walls[2]) { ctx.moveTo(x + GRID_SIZE, y + GRID_SIZE); ctx.lineTo(x, y + GRID_SIZE); }
            if (this.walls[3]) { ctx.moveTo(x, y + GRID_SIZE); ctx.lineTo(x, y); }
            ctx.stroke();
        }
    }

    function initMaze() {
        for (let r = 0; r < ROWS; r++) { maze[r] = []; for (let c = 0; c < COLS; c++) maze[r][c] = new Cell(c, r); }
        let current = maze[0][0], stack = []; current.visited = true;
        do {
            let neighbors = [], c = current.c, r = current.r;
            [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]].forEach(d => {
                let nc = c+d[0], nr = r+d[1], n = maze[nr] && maze[nr][nc];
                if (n && !n.visited) neighbors.push({cell: n, w1: d[2], w2: d[3]});
            });
            if (neighbors.length > 0) {
                let next = neighbors[Math.floor(Math.random()*neighbors.length)];
                next.cell.visited = true; stack.push(current);
                current.walls[next.w1] = false; next.cell.walls[next.w2] = false; current = next.cell;
            } else if (stack.length > 0) current = stack.pop();
        } while (stack.length > 0);
    }
    initMaze();

    let player = { x: GRID_SIZE/2, y: GRID_SIZE/2, angle: 0, hp: 3 };
    let boss = { x: canvas.width - GRID_SIZE/2, y: canvas.height - GRID_SIZE/2, angle: 0, hp: 5, targetX: 0, targetY: 0 };
    let bullets = [];
    let mouse = { x: 0, y: 0, down: false };

    window.onmousemove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
    window.onmousedown = (e) => { mouse.down = true; fire(player, '#0f0', 'player'); };
    window.onmouseup = () => { mouse.down = false; };
    window.onkeydown = (e) => { if(e.code === 'Space') fire(player, '#0f0', 'player'); };

    function fire(obj, color, owner) {
        let vx = Math.cos(obj.angle) * BULLET_SPEED, vy = Math.sin(obj.angle) * BULLET_SPEED;
        let b = { x: obj.x, y: obj.y, vx, vy, color, owner, spawnTime: Date.now() };
        calculateFuture(b); bullets.push(b);
    }

    function calculateFuture(b) {
        let tx = b.x, ty = b.y, tvx = b.vx, tvy = b.vy;
        b.futurePoints = [{x: tx, y: ty}];
        for(let i=0; i<6; i++) { 
            for(let step=0; step<25; step++) {
                tx += tvx; ty += tvy;
                let cx = Math.floor(tx/GRID_SIZE), cy = Math.floor(ty/GRID_SIZE);
                if(!maze[cy] || !maze[cy][cx]) break;
                if((tvx > 0 && maze[cy][cx].walls[1] && tx > (cx+1)*GRID_SIZE-8) || (tvx < 0 && maze[cy][cx].walls[3] && tx < cx*GRID_SIZE+8)) tvx*=-1;
                if((tvy > 0 && maze[cy][cx].walls[2] && ty > (cy+1)*GRID_SIZE-8) || (tvy < 0 && maze[cy][cx].walls[0] && ty < cy*GRID_SIZE+8)) tvy*=-1;
            }
            b.futurePoints.push({x: tx, y: ty});
        }
    }

    function isWall(x, y) {
        let cx = Math.floor(x/GRID_SIZE), cy = Math.floor(y/GRID_SIZE);
        if(!maze[cy] || !maze[cy][cx]) return true;
        let b = 15; // Buffer
        if (maze[cy][cx].walls[0] && y < cy*GRID_SIZE + b) return true;
        if (maze[cy][cx].walls[1] && x > (cx+1)*GRID_SIZE - b) return true;
        if (maze[cy][cx].walls[2] && y > (cy+1)*GRID_SIZE - b) return true;
        if (maze[cy][cx].walls[3] && x < cx*GRID_SIZE + b) return true;
        return false;
    }

    let lastBossFire = 0;
    function update() {
        if (player.hp <= 0 || boss.hp <= 0) return;

        // DI CHUYỂN THEO CHUỘT: Quay mặt về hướng chuột
        let dx = mouse.x - player.x, dy = mouse.y - player.y;
        player.angle = Math.atan2(dy, dx);
        if(mouse.down && Math.hypot(dx, dy) > 10) {
            let nx = player.x + Math.cos(player.angle) * 4;
            let ny = player.y + Math.sin(player.angle) * 4;
            if(!isWall(nx, ny)) { player.x = nx; player.y = ny; }
        }

        // BOSS AI: Tới gần người chơi + Né đạn
        let bossRisk = (tx, ty) => {
            let r = 0;
            bullets.forEach(b => {
                if(b.owner === 'player' && b.futurePoints) {
                    for(let i=0; i<b.futurePoints.length-1; i++) {
                        let p1 = b.futurePoints[i], p2 = b.futurePoints[i+1];
                        let d = Math.abs((p2.x-p1.x)*(p1.y-ty) - (p1.x-tx)*(p2.y-p1.y)) / Math.hypot(p2.x-p1.x, p2.y-p1.y);
                        if(d < 40) r += 2000;
                    }
                }
            });
            // Thêm mục tiêu "đến gần người chơi"
            r += Math.hypot(tx - player.x, ty - player.y) * 0.5;
            return r + (isWall(tx, ty) ? 9999 : 0);
        };

        let bestX = boss.x, bestY = boss.y, minR = bossRisk(boss.x, boss.y);
        for(let a=0; a<Math.PI*2; a+=Math.PI/4) {
            let tx = boss.x + Math.cos(a)*50, ty = boss.y + Math.sin(a)*50;
            let r = bossRisk(tx, ty);
            if(r < minR) { minR = r; bestX = tx; bestY = ty; }
        }
        boss.x += (bestX - boss.x) * 0.04; boss.y += (bestY - boss.y) * 0.04;
        boss.angle = Math.atan2(player.y - boss.y, player.x - boss.x);

        if(Date.now() - lastBossFire > 1200) { fire(boss, '#f00', 'boss'); lastBossFire = Date.now(); }

        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            let cx = Math.floor(b.x/GRID_SIZE), cy = Math.floor(b.y/GRID_SIZE);
            if(maze[cy] && maze[cy][cx]) {
                if((b.vx>0 && maze[cy][cx].walls[1] && b.x>(cx+1)*GRID_SIZE-5) || (b.vx<0 && maze[cy][cx].walls[3] && b.x<cx*GRID_SIZE+5)) b.vx*=-1;
                if((b.vy>0 && maze[cy][cx].walls[2] && b.y>(cy+1)*GRID_SIZE-5) || (b.vy<0 && maze[cy][cx].walls[0] && b.y<cy*GRID_SIZE+5)) b.vy*=-1;
            }
            if(Date.now() - b.spawnTime > BULLET_LIFE) bullets.splice(i, 1);

            if(Math.hypot(b.x - boss.x, b.y - boss.y) < 20 && b.owner === 'player') {
                boss.hp--; bHPText.innerText = boss.hp; bullets.splice(i, 1);
                if(boss.hp <= 0) { statusMsg.innerText = "BOSS ELIMINATED"; deathScreen.style.display="flex"; }
            }
            if(Math.hypot(b.x - player.x, b.y - player.y) < 20 && b.owner === 'boss') {
                player.hp--; pHPText.innerText = player.hp; bullets.splice(i, 1);
                if(player.hp <= 0) { statusMsg.innerText = "TANK DESTROYED"; deathScreen.style.display="flex"; }
            }
        });
    }

    function draw() {
        ctx.fillStyle = '#020202'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        maze.forEach(row => row.forEach(c => c.draw()));

        // Vẽ Tank Player (X2 size)
        ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
        ctx.fillStyle = '#0f0'; ctx.fillRect(-20, -18, 40, 36); 
        ctx.fillStyle = '#0a0'; ctx.fillRect(5, -5, 30, 10); // Nòng súng
        ctx.restore();

        // Vẽ Boss (X2 size)
        ctx.save(); ctx.translate(boss.x, boss.y); ctx.rotate(boss.angle);
        ctx.fillStyle = '#f33'; ctx.fillRect(-22, -22, 44, 44);
        ctx.fillStyle = '#900'; ctx.fillRect(10, -6, 25, 12);
        ctx.restore();

        // Vẽ Đạn & Dự báo (Đường đạn Boss mảnh hơn)
        bullets.forEach(b => {
            if(b.futurePoints) {
                ctx.beginPath(); ctx.moveTo(b.x, b.y);
                b.futurePoints.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.strokeStyle = b.owner === 'player' ? 'rgba(0, 255, 0, 0.15)' : 'rgba(255, 0, 0, 0.1)';
                ctx.lineWidth = (b.owner === 'boss') ? 3 : 2; // Đường boss nhỏ và mảnh
                ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
            }
            ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill();
        });

        update(); requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
