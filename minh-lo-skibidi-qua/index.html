<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trân Ngu Tank - Ultimate</title>
    <style>
        body { margin: 0; overflow: hidden; background: #999; font-family: sans-serif; touch-action: none; color: white; }
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; background: #aaa; }
        #main-menu { display: flex; }
        .btn-box { width: 100px; height: 100px; background: white; border: 8px solid black; color: black; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; text-align: center; font-size: 20px; margin: 20px; }
        #play-btn { background: #0f0; border: none; width: 150px; height: 60px; color: black; font-size: 25px; cursor: pointer; }

        /* Kỹ năng */
        #skill-menu { background: #888; border: 4px solid #00ffff; }
        .skill-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #888; padding: 20px; }
        .skill-slot { width: 65px; height: 65px; background: white; border: 4px solid #ccc; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; font-size: 10px; color: black; font-weight: bold; text-align: center; }
        .tier-0 { border-color: #0f0; } .tier-1 { border-color: #00ffff; } .tier-2 { border-color: #ff0; } .tier-3 { border-color: #f0f; }
        .selected { background: #cfc; border-style: dotted; }
        .owned::after { content: "✓"; position: absolute; top: 0; right: 2px; color: green; font-size: 14px; }

        /* Pop-up */
        #skill-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; background: #eee; border: 5px solid black; color: black; padding: 15px; display: none; flex-direction: column; align-items: center; z-index: 2000; }
        #video-preview { width: 240px; height: 130px; background: black; margin: 10px 0; position: relative; overflow: hidden; border: 2px solid #555; }
        .buy-btn { width: 100%; padding: 10px; font-weight: bold; border: none; color: white; cursor: pointer; margin-top: 10px; }
        .btn-green { background: #28a745; } .btn-red { background: #dc3545; }

        /* Nút trong trận */
        #controls { position: fixed; bottom: 20px; left: 20px; display: none; grid-template-columns: repeat(3, 60px); gap: 10px; z-index: 500; }
        #skill-buttons { position: fixed; bottom: 20px; right: 20px; display: none; flex-direction: column; gap: 10px; z-index: 500; }
        .joy-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.5); border: 3px solid black; color: black; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
        .skill-btn { width: 70px; height: 70px; background: orange; border-radius: 50%; border: 4px solid white; color: white; font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; }

        canvas { display: none; background: #1a1a1a; }
        #game-ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; display:none; }
    </style>
</head>
<body>

<div id="main-menu" class="screen">
    <div style="display: flex;">
        <div class="btn-box" onclick="showScreen('skill-menu')">kĩ<br>năng</div>
        <div class="btn-box" onclick="showScreen('color-menu')">màu<br>xe</div>
    </div>
    <button id="play-btn" onclick="startGame()">CHƠI</button>
    <div style="margin-top:10px">Xu: <span id="coin-txt">1000</span></div>
</div>

<div id="skill-menu" class="screen">
    <h1 style="color:white; -webkit-text-stroke: 1px black;">kĩ năng</h1>
    <div class="skill-grid" id="skill-grid"></div>
    <p>Đã chọn: <span id="skill-count">0</span>/3</p>
    <button class="btn-box" style="width:80px; height:40px" onclick="showScreen('main-menu')">XONG</button>

    <div id="skill-popup">
        <h2 id="pop-name" style="margin:0">Tên</h2>
        <div id="video-preview"></div>
        <p id="pop-desc" style="font-size:11px; text-align:center"></p>
        <div style="font-weight:bold">GIÁ: <span id="pop-price">0</span> Xu</div>
        <button id="pop-buy-btn" class="buy-btn">MUA</button>
        <button onclick="closePopup()" style="margin-top:5px; background:none; text-decoration:underline;">Đóng</button>
    </div>
</div>

<div id="color-menu" class="screen">
    <h1 style="color:white">màu xe</h1>
    <div style="background:white; padding:15px; color:black; border:4px solid black;">
        H <input type="range" id="h-range" min="0" max="360" value="0"><br>
        S <input type="range" id="s-range" min="0" max="100" value="50"><br>
        B <input type="range" id="b-range" min="0" max="100" value="50">
        <div id="tank-preview" style="width:50px; height:50px; border:2px solid black; margin-top:10px;"></div>
    </div>
    <button class="btn-box" style="width:80px; height:40px" onclick="showScreen('main-menu')">XONG</button>
</div>

<div id="controls">
    <div></div><div class="joy-btn" onmousedown="move('up')" onmouseup="stopMove()">↑</div><div></div>
    <div class="joy-btn" onmousedown="move('left')" onmouseup="stopMove()">←</div><div class="joy-btn" onmousedown="move('down')" onmouseup="stopMove()">↓</div><div class="joy-btn" onmousedown="move('right')" onmouseup="stopMove()">→</div>
</div>
<div id="skill-buttons"></div>

<div id="game-ui">
    <div id="hp-txt">HP: 100</div>
    <div id="boss-hp-txt" style="color:red">BOSS: 100</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    let coins = 1000, currentSkills = [], ownedSkills = [], tankColor = "hsl(0, 50%, 50%)";
    const skillsData = [
        { id: 's1', n: '5 VIÊN', t: 0, p: 10, d: 'Bắn 5 viên liên tiếp dội tường.' },
        { id: 's2', n: 'TỐC +10%', t: 0, p: 10, d: 'Tăng tốc độ chạy.' },
        { id: 's4', n: 'LASER', t: 1, p: 200, d: 'Tia laser không xuyên tường.' },
        { id: 's10', n: 'KHÓA', t: 3, p: 1500, d: 'Khóa địch 5 giây.' },
        { id: 's11', n: 'KIẾM', t: 3, p: 1500, d: 'Quét 180 độ.' },
        { id: 's12', n: 'BOM', t: 3, p: 1500, d: 'Đặt bom hẹn giờ.' }
    ];

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        if(id !== 'none') document.getElementById(id).style.display = 'flex';
    }

    function renderSkills() {
        const grid = document.getElementById('skill-grid');
        grid.innerHTML = '';
        skillsData.forEach(s => {
            let div = document.createElement('div');
            div.className = `skill-slot tier-${s.t} ${currentSkills.includes(s.id)?'selected':''} ${ownedSkills.includes(s.id)?'owned':''}`;
            div.innerHTML = s.n;
            div.onclick = () => openPopup(s);
            grid.appendChild(div);
        });
    }

    function openPopup(skill) {
        const pop = document.getElementById('skill-popup');
        pop.style.display = 'flex';
        document.getElementById('pop-name').innerText = skill.n;
        document.getElementById('pop-desc').innerText = skill.d;
        document.getElementById('pop-price').innerText = skill.p;
        
        const vid = document.getElementById('video-preview');
        vid.innerHTML = '';
        if(skill.id === 's1') {
            vid.innerHTML = '<div style="position:absolute;left:10px;top:60px;width:20px;height:15px;background:white;border:1px solid red"></div><div id="anim-bullet" style="position:absolute;left:30px;top:65px;width:5px;height:5px;background:yellow;border-radius:50%"></div><div style="position:absolute;right:10px;top:0;width:5px;height:100%;background:grey"></div>';
            let b = vid.querySelector('#anim-bullet');
            let x = 30, vx = 4;
            setInterval(() => { x += vx; if(x > 220 || x < 30) vx *= -1; b.style.left = x + 'px'; }, 20);
        }

        const btn = document.getElementById('pop-buy-btn');
        if(ownedSkills.includes(skill.id)) {
            btn.innerText = currentSkills.includes(skill.id) ? "ĐANG LẮP" : "LẮP CHIÊU";
            btn.className = "buy-btn btn-green";
            btn.onclick = () => {
                if(!currentSkills.includes(skill.id) && currentSkills.length < 3) currentSkills.push(skill.id);
                else currentSkills = currentSkills.filter(i => i !== skill.id);
                renderSkills(); closePopup();
            };
        } else {
            btn.innerText = "XÁC NHẬN MUA";
            btn.className = coins >= skill.p ? "buy-btn btn-green" : "buy-btn btn-red";
            btn.onclick = () => { if(coins >= skill.p) { coins -= skill.p; ownedSkills.push(skill.id); document.getElementById('coin-txt').innerText = coins; renderSkills(); openPopup(skill); } };
        }
    }

    function closePopup() { document.getElementById('skill-popup').style.display = 'none'; }

    // GAME TRẬN ĐẤU
    let player = { x: 100, y: 100, v: 0, a: 0 };
    function startGame() {
        showScreen('none');
        document.getElementById('gameCanvas').style.display = 'block';
        document.getElementById('controls').style.display = 'grid';
        document.getElementById('game-ui').style.display = 'block';
        const skBox = document.getElementById('skill-buttons');
        skBox.style.display = 'flex';
        skBox.innerHTML = '';
        currentSkills.forEach(id => {
            let s = skillsData.find(x => x.id === id);
            let b = document.createElement('div');
            b.className = 'skill-btn'; b.innerHTML = s.n;
            skBox.appendChild(b);
        });
        const canvas = document.getElementById('gameCanvas');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        update();
    }

    function move(dir) {
        if(dir === 'up') player.y -= 5;
        if(dir === 'down') player.y += 5;
        if(dir === 'left') player.x -= 5;
        if(dir === 'right') player.x += 5;
    }
    function stopMove() {}

    function update() {
        const ctx = document.getElementById('gameCanvas').getContext('2d');
        ctx.clearRect(0,0,3000,3000);
        ctx.fillStyle = tankColor;
        ctx.fillRect(player.x-20, player.y-15, 40, 30);
        requestAnimationFrame(update);
    }

    ['h','s','b'].forEach(k => {
        document.getElementById(k+'-range').oninput = () => {
            let h = document.getElementById('h-range').value, s = document.getElementById('s-range').value, b = document.getElementById('b-range').value;
            tankColor = `hsl(${h}, ${s}%, ${b}%)`;
            document.getElementById('tank-preview').style.backgroundColor = tankColor;
        };
    });

    renderSkills();
</script>
</body>
</html>
