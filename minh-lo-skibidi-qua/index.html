<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trân Ngu Tank - Skill Shop Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #999; font-family: sans-serif; touch-action: none; color: white; }
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; background: #aaa; }
        #main-menu { display: flex; }
        
        /* Giao diện chính */
        .btn-box { width: 100px; height: 100px; background: white; border: 8px solid black; color: black; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; text-align: center; font-size: 20px; margin: 20px; }
        
        /* Grid kỹ năng */
        .skill-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; background: #888; padding: 20px; border: 2px solid white; }
        .skill-slot { width: 55px; height: 55px; background: white; border: 4px solid #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; color: black; font-weight: bold; text-align: center; }
        .tier-0 { border-color: #0f0; } .tier-1 { border-color: #00ffff; } .tier-2 { border-color: #ff0; } .tier-3 { border-color: #f0f; }
        .owned { background: #e0ffe0; position: relative; }
        .owned::after { content: "✓"; position: absolute; top: 0; right: 2px; color: green; font-size: 12px; }

        /* Bảng chi tiết (Pop-up) */
        #skill-detail { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: #eee; border: 5px solid black; color: black; padding: 15px; display: none; flex-direction: column; align-items: center; z-index: 2000; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        #skill-video-sim { width: 200px; height: 120px; background: #000; margin: 10px 0; border: 2px solid #555; overflow: hidden; position: relative; }
        .buy-btn { width: 100%; padding: 10px; font-weight: bold; border: none; color: white; cursor: pointer; margin-top: 10px; }
        .can-buy { background: #28a745; } /* Xanh */
        .no-money { background: #dc3545; } /* Đỏ */

        canvas { display: none; background: #1a1a1a; }
    </style>
</head>
<body>

<div id="main-menu" class="screen">
    <div style="font-size: 24px; color: gold; margin-bottom: 10px; -webkit-text-stroke: 1px black;">XU CỦA BẠN: <span id="coin-txt">1000</span></div>
    <div style="display: flex;">
        <div class="btn-box" onclick="showScreen('skill-menu')">kĩ<br>năng</div>
        <div class="btn-box">màu<br>xe</div>
    </div>
    <button style="background:#0f0; width:150px; height:60px; font-size:20px; cursor:pointer">CHƠI</button>
</div>

<div id="skill-menu" class="screen">
    <h1 style="color:white; -webkit-text-stroke: 1px black;">KHO KĨ NĂNG</h1>
    <div class="skill-grid" id="skill-grid"></div>
    <button class="btn-box" style="width:100px; height:40px; margin-top:20px" onclick="showScreen('main-menu')">THOÁT</button>
</div>

<div id="skill-detail">
    <h2 id="sd-name" style="margin:0">Tên Skill</h2>
    <div id="skill-video-sim">
        <div id="sim-obj" style="position:absolute; width:10px; height:10px; background:yellow; border-radius:50%;"></div>
    </div>
    <p id="sd-desc" style="font-size:12px; text-align:center">Mô tả chi tiết kỹ năng sẽ hiển thị ở đây.</p>
    <div style="font-weight:bold">GIÁ: <span id="sd-price">0</span> Xu</div>
    <button id="sd-buy-btn" class="buy-btn">MUA NGAY</button>
    <button onclick="closeDetail()" style="margin-top:5px; background:none; border:none; text-decoration:underline; cursor:pointer">Đóng</button>
</div>

<script>
    let coins = 1000;
    let ownedSkills = [];
    let viewingSkill = null;

    const skillsData = [
        { id: 's1', n: '5 VIÊN', t: 0, p: 10, d: 'Bắn liên tiếp 5 viên đạn cực nhanh.' },
        { id: 's2', n: 'TỐC +10%', t: 0, p: 10, d: 'Tăng tốc độ di chuyển của xe tăng.' },
        { id: 's4', n: 'LASER', t: 1, p: 200, d: 'Tia laser cực mạnh nhưng không xuyên tường.' },
        { id: 's7', n: 'LASER X', t: 2, p: 500, d: 'Tia laser cao cấp, xuyên thủng mọi lớp tường.' },
        { id: 's10', n: 'KHÓA', t: 3, p: 1500, d: 'Khiến kẻ địch đứng im bất động trong 5 giây.' },
        { id: 's11', n: 'KIẾM 180', t: 3, p: 1500, d: 'Quét kiếm theo hình bán nguyệt gây sát thương lớn.' }
    ];

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'flex';
    }

    function initSkills() {
        const grid = document.getElementById('skill-grid');
        grid.innerHTML = '';
        skillsData.forEach(s => {
            let div = document.createElement('div');
            div.className = `skill-slot tier-${s.t} ${ownedSkills.includes(s.id) ? 'owned' : ''}`;
            div.innerHTML = s.n;
            div.onclick = () => openDetail(s);
            grid.appendChild(div);
        });
    }

    function openDetail(skill) {
        viewingSkill = skill;
        document.getElementById('skill-detail').style.display = 'flex';
        document.getElementById('sd-name').innerText = skill.n;
        document.getElementById('sd-desc').innerText = skill.d;
        document.getElementById('sd-price').innerText = skill.p;
        
        const btn = document.getElementById('sd-buy-btn');
        if (ownedSkills.includes(skill.id)) {
            btn.innerText = "ĐÃ SỞ HỮU";
            btn.className = "buy-btn can-buy";
            btn.disabled = true;
        } else {
            btn.disabled = false;
            if (coins >= skill.p) {
                btn.innerText = "MUA NGAY";
                btn.className = "buy-btn can-buy";
                btn.onclick = () => buySkill(skill);
            } else {
                btn.innerText = "KHÔNG ĐỦ XU";
                btn.className = "buy-btn no-money";
                btn.onclick = null;
            }
        }
        startSimulation(skill.id);
    }

    function buySkill(skill) {
        coins -= skill.p;
        ownedSkills.push(skill.id);
        document.getElementById('coin-txt').innerText = coins;
        initSkills();
        closeDetail();
    }

    function closeDetail() {
        document.getElementById('skill-detail').style.display = 'none';
        clearInterval(simInterval);
    }

    // Minh họa kỹ năng bằng chuyển động đơn giản (Simulation)
    let simInterval;
    function startSimulation(id) {
        const obj = document.getElementById('sim-obj');
        clearInterval(simInterval);
        let pos = 0;
        simInterval = setInterval(() => {
            pos = (pos + 5) % 200;
            if (id === 's1') obj.style.left = pos + 'px';
            if (id === 's10') obj.style.backgroundColor = (pos % 20 < 10) ? 'blue' : 'yellow';
            if (id === 's4') { obj.style.width = pos + 'px'; obj.style.height = '4px'; }
            else { obj.style.width = '10px'; obj.style.height = '10px'; }
        }, 50);
    }

    initSkills();
    showScreen('main-menu');
</script>
</body>
</html>
