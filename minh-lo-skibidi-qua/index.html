<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minh Lỏ Center</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        
        /* Nền di chuyển */
        #bg {
            position: fixed; width: 200vw; height: 200vh;
            background-image: 
                linear-gradient(to right, #222 1px, transparent 1px),
                linear-gradient(to bottom, #222 1px, transparent 1px);
            background-size: 100px 100px;
            z-index: 1;
        }

        /* Nhân vật chính - Cố định ở giữa */
        #player { 
            position: fixed; top: 50%; left: 50%; width: 80px; height: 80px; 
            background: lime; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; color: black; font-weight: bold;
            box-shadow: 0 0 30px lime; transform: translate(-50%, -50%); z-index: 100;
        }

        /* Lớp chứa các vật phẩm và bóng ma - Di chuyển cùng nền */
        #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }

        .ghost { 
            position: absolute; width: 80px; height: 80px; background: rgba(0, 255, 0, 0.15); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.2); font-size: 10px; z-index: 5; pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .item { position: absolute; font-weight: bold; font-size: 20px; transform: translate(-50%, -50%); z-index: 20; }
        
        #game-ui { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 2px solid lime; z-index: 200; color: white; }
        #controls { position: fixed; bottom: 20px; left: 20px; display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; z-index: 200; }
        .btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; user-select: none; }
        #btn-n { position: fixed; bottom: 20px; right: 20px; width: 80px; height: 80px; background: gold; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; z-index: 200; border: 4px solid white; }
    </style>
</head>
<body>

<div id="bg"></div>
<div id="container"></div>
<div id="player">Minh Lỏ</div>

<div id="game-ui">
    <div>Minh: <span id="c1">0</span>/10 | Lỏ: <span id="c2">0</span>/10</div>
    <div>Skibidi: <span id="c3">0</span>/10 | Quá: <span id="c4">0</span>/10</div>
</div>

<div id="controls">
    <div></div><div class="btn" id="up">↑</div><div></div>
    <div class="btn" id="left">←</div><div class="btn" id="down">↓</div><div class="btn" id="right">→</div>
</div>
<div id="btn-n">N</div>

<script>
    let posX = 0, posY = 0; // Vị trí ảo của người chơi
    const container = document.getElementById('container');
    const bg = document.getElementById('bg');
    const counts = { 'Minh': 0, 'Lỏ': 0, 'Skibidi': 0, 'Quá': 0 };
    let gameFinished = false, nPressed = 0;

    // Cập nhật vị trí nền và các vật thể
    function draw() {
        // Nền trôi ngược lại để tạo cảm giác di chuyển
        bg.style.backgroundPosition = `${-posX}px ${-posY}px`;
        container.style.transform = `translate(${-posX}px, ${-posY}px)`;
        checkCollision();
    }

    // Sinh bản sao mỗi 1 giây
    setInterval(() => {
        if(gameFinished) return;
        const ghost = document.createElement('div');
        ghost.className = 'ghost';
        ghost.innerText = 'Minh Lỏ';
        // Đặt bản sao tại đúng tọa độ ảo hiện tại (cộng thêm 50% màn hình để vào giữa)
        ghost.style.left = (posX + window.innerWidth/2) + 'px';
        ghost.style.top = (posY + window.innerHeight/2) + 'px';
        container.appendChild(ghost);
    }, 1000);

    // Tạo vật phẩm ngẫu nhiên
    const words = ['Minh', 'Lỏ', 'Skibidi', 'Quá'];
    words.forEach(word => {
        for(let i=0; i<10; i++) {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerText = word;
            item.style.color = `hsl(${Math.random()*360}, 100%, 70%)`;
            item.style.left = (Math.random() * 4000 - 2000) + 'px';
            item.style.top = (Math.random() * 4000 - 2000) + 'px';
            container.appendChild(item);
        }
    });

    function move(dx, dy) {
        if(gameFinished) return;
        posX += dx;
        posY += dy;
        draw();
    }

    // Điều khiển
    const speed = 30;
    window.addEventListener('keydown', e => {
        if(e.key === 'w' || e.key === 'ArrowUp') move(0, -speed);
        if(e.key === 's' || e.key === 'ArrowDown') move(0, speed);
        if(e.key === 'a' || e.key === 'ArrowLeft') move(-speed, 0);
        if(e.key === 'd' || e.key === 'ArrowRight') move(speed, 0);
    });

    const setupBtn = (id, dx, dy) => {
        const btn = document.getElementById(id);
        let interval;
        const start = () => interval = setInterval(() => move(dx, dy), 50);
        const stop = () => clearInterval(interval);
        btn.onmousedown = start; btn.onmouseup = stop;
        btn.ontouchstart = e => { e.preventDefault(); start(); };
        btn.ontouchend = stop;
    };
    setupBtn('up', 0, -20); setupBtn('down', 0, 20); setupBtn('left', -20, 0); setupBtn('right', 20, 0);

    function checkCollision() {
        const items = document.querySelectorAll('.item');
        // Tọa độ thực tế của người chơi trong Container
        const px = posX + window.innerWidth/2;
        const py = posY + window.innerHeight/2;

        items.forEach(item => {
            const ix = parseFloat(item.style.left);
            const iy = parseFloat(item.style.top);
            const d = Math.sqrt((px-ix)**2 + (py-iy)**2);
            if(d < 50) {
                const t = item.innerText;
                counts[t]++;
                document.getElementById('c1').innerText = counts['Minh'];
                document.getElementById('c2').innerText = counts['Lỏ'];
                document.getElementById('c3').innerText = counts['Skibidi'];
                document.getElementById('c4').innerText = counts['Quá'];
                item.remove();
                if(Object.values(counts).every(v => v >= 10)) {
                    gameFinished = true;
                    document.getElementById('btn-n').style.display = 'flex';
                }
            }
        });
    }

    document.getElementById('btn-n').onclick = () => {
        nPressed++;
        if(nPressed >= 10) {
            alert("CHÚC MỪNG MINH LỎ!");
            location.reload();
        }
    };
</script>
</body>
</html>
