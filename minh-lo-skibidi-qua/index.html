<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI Fixed - Precise Tank</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: white; pointer-events: none; z-index: 10; }
        .stat { font-size: 20px; text-shadow: 2px 2px 4px #000; font-weight: bold; }
        #overdrive-ui { color: #0ff; display: none; font-size: 14px; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">MÁU BOSS: <span id="hp" style="color: #ff4444;">3</span></div>
    <div id="overdrive-ui">CHẾ ĐỘ NÉ TỨC THỜI KÍCH HOẠT!</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');
    const odUI = document.getElementById('overdrive-ui');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Vòng tròn x1.5 kích thước ban đầu
    let arenaRadius = 225; 
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;

    let boss = { 
        x: ARENA_X, y: ARENA_Y, 
        angle: 0, hp: 3, 
        isOD: false, odTimer: 0,
        color: '#ff4444'
    };
    
    let bullets = [];

    window.addEventListener('pointerdown', (e) => {
        const dist = Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y);
        if (dist <= arenaRadius) return;

        setTimeout(() => {
            const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
            bullets.push({
                x: e.clientX, y: e.clientY,
                vx: Math.cos(angle) * 8,
                vy: Math.sin(angle) * 8,
                hit: false // Đánh dấu đạn đã trúng hay chưa
            });
        }, 500);
    });

    // Hàm tính khoảng cách từ điểm đến quỹ đạo đạn
    function getDistToPath(px, py, b) {
        const dx = b.vx; const dy = b.vy;
        const t = ((px - b.x) * dx + (py - b.y) * dy) / (dx * dx + dy * dy);
        if (t < 0) return Infinity;
        return Math.hypot(px - (b.x + t * dx), py - (b.y + t * dy));
    }

    function update() {
        // 1. Quản lý Overdrive (2 giây tính toán cực hạn)
        if (boss.odTimer > 0) {
            boss.odTimer -= 16;
            boss.isOD = true;
            odUI.style.display = 'block';
        } else {
            boss.isOD = false;
            odUI.style.display = 'none';
        }

        // 2. AI Né Đạn (Càng ít máu càng thông minh)
        let move = 0; let turn = 0;
        let danger = false;
        
        // Tầm né đạn hẹp lại khi ít máu để đạn "xẹt qua người"
        const dodgeThreshold = boss.hp === 1 ? 38 : 45;

        bullets.forEach(b => {
            const dPath = getDistToPath(boss.x, boss.y, b);
            const dBullet = Math.hypot(b.x - boss.x, b.y - boss.y);

            if (dPath < dodgeThreshold && dBullet < 250) {
                danger = true;
                const side = (boss.x - b.x) * (-b.vy) + (boss.y - b.y) * b.vx;
                const targetAngle = Math.atan2(b.vy * (side > 0 ? 1 : -1), b.vx * (side > 0 ? 1 : -1));
                
                let diff = targetAngle - boss.angle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;

                turn = diff > 0 ? 0.2 : -0.2;
                // Nếu góc lệch lớn thì lùi, nhỏ thì tiến
                move = Math.abs(diff) < Math.PI/2 ? (boss.isOD ? 7 : 4.5) : (boss.isOD ? -7 : -4.5);
            }
        });

        if (danger) {
            boss.angle += turn;
            let nx = boss.x + Math.cos(boss.angle) * move;
            let ny = boss.y + Math.sin(boss.angle) * move;
            if (Math.hypot(nx - ARENA_X, ny - ARENA_Y) < arenaRadius - 25) {
                boss.x = nx; boss.y = ny;
            }
        }

        // 3. Xử lý Va Chạm (Sửa lỗi mất máu ảo)
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;

            if (Math.hypot(b.x - boss.x, b.y - boss.y) < 22) {
                boss.hp--;
                boss.odTimer = 2000; // Kích hoạt 2 giây tính toán khi trúng
                hpTxt.innerText = boss.hp;
                bullets.splice(i, 1); // Xóa đạn ngay lập tức để không bị trừ máu tiếp
                
                if (boss.hp <= 0) {
                    alert("BOSS ĐÃ CẠN MÁU!");
                    location.reload();
                }
                continue;
            }

            // Xóa đạn ra khỏi màn hình
            if (b.x < -50 || b.x > canvas.width+50 || b.y < -50 || b.y > canvas.height+50) {
                bullets.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Vẽ Vòng tròn
        ctx.beginPath();
        ctx.arc(ARENA_X, ARENA_Y, arenaRadius, 0, Math.PI * 2);
        ctx.strokeStyle = boss.isOD ? '#0ff' : '#444';
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Vẽ Boss
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(boss.angle);
        
        // Hiệu ứng khi còn 1 máu
        if (boss.hp === 1) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = boss.isOD ? "cyan" : "red";
        }

        ctx.fillStyle = '#333'; // Xích
        ctx.fillRect(-22, -22, 44, 10);
        ctx.fillRect(-22, 12, 44, 10);
        ctx.fillStyle = boss.isOD ? '#fff' : (boss.hp === 1 ? '#ff00ff' : '#ff4444');
        ctx.fillRect(-18, -15, 36, 30); // Thân
        ctx.fillStyle = '#000';
        ctx.fillRect(0, -4, 25, 8); // Nòng
        ctx.restore();

        // Vẽ đạn
        ctx.fillStyle = '#0f0';
        bullets.forEach(b => {
            ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
        });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
