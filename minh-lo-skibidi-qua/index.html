<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI v18 - Laser Warning</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; touch-action: none; font-family: sans-serif; color: white; }
        canvas { display: block; }
        #ui-left { position: fixed; top: 15px; left: 15px; pointer-events: none; z-index: 10; }
        #ui-right { position: fixed; top: 15px; right: 15px; text-align: right; z-index: 10; }
        .stat { font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; margin-bottom: 5px; }
        #timer-container { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); pointer-events: none; }
        #timer { font-size: 40px; font-weight: 900; color: #ff3333; }
        #skill-panel { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; }
        .skill-btn { 
            width: 70px; height: 70px; background: rgba(30, 30, 30, 0.9); border: 2px solid #0f0; 
            border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; text-align: center;
        }
        .skill-btn.laser { border-color: #ff00ff; color: #ff00ff; }
    </style>
</head>
<body>

<div id="ui-left"><div class="stat">MÁU BOSS: <span id="hp" style="color: #ff3333;">3</span></div></div>
<div id="ui-right"><div class="stat" style="color: #ffd700;">XU: <span id="coins">0</span></div></div>
<div id="timer-container"><div id="timer">01:00</div></div>

<div id="skill-panel">
    <div class="skill-btn laser" onclick="useSkill('laser')">LASER<br>(1S CHỜ)</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');
    const coinsTxt = document.getElementById('coins');
    const timerTxt = document.getElementById('timer');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 225;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;
    const BOSS_HITBOX = 17;

    let boss = { x: ARENA_X, y: ARENA_Y, angle: 0, hp: 3, targetX: ARENA_X, targetY: ARENA_Y };
    let bullets = [];
    let lasers = []; // Quản lý laser đang chờ
    let timeLeft = 60;
    let coins = parseInt(localStorage.getItem('tankCoins') || 0);
    coinsTxt.innerText = coins;

    const timerInterval = setInterval(() => {
        timeLeft--;
        let s = timeLeft % 60;
        timerTxt.innerText = `00:${s.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) { clearInterval(timerInterval); alert("HẾT GIỜ!"); location.reload(); }
    }, 1000);

    function useSkill(type) {
        if (type === 'laser') {
            const angle = Math.atan2(boss.y - ARENA_Y, boss.x - ARENA_X);
            // Thêm hiệu ứng báo trước
            lasers.push({ 
                x: ARENA_X, y: ARENA_Y, angle: angle, 
                timer: 60, // 60 frames = 1 giây
                active: false 
            });
        }
    }

    window.addEventListener('pointerdown', (e) => {
        if (e.clientX > canvas.width - 100) return;
        if (Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y) <= ARENA_RADIUS) return;
        setTimeout(() => {
            const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
            bullets.push({ x: e.clientX, y: e.clientY, vx: Math.cos(angle) * 8.5, vy: Math.sin(angle) * 8.5 });
        }, 500);
    });

    function checkFutureCollision(testX, testY, futureFrames) {
        for (let f = 1; f <= futureFrames; f++) {
            // Kiểm tra đạn thường
            for (let b of bullets) {
                let fbX = b.x + b.vx * f;
                let fbY = b.y + b.vy * f;
                if (Math.hypot(testX - fbX, testY - fbY) < BOSS_HITBOX + 12) return true;
            }
            // Kiểm tra Laser sắp bắn (Dự báo đường thẳng)
            for (let l of lasers) {
                let dist = distToSegment(testX, testY, l.x, l.y, l.x + Math.cos(l.angle)*500, l.y + Math.sin(l.angle)*500);
                if (dist < BOSS_HITBOX + 20) return true;
            }
        }
        return false;
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
        let l2 = Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2);
        let t = ((px-x1)*(x2-x1) + (py-y1)*(y2-y1)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t*(x2-x1)), py - (y1 + t*(y2-y1)));
    }

    function findSafePath() {
        let bestPoint = { x: boss.x, y: boss.y };
        let minScore = Infinity;
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 10) {
            for (let r = 0; r < ARENA_RADIUS - 20; r += 50) {
                let tx = ARENA_X + Math.cos(a) * r;
                let ty = ARENA_Y + Math.sin(a) * r;
                let score = checkFutureCollision(tx, ty, 30) ? 2000000 : 0;
                score += Math.hypot(tx - ARENA_X, ty - ARENA_Y) * 0.2 + Math.hypot(tx - boss.x, ty - boss.y);
                if (score < minScore) { minScore = score; bestPoint = { x: tx, y: ty }; }
            }
        }
        boss.targetX = bestPoint.x; boss.targetY = bestPoint.y;
    }

    function update() {
        findSafePath();
        boss.x += (boss.targetX - boss.x) * 0.1;
        boss.y += (boss.targetY - boss.y) * 0.1;
        boss.angle = Math.atan2(boss.targetY - boss.y, boss.targetX - boss.x);

        // Cập nhật đạn
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            if (Math.hypot(b.x - boss.x, b.y - boss.y) < BOSS_HITBOX) {
                boss.hp--; hpTxt.innerText = boss.hp; bullets.splice(i, 1);
                if (boss.hp <= 0) { coins += 10; localStorage.setItem('tankCoins', coins); alert("WIN!"); location.reload(); }
            } else if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
        }

        // Cập nhật Laser
        for (let i = lasers.length - 1; i >= 0; i--) {
            let l = lasers[i];
            l.timer--;
            if (l.timer <= 0) {
                // Phóng đạn laser thực sự
                for(let j=0; j<15; j++) {
                    bullets.push({ x: l.x, y: l.y, vx: Math.cos(l.angle)*(12+j), vy: Math.sin(l.angle)*(12+j), isLaser: true });
                }
                lasers.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath(); ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = '#222'; ctx.stroke();

        // Vẽ cảnh báo Laser
        lasers.forEach(l => {
            ctx.beginPath();
            ctx.moveTo(l.x, l.y);
            ctx.lineTo(l.x + Math.cos(l.angle)*800, l.y + Math.sin(l.angle)*800);
            ctx.strokeStyle = `rgba(255, 0, 255, ${0.1 + (1 - l.timer/60)*0.4})`;
            ctx.setLineDash([10, 10]);
            ctx.stroke();
            ctx.setLineDash([]);
        });

        // Boss
        ctx.save();
        ctx.translate(boss.x, boss.y); ctx.rotate(boss.angle);
        ctx.fillStyle = '#ff3333'; ctx.fillRect(-18, -15, 36, 30);
        ctx.restore();

        // Đạn
        bullets.forEach(b => {
            ctx.fillStyle = b.isLaser ? '#ff00ff' : '#0f0';
            ctx.beginPath(); ctx.arc(b.x, b.y, b.isLaser ? 6 : 4, 0, Math.PI*2); ctx.fill();
        });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
