<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tank AI v29 - Hybrid Intelligence</title>
<style>
body { margin:0; background:#000; overflow:hidden; }
#ui { position:fixed; top:10px; left:10px; color:#0f0; font-family:monospace; }
</style>
</head>
<body>
<div id="ui">
AI: HYBRID v29 <br>
MODE: <span id="mode">CALM</span><br>
LEARN: <span id="learn">0</span>
</div>
<canvas id="c"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

const CENTER = {x:400, y:c.height/2, r:300};

let bullets = [];
let mouse = {x:0,y:0};

let player = {x:c.width-200, y:c.height/2};

let boss = {
    x:CENTER.x, y:CENTER.y,
    angle:0, vx:0, vy:0,
    hp:500,
    skill:1, // adaptive difficulty
    memory: [], // lưu hướng bắn
    fakeTimer:0
};

window.onmousemove = e=>{mouse.x=e.clientX; mouse.y=e.clientY;}
window.onclick = fire;

function fire(){
    let a = Math.atan2(boss.y-player.y, boss.x-player.x);
    bullets.push({
        x:player.x, y:player.y,
        vx:Math.cos(a)*20,
        vy:Math.sin(a)*20
    });

    // learning
    boss.memory.push(a);
    if(boss.memory.length>20) boss.memory.shift();
}

function predictPlayerBias(){
    if(boss.memory.length<5) return 0;
    let avg = boss.memory.reduce((a,b)=>a+b,0)/boss.memory.length;
    return avg;
}

function predictBulletFuture(b, t=10){
    return {
        x: b.x + b.vx * t,
        y: b.y + b.vy * t
    };
}

function getRisk(x,y){
    let risk = 0;

    bullets.forEach(b=>{
        let future = predictBulletFuture(b, 10);

        let dx = future.x - x;
        let dy = future.y - y;
        let d = Math.hypot(dx,dy);

        if(d < 60) risk += (60-d)*10;
    });

    // bias prediction (player habit)
    let bias = predictPlayerBias();
    let futurePlayerShotX = player.x + Math.cos(bias)*200;
    let futurePlayerShotY = player.y + Math.sin(bias)*200;

    let dp = Math.hypot(x - futurePlayerShotX, y - futurePlayerShotY);
    if(dp < 120) risk += 200;

    return risk;
}

let lastDecision = 0;

function ai(){
    let now = Date.now();
    if(now - lastDecision < 120) return;
    lastDecision = now;

    let best = -Infinity;
    let bestAngle = boss.angle;

    let samples = 60;

    for(let i=0;i<samples;i++){
        let a = (i/samples)*Math.PI*2;

        let tx = boss.x + Math.cos(a)*60;
        let ty = boss.y + Math.sin(a)*60;

        let r = getRisk(tx,ty);

        let score = -r;

        // giữ trung tâm
        let dc = Math.hypot(tx-CENTER.x, ty-CENTER.y);
        score -= dc*0.5;

        // hạn chế rung
        score -= Math.abs(a - boss.angle)*2;

        if(score > best){
            best = score;
            bestAngle = a;
        }
    }

    // FAKE MOVE
    if(Math.random() < 0.1 && boss.fakeTimer<=0){
        bestAngle += Math.PI/2;
        boss.fakeTimer = 30;
    }

    boss.fakeTimer--;

    if(best < -10){
        document.getElementById("mode").innerText = "EVADING";
        move(bestAngle);
    }else{
        document.getElementById("mode").innerText = "CALM";
        boss.vx *= 0.9;
        boss.vy *= 0.9;
    }

    // adaptive difficulty
    boss.skill = Math.min(3, 1 + (500 - boss.hp)/200);
}

function move(target){
    let diff = target - boss.angle;
    while(diff>Math.PI) diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;

    boss.angle += diff*0.15;

    let speed = 4 * boss.skill;

    boss.vx = Math.cos(boss.angle)*speed;
    boss.vy = Math.sin(boss.angle)*speed;
}

function update(){
    player.x += (mouse.x-player.x)*0.1;
    player.y += (mouse.y-player.y)*0.1;

    bullets.forEach((b,i)=>{
        b.x += b.vx;
        b.y += b.vy;

        if(Math.hypot(b.x-boss.x,b.y-boss.y)<20){
            boss.hp-=5;
            bullets.splice(i,1);
        }
    });

    boss.x += boss.vx;
    boss.y += boss.vy;

    ai();

    document.getElementById("learn").innerText = boss.memory.length;
}

function draw(){
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,c.width,c.height);

    // arena
    ctx.beginPath();
    ctx.arc(CENTER.x,CENTER.y,CENTER.r,0,Math.PI*2);
    ctx.strokeStyle="#111";
    ctx.stroke();

    // player
    ctx.fillStyle="#0f0";
    ctx.fillRect(player.x-20,player.y-20,40,40);

    // boss
    ctx.fillStyle="#f00";
    ctx.fillRect(boss.x-20,boss.y-20,40,40);

    // bullets
    bullets.forEach(b=>{
        ctx.fillStyle="#0ff";
        ctx.beginPath();
        ctx.arc(b.x,b.y,4,0,Math.PI*2);
        ctx.fill();
    });

    update();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
