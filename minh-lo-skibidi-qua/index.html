<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tank Maze v26.0 - Absolute Physics</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: 'Segoe UI', monospace; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: #0f0; pointer-events: none; z-index: 10; font-weight: bold; }
        #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 60px; display: none; z-index: 100; text-shadow: 0 0 20px #f00; }
    </style>
</head>
<body>

<div id="ui">
    <div>[ MODE: RICHOCHET & A-STAR ]</div>
    <div>TANK HP: <span id="p-hp" style="color:#0f0">3</span> | BOSS HP: <span id="b-hp" style="color:#f05">10</span></div>
</div>
<div id="msg"></div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const pHPText = document.getElementById('p-hp'), bHPText = document.getElementById('b-hp'), msg = document.getElementById('msg');

    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const GRID = 80, B_SPEED = 6, P_SPEED = 4;
    const COLS = Math.floor(canvas.width / GRID), ROWS = Math.floor(canvas.height / GRID);
    
    // --- MÊ CUNG ---
    let maze = [];
    for (let r = 0; r < ROWS; r++) {
        maze[r] = [];
        for (let c = 0; c < COLS; c++) maze[r][c] = { c, r, walls: [true, true, true, true], v: false };
    }

    function genMaze() {
        let curr = maze[0][0], stack = []; curr.v = true;
        while(true) {
            let neighbors = [], {c, r} = curr;
            [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]].forEach(d => {
                let n = maze[r+d[1]] && maze[r+d[1]][c+d[0]];
                if (n && !n.v) neighbors.push({cell: n, w1: d[2], w2: d[3]});
            });
            if (neighbors.length > 0) {
                let next = neighbors[Math.floor(Math.random()*neighbors.length)];
                next.cell.v = true; stack.push(curr);
                curr.walls[next.w1] = false; next.cell.walls[next.w2] = false; curr = next.cell;
            } else if (stack.length > 0) curr = stack.pop();
            else break;
        }
    }
    genMaze();

    let player = { x: GRID/2, y: GRID/2, a: 0, hp: 3 };
    let boss = { x: (COLS-1)*GRID+GRID/2, y: (ROWS-1)*GRID+GRID/2, a: 0, hp: 10 };
    let bullets = [], gameOver = false, mouse = { x: 0, y: 0, down: false };

    // --- XỬ LÝ VA CHẠM TƯỜNG (CHÍNH XÁC ĐỂ NẢY) ---
    function checkWallImpact(x, y, vx, vy) {
        let cx = Math.floor(x/GRID), cy = Math.floor(y/GRID);
        if(!maze[cy] || !maze[cy][cx]) return { hit: true };
        let b = 12, rx = x % GRID, ry = y % GRID;
        if(vx < 0 && maze[cy][cx].walls[3] && rx < b) return { hit: true, axis: 'x' };
        if(vx > 0 && maze[cy][cx].walls[1] && rx > GRID-b) return { hit: true, axis: 'x' };
        if(vy < 0 && maze[cy][cx].walls[0] && ry < b) return { hit: true, axis: 'y' };
        if(vy > 0 && maze[cy][cx].walls[2] && ry > GRID-b) return { hit: true, axis: 'y' };
        return { hit: false };
    }

    // --- DỰ ĐOÁN ĐƯỜNG ĐI 5 GIÂY ---
    function getTrajectory(x, y, vx, vy) {
        let points = [{x, y}];
        let tx = x, ty = y, tvx = vx, tvy = vy;
        for(let i = 0; i < 150; i++) { // Mô phỏng 150 bước bay
            tx += tvx; ty += tvy;
            let impact = checkWallImpact(tx, ty, tvx, tvy);
            if(impact.hit) {
                if(impact.axis === 'x') tvx *= -1;
                else if(impact.axis === 'y') tvy *= -1;
                else break;
                points.push({x: tx, y: ty});
            }
        }
        points.push({x: tx, y: ty});
        return points;
    }

    // --- AI TÌM ĐƯỜNG (A*) ---
    function findPath() {
        let start = {c: Math.floor(boss.x/GRID), r: Math.floor(boss.y/GRID)};
        let target = {c: Math.floor(player.x/GRID), r: Math.floor(player.y/GRID)};
        let q = [[start]], visited = new Set([`${start.c},${start.r}`]);
        while(q.length > 0) {
            let path = q.shift(), curr = path[path.length-1];
            if(curr.c === target.c && curr.r === target.r) return path[1] || path[0];
            [[0,-1,0],[1,0,1],[0,1,2],[-1,0,3]].forEach(d => {
                if(!maze[curr.r][curr.c].walls[d[2]]) {
                    let nc = curr.c+d[0], nr = curr.r+d[1];
                    if(!visited.has(`${nc},${nr}`)) {
                        visited.add(`${nc},${nr}`);
                        q.push([...path, {c: nc, r: nr}]);
                    }
                }
            });
        }
        return start;
    }

    function fire(obj, color, owner) {
        bullets.push({ x: obj.x, y: obj.y, vx: Math.cos(obj.a)*B_SPEED, vy: Math.sin(obj.a)*B_SPEED, c: color, o: owner, t: Date.now() });
    }

    window.onmousemove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
    window.onmousedown = () => { if(!gameOver) { mouse.down = true; fire(player, '#0f0', 'p'); } };
    window.onmouseup = () => { mouse.down = false; };
    window.onkeydown = (e) => { if(e.code === 'Space' && !gameOver) fire(player, '#0f0', 'p'); };

    function update() {
        if(gameOver) return;
        player.a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        if(mouse.down && Math.hypot(mouse.x-player.x, mouse.y-player.y) > 20) {
            let nx = player.x + Math.cos(player.a)*P_SPEED, ny = player.y + Math.sin(player.a)*P_SPEED;
            if(!checkWallImpact(nx, player.y, Math.cos(player.a), 0).hit) player.x = nx;
            if(!checkWallImpact(player.x, ny, 0, Math.sin(player.a)).hit) player.y = ny;
        }

        // Boss di chuyển giải mê cung
        let next = findPath();
        let tx = next.c * GRID + GRID/2, ty = next.r * GRID + GRID/2;
        let ang = Math.atan2(ty - boss.y, tx - boss.x);
        if(Math.hypot(tx-boss.x, ty-boss.y) > 5) {
            boss.x += Math.cos(ang) * 2.5; boss.y += Math.sin(ang) * 2.5;
        }
        boss.a = Math.atan2(player.y - boss.y, player.x - boss.x);
        if(Math.random() < 0.015) fire(boss, '#f05', 'b');

        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            let impact = checkWallImpact(b.x, b.y, b.vx, b.vy);
            if(impact.hit) {
                if(impact.axis === 'x') b.vx *= -1;
                else if(impact.axis === 'y') b.vy *= -1;
                else bullets.splice(i, 1);
            }
            if(Math.hypot(b.x-boss.x, b.y-boss.y) < 22 && b.o==='p') { boss.hp--; bullets.splice(i, 1); if(boss.hp<=0) endGame("CHIẾN THẮNG!"); }
            if(Math.hypot(b.x-player.x, b.y-player.y) < 22 && b.o==='b') { player.hp--; bullets.splice(i, 1); if(player.hp<=0) endGame("THẤT BẠI!"); }
            if(Date.now() - b.t > 6000) bullets.splice(i, 1);
        });
        pHPText.innerText = player.hp; bHPText.innerText = boss.hp;
    }

    function endGame(s) { gameOver = true; msg.innerText = s; msg.style.display = 'block'; setTimeout(()=>location.reload(), 3000); }

    function draw() {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
        maze.forEach(r => r.forEach(c => {
            let x = c.c*GRID, y = c.r*GRID;
            if(c.walls[0]) { ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+GRID,y); ctx.stroke(); }
            if(c.walls[1]) { ctx.beginPath(); ctx.moveTo(x+GRID,y); ctx.lineTo(x+GRID,y+GRID); ctx.stroke(); }
            if(c.walls[2]) { ctx.beginPath(); ctx.moveTo(x+GRID,y+GRID); ctx.lineTo(x,y+GRID); ctx.stroke(); }
            if(c.walls[3]) { ctx.beginPath(); ctx.moveTo(x,y+GRID); ctx.lineTo(x,y); ctx.stroke(); }
        }));

        // Tank Player
        ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.a);
        ctx.fillStyle = '#0f0'; ctx.fillRect(-18, -18, 36, 36); ctx.fillStyle = '#fff'; ctx.fillRect(10, -5, 25, 10);
        ctx.restore();

        // Tank Boss
        ctx.save(); ctx.translate(boss.x, boss.y); ctx.rotate(boss.a);
        ctx.fillStyle = '#f05'; ctx.fillRect(-20, -20, 40, 40); ctx.fillStyle = '#fff'; ctx.fillRect(12, -6, 28, 12);
        ctx.restore();

        // Đạn & Đường dự báo nảy
        bullets.forEach(b => {
            let traj = getTrajectory(b.x, b.y, b.vx, b.vy);
            ctx.beginPath(); ctx.strokeStyle = b.o==='p'?'rgba(0,255,0,0.15)':'rgba(255,0,85,0.15)';
            traj.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, 7); ctx.fill();
        });

        update(); requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
