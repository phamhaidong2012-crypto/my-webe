<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI v16 - Anti-Jitter</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: white; pointer-events: none; z-index: 10; }
        .stat { font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">MÁU BOSS: <span id="hp" style="color: #ff3333;">3</span></div>
    <div style="font-size: 11px; color: #0ff;">STABILITY: CALIBRATED | NO JITTER</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 225;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;
    const BOSS_HITBOX = 17;

    let boss = { x: ARENA_X, y: ARENA_Y, angle: 0, hp: 3, targetX: ARENA_X, targetY: ARENA_Y };
    let bullets = [];
    let decisionCooldown = 0; // Bộ đếm để ổn định quyết định

    window.addEventListener('pointerdown', (e) => {
        if (Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y) <= ARENA_RADIUS) return;
        setTimeout(() => {
            const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
            bullets.push({ x: e.clientX, y: e.clientY, vx: Math.cos(angle) * 8.5, vy: Math.sin(angle) * 8.5 });
        }, 500);
    });

    function checkFutureCollision(testX, testY, futureFrames) {
        for (let f = 1; f <= futureFrames; f++) {
            for (let b of bullets) {
                let fbX = b.x + b.vx * f;
                let fbY = b.y + b.vy * f;
                if (Math.hypot(testX - fbX, testY - fbY) < BOSS_HITBOX + 12) return true;
            }
        }
        return false;
    }

    function findSafePath() {
        if (decisionCooldown > 0) {
            decisionCooldown--;
            // Nếu chỗ đang đứng vẫn an toàn thì không cần tính lại
            if (!checkFutureCollision(boss.x, boss.y, 20)) return;
        }

        let bestPoint = { x: boss.x, y: boss.y };
        let minScore = Infinity;
        let currentPosScore = checkFutureCollision(boss.x, boss.y, 25) ? 1000000 : 0;

        for (let a = 0; a < Math.PI * 2; a += Math.PI / 10) {
            for (let r = 0; r < ARENA_RADIUS - 20; r += 50) {
                let tx = ARENA_X + Math.cos(a) * r;
                let ty = ARENA_Y + Math.sin(a) * r;

                let score = 0;
                if (checkFutureCollision(tx, ty, 30)) {
                    score += 2000000;
                } else {
                    let distToCenter = Math.hypot(tx - ARENA_X, ty - ARENA_Y);
                    let distFromBoss = Math.hypot(tx - boss.x, ty - boss.y);
                    let centerWeight = (bullets.length > 0) ? 0.1 : 1.5;
                    score += distToCenter * centerWeight + distFromBoss;
                }

                if (score < minScore) {
                    minScore = score;
                    bestPoint = { x: tx, y: ty };
                }
            }
        }

        // CHỐNG RUNG: Chỉ đổi mục tiêu nếu điểm mới tốt hơn điểm hiện tại đáng kể
        if (minScore < currentPosScore * 0.8 || currentPosScore > 0) {
            boss.targetX = bestPoint.x;
            boss.targetY = bestPoint.y;
            decisionCooldown = 12; // Khóa quyết định trong 12 frames
        }
    }

    function update() {
        findSafePath();

        const dx = boss.targetX - boss.x;
        const dy = boss.targetY - boss.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 2) { // Ngưỡng dừng lớn hơn để tránh nhích li ti
            const angleToTarget = Math.atan2(dy, dx);
            let diff = angleToTarget - boss.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;

            let steerSpeed = 0.2;
            let moveSpeed = 6.5;

            if (Math.abs(diff) > Math.PI / 2) {
                let revDiff = diff > 0 ? diff - Math.PI : diff + Math.PI;
                boss.angle += revDiff * steerSpeed;
                moveSpeed = -6.5;
            } else {
                boss.angle += diff * steerSpeed;
                moveSpeed = 6.5;
            }

            boss.x += Math.cos(boss.angle) * moveSpeed;
            boss.y += Math.sin(boss.angle) * moveSpeed;
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            if (Math.hypot(b.x - boss.x, b.y - boss.y) < BOSS_HITBOX) {
                boss.hp--; hpTxt.innerText = boss.hp;
                bullets.splice(i, 1);
                if (boss.hp <= 0) { alert("VICTORY!"); location.reload(); }
                continue;
            }
            if (b.x < -100 || b.x > canvas.width+100 || b.y < -100 || b.y > canvas.height+100) bullets.splice(i, 1);
        }
    }

    function draw() {
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath(); ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = '#222'; ctx.stroke();

        bullets.forEach(b => {
            ctx.beginPath(); ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x + b.vx * 400, b.y + b.vy * 400);
            ctx.strokeStyle = 'rgba(0, 255, 150, 0.1)'; ctx.stroke();
        });

        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(boss.angle);
        ctx.fillStyle = '#111'; ctx.fillRect(-22, -22, 44, 10); ctx.fillRect(-22, 12, 44, 10);
        ctx.fillStyle = (boss.hp === 1) ? '#ff00ff' : '#ff3333';
        ctx.fillRect(-18, -15, 36, 30);
        ctx.fillStyle = '#000'; ctx.fillRect(0, -4, 25, 8);
        ctx.restore();

        ctx.fillStyle = '#0f0';
        bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
