<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI v16.3 - Professional</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; touch-action: none; font-family: sans-serif; color: white; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; pointer-events: none; z-index: 10; }
        .stat { font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; margin-bottom: 5px; }
        #timer-box { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
            color: #ff3333; font-size: 35px; font-weight: 900; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">MÁU BOSS: <span id="hp" style="color: #ff3333;">3</span></div>
    <div style="font-size: 11px; color: #0ff;">VERSION 16.3: ZERO REDUNDANCY | SMART PATH</div>
</div>
<div id="timer-box">01:00</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');
    const timerTxt = document.getElementById('timer-box');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 225;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;
    const BOSS_HITBOX = 17;

    let boss = { x: ARENA_X, y: ARENA_Y, angle: 0, hp: 3, targetX: ARENA_X, targetY: ARENA_Y };
    let bullets = [];
    let timeLeft = 60;

    const countdown = setInterval(() => {
        timeLeft--;
        timerTxt.innerText = `00:${timeLeft.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) { clearInterval(countdown); alert("GAME OVER!"); location.reload(); }
    }, 1000);

    window.addEventListener('pointerdown', (e) => {
        if (Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y) <= ARENA_RADIUS) return;
        setTimeout(() => {
            const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
            bullets.push({ x: e.clientX, y: e.clientY, vx: Math.cos(angle) * 8.5, vy: Math.sin(angle) * 8.5 });
        }, 500);
    });

    // Chỉ kiểm tra đạn có khả năng trúng đích thực sự
    function getDangerScore(tx, ty) {
        let risk = 0;
        for (let b of bullets) {
            // Khoảng cách hiện tại đến đạn
            let dist = Math.hypot(tx - b.x, ty - b.y);
            // Dự đoán vị trí đạn trong 25 khung hình tới
            for (let f = 1; f <= 25; f++) {
                let futureX = b.x + b.vx * f;
                let futureY = b.y + b.vy * f;
                if (Math.hypot(tx - futureX, ty - futureY) < BOSS_HITBOX + 15) {
                    risk += 5000 / f; // Đạn càng gần càng nguy hiểm
                }
            }
        }
        return risk;
    }

    function findSafePath() {
        // Nếu chỗ đứng hiện tại cực kỳ an toàn (risk = 0), Boss sẽ không di chuyển
        if (getDangerScore(boss.x, boss.y) === 0) {
            boss.targetX = boss.x;
            boss.targetY = boss.y;
            return;
        }

        let bestPoint = { x: boss.x, y: boss.y };
        let minScore = Infinity;

        // Quét vòng tròn quanh vị trí hiện tại thay vì quét cả Arena để giảm "tăng động"
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
            for (let r = 40; r <= 120; r += 40) {
                let tx = boss.x + Math.cos(a) * r;
                let ty = boss.y + Math.sin(a) * r;

                // Kiểm tra xem điểm này có nằm ngoài Arena không
                if (Math.hypot(tx - ARENA_X, ty - ARENA_Y) > ARENA_RADIUS - 20) continue;

                let risk = getDangerScore(tx, ty);
                let distToCenter = Math.hypot(tx - ARENA_X, ty - ARENA_Y);
                let score = risk + distToCenter * 0.2; 

                if (score < minScore) {
                    minScore = score;
                    bestPoint = { x: tx, y: ty };
                }
            }
        }
        boss.targetX = bestPoint.x;
        boss.targetY = bestPoint.y;
    }

    function update() {
        findSafePath();

        const dx = boss.targetX - boss.x;
        const dy = boss.targetY - boss.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 2) {
            const targetAngle = Math.atan2(dy, dx);
            let diff = targetAngle - boss.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;

            boss.angle += diff * 0.12; // Xoay mượt
            let speed = Math.min(dist * 0.1, 6); // Giảm tốc khi gần tới điểm an toàn
            boss.x += Math.cos(boss.angle) * speed;
            boss.y += Math.sin(boss.angle) * speed;
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            if (Math.hypot(b.x - boss.x, b.y - boss.y) < BOSS_HITBOX) {
                boss.hp--; hpTxt.innerText = boss.hp;
                bullets.splice(i, 1);
                if (boss.hp <= 0) { clearInterval(countdown); alert("VICTORY!"); location.reload(); }
                continue;
            }
            if (b.x < -100 || b.x > canvas.width+100 || b.y < -100 || b.y > canvas.height+100) bullets.splice(i, 1);
        }
    }

    function draw() {
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Vẽ Arena
        ctx.beginPath(); ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();

        // Vẽ dự báo đạn (đường kẻ cực mờ)
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x + b.vx * 30, b.y + b.vy * 30);
            ctx.strokeStyle = 'rgba(0, 255, 150, 0.05)';
            ctx.stroke();
        });

        // Vẽ Boss
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(boss.angle);
        ctx.fillStyle = '#111'; ctx.fillRect(-22, -22, 44, 10); ctx.fillRect(-22, 12, 44, 10);
        ctx.fillStyle = (boss.hp === 1) ? '#ff00ff' : '#ff3333';
        ctx.fillRect(-18, -15, 36, 30);
        ctx.fillStyle = '#000'; ctx.fillRect(0, -4, 25, 8);
        ctx.restore();

        // Vẽ đạn
        ctx.fillStyle = '#0f0';
        bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
