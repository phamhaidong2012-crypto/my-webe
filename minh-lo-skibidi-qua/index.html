<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI v16.4 - God Mode Prediction</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020202; touch-action: none; font-family: 'Courier New', monospace; color: #0f0; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; pointer-events: none; z-index: 10; }
        .stat { font-size: 18px; font-weight: bold; text-shadow: 0 0 5px #0f0; }
        #timer { position: fixed; top: 15px; right: 15px; font-size: 30px; font-weight: 900; color: #f33; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">BOSS HP: <span id="hp">3</span></div>
    <div style="font-size: 10px;">CORE: CORTEX-V22 (GOD MODE) | FREEZE_CALCULATION: ON</div>
</div>
<div id="timer">01:00</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');
    const timerTxt = document.getElementById('timer');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 225;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;
    const BOSS_HITBOX = 18;

    let boss = { x: ARENA_X, y: ARENA_Y, angle: 0, hp: 3, targetX: ARENA_X, targetY: ARENA_Y };
    let bullets = [];
    let timeLeft = 60;
    let isPaused = false; // Trạng thái dừng hình để AI tính toán

    const timerInterval = setInterval(() => {
        if (!isPaused) timeLeft--;
        timerTxt.innerText = `00:${timeLeft.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) { clearInterval(timerInterval); alert("SYSTEM OVERLOAD: BOSS SURVIVED"); location.reload(); }
    }, 1000);

    window.addEventListener('pointerdown', (e) => {
        if (Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y) <= ARENA_RADIUS) return;
        
        // CƠ CHẾ DỪNG HÌNH KHI BẮN (Freeze-frame)
        isPaused = true;
        
        const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
        bullets.push({ 
            x: e.clientX, y: e.clientY, 
            vx: Math.cos(angle) * 9.5, 
            vy: Math.sin(angle) * 9.5 
        });

        // Chỉ dừng trong 100ms để AI "lập trình" đường né
        setTimeout(() => { isPaused = false; }, 100);
    });

    function getSafetyScore(tx, ty) {
        let risk = 0;
        for (let b of bullets) {
            // Kiểm tra quỹ đạo dài vô tận của đạn
            let distToLine = distToInfiniteLine(tx, ty, b.x, b.y, b.x + b.vx, b.y + b.vy);
            
            // Nếu điểm thử nghiệm nằm trên đường đi của đạn
            if (distToLine < BOSS_HITBOX + 25) {
                // Kiểm tra xem đạn có đang bay VỀ PHÍA điểm đó không
                let dotProduct = (tx - b.x) * b.vx + (ty - b.y) * b.vy;
                if (dotProduct > 0) risk += 10000; 
            }
        }
        // Phạt nặng việc rời khỏi Arena
        if (Math.hypot(tx - ARENA_X, ty - ARENA_Y) > ARENA_RADIUS - 20) risk += 100000;
        
        // Ưu tiên đứng yên nếu an toàn
        risk += Math.hypot(tx - boss.x, ty - boss.y) * 2;
        return risk;
    }

    function distToInfiniteLine(px, py, x1, y1, x2, y2) {
        let num = Math.abs((x2 - x1) * (y1 - py) - (x1 - px) * (y2 - y1));
        let den = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        return num / den;
    }

    function solveAI() {
        if (isPaused) return; 

        let bestP = { x: boss.x, y: boss.y };
        let minS = getSafetyScore(boss.x, boss.y);

        // Chỉ né nếu thực sự bị đe dọa (Risk > 1000)
        if (minS > 1000) {
            for (let i = 0; i < 32; i++) { // Quét 32 hướng để cực kỳ chính xác
                let ang = (i / 32) * Math.PI * 2;
                let dist = 80;
                let tx = boss.x + Math.cos(ang) * dist;
                let ty = boss.y + Math.sin(ang) * dist;

                let s = getSafetyScore(tx, ty);
                if (s < minS) { minS = s; bestP = { x: tx, y: ty }; }
            }
        }
        boss.targetX = bestP.x; boss.targetY = bestP.y;
    }

    function update() {
        if (isPaused) return;

        solveAI();
        let dx = boss.targetX - boss.x;
        let dy = boss.targetY - boss.y;
        let d = Math.hypot(dx, dy);

        if (d > 1) {
            boss.angle = Math.atan2(dy, dx);
            let speed = 7.5; // Tăng tốc độ né cực đại
            boss.x += Math.cos(boss.angle) * speed;
            boss.y += Math.sin(boss.angle) * speed;
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i]; 
            b.x += b.vx; b.y += b.vy;
            
            if (Math.hypot(b.x - boss.x, b.y - boss.y) < BOSS_HITBOX) {
                boss.hp--; hpTxt.innerText = boss.hp; bullets.splice(i, 1);
                if (boss.hp <= 0) { alert("IMPOSSIBLE! AI DEFEATED"); location.reload(); }
            } else if (b.x < -1000 || b.x > canvas.width+1000 || b.y < -1000 || b.y > canvas.height+1000) {
                bullets.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.fillStyle = '#020202'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.beginPath(); ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI*2);
        ctx.strokeStyle = '#111'; ctx.stroke();

        // 1. TIA ĐẠN ĐEN DÀI VÔ TẬN
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x + b.vx * 2000, b.y + b.vy * 2000);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)'; // Để màu trắng mờ cho dễ nhìn trên nền đen, hoặc 'black' nếu bạn muốn ẩn giấu hoàn toàn
            ctx.lineWidth = 1;
            ctx.stroke();
        });

        // 2. BOSS
        ctx.save();
        ctx.translate(boss.x, boss.y); ctx.rotate(boss.angle);
        ctx.fillStyle = '#111'; ctx.fillRect(-22, -22, 44, 10); ctx.fillRect(-22, 12, 44, 10);
        ctx.fillStyle = boss.hp === 1 ? '#f0f' : '#f33'; ctx.fillRect(-18, -15, 36, 30);
        ctx.restore();

        // 3. ĐẠN (Màu xanh neon rực rỡ)
        bullets.forEach(b => {
            ctx.fillStyle = '#0f0';
            ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
        });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
