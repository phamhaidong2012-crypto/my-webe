<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tank Maze v28.0 - Click to Move</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: monospace; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: #0f0; pointer-events: none; z-index: 10; font-size: 16px; }
        #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 60px; display: none; z-index: 100; text-shadow: 0 0 20px #0f0; }
    </style>
</head>
<body>

<div id="ui">
    <div>[ SYSTEM: GOD_AI_v28_STABLE ]</div>
    <div>TANK HP: <span id="p-hp" style="color:#0f0">IMMORTAL</span> | BOSS HP: <span id="b-hp" style="color:#f05">10</span></div>
    <div id="ai-action" style="color: #ff0; font-size: 12px;">AI: MONITORING...</div>
</div>
<div id="msg"></div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const pHPText = document.getElementById('p-hp'), bHPText = document.getElementById('b-hp'), aiAct = document.getElementById('ai-action');

    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const GRID = 80, B_SPEED = 3.5, P_SPEED = 4.5; 
    const COLS = Math.floor(canvas.width / GRID), ROWS = Math.floor(canvas.height / GRID);
    
    let maze = [];
    for (let r = 0; r < ROWS; r++) {
        maze[r] = [];
        for (let c = 0; c < COLS; c++) maze[r][c] = { c, r, walls: [true, true, true, true], v: false };
    }

    function genMaze() {
        let curr = maze[0][0], stack = []; curr.v = true;
        while(true) {
            let neighbors = [], {c, r} = curr;
            [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]].forEach(d => {
                let n = maze[r+d[1]] && maze[r+d[1]][c+d[0]];
                if (n && !n.v) neighbors.push({cell: n, w1: d[2], w2: d[3]});
            });
            if (neighbors.length > 0) {
                let next = neighbors[Math.floor(Math.random()*neighbors.length)];
                next.cell.v = true; stack.push(curr);
                curr.walls[next.w1] = false; next.cell.walls[next.w2] = false; curr = next.cell;
            } else if (stack.length > 0) curr = stack.pop();
            else break;
        }
    }
    genMaze();

    let player = { x: GRID/2, y: GRID/2, a: 0, hp: 999 };
    let boss = { x: (COLS-1)*GRID+GRID/2, y: (ROWS-1)*GRID+GRID/2, a: 0, hp: 10 };
    let bullets = [], gameOver = false, mouse = { x: 0, y: 0, down: false };

    // HỆ THỐNG VA CHẠM DÀY (25px) - CHỐNG XUYÊN TƯỜNG TUYỆT ĐỐI
    function checkWall(x, y) {
        let cx = Math.floor(x/GRID), cy = Math.floor(y/GRID);
        if(!maze[cy] || !maze[cy][cx]) return { hit: true };
        let b = 25, rx = x % GRID, ry = y % GRID;
        
        if(maze[cy][cx].walls[0] && ry < b) return { hit: true, axis: 'y' };
        if(maze[cy][cx].walls[1] && rx > GRID-b) return { hit: true, axis: 'x' };
        if(maze[cy][cx].walls[2] && ry > GRID-b) return { hit: true, axis: 'y' };
        if(maze[cy][cx].walls[3] && rx < b) return { hit: true, axis: 'x' };
        return { hit: false };
    }

    function getTrajectory(x, y, vx, vy, steps = 150) {
        let points = [{x, y}], tx = x, ty = y, tvx = vx, tvy = vy;
        for(let i = 0; i < steps; i++) {
            tx += tvx; ty += tvy;
            let impact = checkWall(tx, ty);
            if(impact.hit) {
                let cx = Math.floor(tx/GRID), cy = Math.floor(ty/GRID);
                let rx = tx % GRID, ry = ty % GRID;
                if (rx < 26 || rx > GRID-26) tvx *= -1;
                else if (ry < 26 || ry > GRID-26) tvy *= -1;
                points.push({x: tx, y: ty});
            }
        }
        points.push({x: tx, y: ty});
        return points;
    }

    function distToSegment(p, v, w) {
        let l2 = Math.pow(v.x-w.x, 2) + Math.pow(v.y-w.y, 2);
        if (l2 == 0) return Math.hypot(p.x-v.x, p.y-v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function findPath() {
        let start = {c: Math.floor(boss.x/GRID), r: Math.floor(boss.y/GRID)};
        let target = {c: Math.floor(player.x/GRID), r: Math.floor(player.y/GRID)};
        let q = [[start]], visited = new Set([`${start.c},${start.r}`]);
        while(q.length > 0) {
            let path = q.shift(), curr = path[path.length-1];
            if(curr.c === target.c && curr.r === target.r) return path[1] || path[0];
            [[0,-1,0],[1,0,1],[0,1,2],[-1,0,3]].forEach(d => {
                if(maze[curr.r] && maze[curr.r][curr.c] && !maze[curr.r][curr.c].walls[d[2]]) {
                    let nc = curr.c+d[0], nr = curr.r+d[1];
                    if(maze[nr] && maze[nr][nc] && !visited.has(`${nc},${nr}`)) { 
                        visited.add(`${nc},${nr}`); q.push([...path, {c: nc, r: nr}]); 
                    }
                }
            });
        }
        return start;
    }

    function fire(obj, color, owner) {
        bullets.push({ x: obj.x, y: obj.y, vx: Math.cos(obj.a)*8, vy: Math.sin(obj.a)*8, c: color, o: owner, t: Date.now() });
    }

    // XỬ LÝ CHUỘT: Chỉ đi khi mouse.down = true
    window.onmousemove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
    window.onmousedown = () => { mouse.down = true; if(!gameOver) fire(player, '#0f0', 'p'); };
    window.onmouseup = () => { mouse.down = false; };
    window.ontouchstart = (e) => { mouse.down = true; mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; if(!gameOver) fire(player, '#0f0', 'p'); };
    window.ontouchend = () => { mouse.down = false; };

    let lastShot = 0;
    function update() {
        if(gameOver) return;
        
        // PLAYER: Chỉnh hướng liên tục theo chuột
        player.a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        
        // CHỈ DI CHUYỂN KHI NHẤN CHUỘT
        if(mouse.down) {
            let nx = player.x + Math.cos(player.a)*P_SPEED, ny = player.y + Math.sin(player.a)*P_SPEED;
            if(!checkWall(nx, player.y).hit) player.x = nx;
            if(!checkWall(player.x, ny).hit) player.y = ny;
        }

        // BOSS DI CHUYỂN
        let pathNext = findPath();
        let targetX = pathNext.c * GRID + GRID/2, targetY = pathNext.r * GRID + GRID/2;
        let bestX = boss.x, bestY = boss.y, minD = Infinity;

        for(let i=0; i<16; i++){
            let ang = i * Math.PI/8;
            let tx = boss.x + Math.cos(ang)*35, ty = boss.y + Math.sin(ang)*35;
            let d = Math.hypot(tx-targetX, ty-targetY);
            if(!checkWall(tx, ty).hit && d < minD) { minD = d; bestX = tx; bestY = ty; }
        }
        boss.x += (bestX - boss.x) * 0.1; 
        boss.y += (bestY - boss.y) * 0.1;

        // BOSS XOAY MƯỢT & BẮN NẢY
        if(Date.now() - lastShot > 1000) {
            let found = false;
            for(let a=0; a<Math.PI*2; a+=0.25) {
                let traj = getTrajectory(boss.x, boss.y, Math.cos(a)*8, Math.sin(a)*8, 300);
                for(let i=0; i<traj.length-1; i++) {
                    if(distToSegment(player, traj[i], traj[i+1]) < 30) {
                        // Nội suy góc để xoay nòng mượt
                        let diff = a - boss.a;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        boss.a += diff * 0.15;
                        
                        if(Math.abs(diff) < 0.2) { fire(boss, '#f05', 'b'); lastShot = Date.now(); }
                        found = true; break;
                    }
                }
                if(found) break;
            }
            if(!found) {
                let targetA = Math.atan2(player.y - boss.y, player.x - boss.x);
                let diff = targetA - boss.a;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                boss.a += diff * 0.05;
            }
        }

        // ĐẠN
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            let impact = checkWall(b.x, b.y);
            if(impact.hit) {
                let rx = b.x % GRID, ry = b.y % GRID;
                if (rx < 26 || rx > GRID-26) b.vx *= -1;
                else if (ry < 26 || ry > GRID-26) b.vy *= -1;
                else bullets.splice(i, 1);
            }
            if(Math.hypot(b.x-boss.x, b.y-boss.y) < 22 && b.o==='p') { boss.hp--; bullets.splice(i, 1); if(boss.hp<=0) endGame("WIN!"); }
            if(Math.hypot(b.x-player.x, b.y-player.y) < 22 && b.o==='b') { bullets.splice(i, 1); } // Bất tử
            if(Date.now() - b.t > 8000) bullets.splice(i, 1);
        });
        bHPText.innerText = boss.hp;
    }

    function endGame(s) { gameOver = true; document.getElementById('msg').innerText = s; document.getElementById('msg').style.display = 'block'; setTimeout(()=>location.reload(), 3000); }

    function draw() {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
        maze.forEach(r => r.forEach(c => {
            let x = c.c*GRID, y = c.r*GRID;
            if(c.walls[0]) { ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+GRID,y); ctx.stroke(); }
            if(c.walls[1]) { ctx.beginPath(); ctx.moveTo(x+GRID,y); ctx.lineTo(x+GRID,y+GRID); ctx.stroke(); }
            if(c.walls[2]) { ctx.beginPath(); ctx.moveTo(x+GRID,y+GRID); ctx.lineTo(x,y+GRID); ctx.stroke(); }
            if(c.walls[3]) { ctx.beginPath(); ctx.moveTo(x,y+GRID); ctx.lineTo(x,y); ctx.stroke(); }
        }));

        // Vẽ Player
        ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.a);
        ctx.fillStyle = '#0f0'; ctx.fillRect(-18, -18, 36, 36); ctx.fillStyle = '#fff'; ctx.fillRect(10, -5, 25, 10);
        ctx.restore();

        // Vẽ Boss
        ctx.save(); ctx.translate(boss.x, boss.y); ctx.rotate(boss.a);
        ctx.fillStyle = '#f05'; ctx.shadowBlur = 15; ctx.shadowColor = '#f05';
        ctx.fillRect(-22, -22, 44, 44); ctx.fillStyle = '#fff'; ctx.fillRect(12, -6, 30, 12);
        ctx.restore(); ctx.shadowBlur = 0;

        bullets.forEach(b => {
            ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, 7); ctx.fill();
        });

        update(); requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
