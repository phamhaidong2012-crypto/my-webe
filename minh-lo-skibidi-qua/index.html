<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI v18.0 - Tank Assault</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020202; touch-action: none; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: #0f0; pointer-events: none; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-left: 3px solid #0f0; }
        .stat { font-size: 22px; font-weight: bold; text-shadow: 0 0 5px #000; }
        #instruction { position: fixed; bottom: 15px; right: 15px; color: #555; font-size: 12px; text-align: right; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">BOSS STATUS: <span id="hp">50</span> HP</div>
    <div style="font-size: 10px; color: #888;">CORE: CORTEX-V30 | TARGETING: ENABLED</div>
</div>

<div id="instruction">
    [DI CHUYỂN CHUỘT ĐỂ ĐIỀU KHIỂN XE TĂNG]<br>
    [NHẤN CHUỘT HOẶC SPACE ĐỂ KHAI HỎA TỨC THÌ]
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // --- CẤU HÌNH VỊ TRÍ (DỊCH TRÁI) ---
    const ARENA_RADIUS = 250;
    const ARENA_X = ARENA_RADIUS + 20; // Sát lề trái
    const ARENA_Y = canvas.height / 2;
    const BOSS_HITBOX = 20;
    const SAFETY_BUFFER = 55;

    let boss = { x: ARENA_X, y: ARENA_Y, angle: 0, hp: 50, targetX: ARENA_X, targetY: ARENA_Y };
    let player = { x: canvas.width - 100, y: canvas.height / 2, angle: 0 };
    let bullets = [];      
    let mouseX = 0, mouseY = 0;
    let lastDecisionTime = 0;

    // --- XỬ LÝ ĐIỀU KHIỂN ---
    window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            fireBullet();
        }
    });

    window.addEventListener('pointerdown', fireBullet);

    function fireBullet() {
        // Tính góc từ người chơi đến Boss để bắn chính xác
        const angle = Math.atan2(boss.y - player.y, boss.x - player.x);
        bullets.push({ 
            x: player.x, 
            y: player.y, 
            vx: Math.cos(angle) * 15, // Tốc độ đạn nhanh hơn
            vy: Math.sin(angle) * 15,
            active: true 
        });
    }

    // --- AI CORTEX-V30 (NÉ ĐẠN TỐI ƯU) ---
    function getRiskAt(tx, ty) {
        let totalRisk = 0;
        // Giới hạn trong vòng tròn Arena bên trái
        let distToCenter = Math.hypot(tx - ARENA_X, ty - ARENA_Y);
        if (distToCenter > ARENA_RADIUS - 30) return 1000000;
        
        for (let b of bullets) {
            let dx = b.vx, dy = b.vy;
            let num = Math.abs(dx * (b.y - ty) - (b.x - tx) * dy);
            let den = Math.sqrt(dx * dx + dy * dy);
            if (num / den < SAFETY_BUFFER) {
                let dot = (tx - b.x) * dx + (ty - b.y) * dy;
                if (dot > -10) totalRisk += (SAFETY_BUFFER - (num / den)) * 300;
            }
        }
        return totalRisk;
    }

    function solveAI() {
        const now = Date.now();
        if (getRiskAt(boss.targetX, boss.targetY) < 100 && now - lastDecisionTime < 100) return;
        
        let bestScore = getRiskAt(boss.x, boss.y);
        let bestP = { x: boss.x, y: boss.y };
        
        for (let i = 0; i < 32; i++) {
            let ang = (i / 32) * Math.PI * 2;
            let tx = boss.x + Math.cos(ang) * 80;
            let ty = boss.y + Math.sin(ang) * 80;
            let score = getRiskAt(tx, ty) + Math.hypot(tx - ARENA_X, ty - ARENA_Y) * 0.5;
            if (score < bestScore) {
                bestScore = score;
                bestP = { x: tx, y: ty };
            }
        }
        boss.targetX = bestP.x;
        boss.targetY = bestP.y;
        lastDecisionTime = now;
    }

    // --- CẬP NHẬT GAME ---
    function update() {
        solveAI();
        
        // Boss di chuyển trong Arena bên trái
        let bdx = boss.targetX - boss.x;
        let bdy = boss.targetY - boss.y;
        let bd = Math.hypot(bdx, bdy);
        if (bd > 2) {
            let targetAngle = Math.atan2(bdy, bdx);
            let diff = targetAngle - boss.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            boss.angle += diff * 0.1;
            boss.x += Math.cos(boss.angle) * 7;
            boss.y += Math.sin(boss.angle) * 7;
        }

        // Xe tăng người chơi đi theo chuột
        player.x += (mouseX - player.x) * 0.1;
        player.y += (mouseY - player.y) * 0.1;
        // Xe tăng luôn chĩa súng về phía Boss
        player.angle = Math.atan2(boss.y - player.y, boss.x - player.x);

        // Xử lý đạn
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;

            // Kiểm tra va chạm với Boss
            if (Math.hypot(b.x - boss.x, b.y - boss.y) < BOSS_HITBOX) {
                boss.hp--;
                hpTxt.innerText = boss.hp;
                bullets.splice(i, 1);
                if (boss.hp <= 0) {
                    alert("BOSS ĐÃ BỊ TIÊU DIỆT!");
                    location.reload();
                }
            } 
            // Xóa đạn khi bay khỏi màn hình
            else if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                bullets.splice(i, 1);
            }
        }
    }

    // --- VẼ ĐỒ HỌA ---
    function draw() {
        ctx.fillStyle = '#020202';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Vẽ Arena bên trái
        ctx.beginPath();
        ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Vẽ Đạn
        bullets.forEach(b => {
            ctx.fillStyle = '#0f0';
            ctx.beginPath();
            ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
            ctx.fill();
            // Vẽ tia lửa đạn
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.2)';
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x - b.vx * 2, b.y - b.vy * 2);
            ctx.stroke();
        });

        // Vẽ Xe tăng người chơi (Player Tank)
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);
        // Thân xe
        ctx.fillStyle = '#0a0';
        ctx.fillRect(-20, -15, 40, 30);
        // Xích xe
        ctx.fillStyle = '#050';
        ctx.fillRect(-22, -18, 44, 6);
        ctx.fillRect(-22, 12, 44, 6);
        // Tháp pháo
        ctx.fillStyle = '#0f0';
        ctx.fillRect(-10, -10, 20, 20);
        // Nòng súng (Luôn hướng về Boss)
        ctx.fillStyle = '#0f0';
        ctx.fillRect(10, -3, 25, 6);
        ctx.restore();

        // Vẽ Boss
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(boss.angle);
        ctx.fillStyle = '#222';
        ctx.fillRect(-25, -25, 50, 12);
        ctx.fillRect(-25, 13, 50, 12);
        ctx.fillStyle = '#f33';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#f00';
        ctx.fillRect(-20, -18, 40, 36);
        ctx.restore();
        ctx.shadowBlur = 0;

        update();
        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
