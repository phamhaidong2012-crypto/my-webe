<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI v16.8 - Anti-Vibration</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020202; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: #0f0; pointer-events: none; z-index: 10; }
        .stat { font-size: 20px; font-weight: bold; text-shadow: 0 0 5px #000; }
        #timer { position: fixed; top: 15px; right: 15px; font-size: 30px; color: #f33; font-weight: 900; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">BOSS HP: <span id="hp">3</span></div>
    <div style="font-size: 10px;">CORE: CORTEX-V26 | ANTI-JITTER: ENABLED | SMOOTH_LERP: ON</div>
</div>
<div id="timer">01:00</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');
    const timerTxt = document.getElementById('timer');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 225;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;
    
    const BOSS_REAL_HITBOX = 5; 
    const SAFETY_BUFFER = 55; // Vùng an toàn rộng

    let boss = { x: ARENA_X, y: ARENA_Y, angle: 0, hp: 3, targetX: ARENA_X, targetY: ARENA_Y };
    let bullets = [];
    let timeLeft = 60;
    let lastDecisionTime = 0;

    const timerInterval = setInterval(() => {
        timeLeft--;
        timerTxt.innerText = `00:${timeLeft.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) { clearInterval(timerInterval); alert("WIN!"); location.reload(); }
    }, 1000);

    window.addEventListener('pointerdown', (e) => {
        if (Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y) <= ARENA_RADIUS) return;
        const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
        bullets.push({ 
            x: e.clientX, y: e.clientY, 
            vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10, 
            charge: 30, active: false 
        });
    });

    function getRiskAt(tx, ty) {
        let totalRisk = 0;
        for (let b of bullets) {
            let dx = b.vx, dy = b.vy;
            let num = Math.abs(dx * (b.y - ty) - (b.x - tx) * dy);
            let den = Math.sqrt(dx * dx + dy * dy);
            let distToPath = num / den;

            if (distToPath < SAFETY_BUFFER) {
                let dot = (tx - b.x) * dx + (ty - b.y) * dy;
                if (dot > -10) totalRisk += (SAFETY_BUFFER - distToPath) * 200;
            }
        }
        if (Math.hypot(tx - ARENA_X, ty - ARENA_Y) > ARENA_RADIUS - 30) totalRisk += 100000;
        return totalRisk;
    }

    function solveAI() {
        const now = Date.now();
        // Chống rung: Chỉ tính toán lại nếu mục tiêu hiện tại bị đe dọa hoặc sau 150ms
        let currentDestRisk = getRiskAt(boss.targetX, boss.targetY);
        if (currentDestRisk < 500 && now - lastDecisionTime < 150) return;

        let bestScore = getRiskAt(boss.x, boss.y);
        let bestP = { x: boss.x, y: boss.y };

        // Quét tìm đường sống
        for (let i = 0; i < 48; i++) {
            let ang = (i / 48) * Math.PI * 2;
            let tx = boss.x + Math.cos(ang) * 90;
            let ty = boss.y + Math.sin(ang) * 90;

            if (Math.hypot(tx - ARENA_X, ty - ARENA_Y) > ARENA_RADIUS - 25) continue;

            let score = getRiskAt(tx, ty);
            score += Math.hypot(tx - ARENA_X, ty - ARENA_Y) * 1.5;

            if (score < bestScore) {
                bestScore = score;
                bestP = { x: tx, y: ty };
            }
        }
        
        if (Math.hypot(boss.targetX - bestP.x, boss.targetY - bestP.y) > 20) {
            boss.targetX = bestP.x;
            boss.targetY = bestP.y;
            lastDecisionTime = now;
        }
    }

    function update() {
        solveAI();
        let dx = boss.targetX - boss.x;
        let dy = boss.targetY - boss.y;
        let d = Math.hypot(dx, dy);

        if (d > 3) {
            let targetAngle = Math.atan2(dy, dx);
            // Làm mượt góc quay
            let diff = targetAngle - boss.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            boss.angle += diff * 0.15;

            // Di chuyển mượt (LERP-like)
            boss.x += Math.cos(boss.angle) * 8.5;
            boss.y += Math.sin(boss.angle) * 8.5;
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            if (b.charge > 0) { b.charge--; if (b.charge <= 0) b.active = true; }
            if (b.active) { b.x += b.vx; b.y += b.vy; }

            if (Math.hypot(b.x - boss.x, b.y - boss.y) < BOSS_REAL_HITBOX) {
                boss.hp--; hpTxt.innerText = boss.hp; bullets.splice(i, 1);
                if (boss.hp <= 0) { alert("HỆ THỐNG AI SỤP ĐỔ - BẠN THẮNG!"); location.reload(); }
            } else if (b.x < -600 || b.x > canvas.width+600) bullets.splice(i, 1);
        }
    }

    function draw() {
        ctx.fillStyle = '#020202'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath(); ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI*2);
        ctx.strokeStyle = '#111'; ctx.stroke();

        bullets.forEach(b => {
            ctx.beginPath(); ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x + b.vx * 200, b.y + b.vy * 200);
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.12)'; 
            ctx.stroke();
            if (!b.active) {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.charge/2+5, 0, Math.PI*2);
                ctx.strokeStyle = '#0f0'; ctx.stroke();
            }
        });

        ctx.save();
        ctx.translate(boss.x, boss.y); ctx.rotate(boss.angle);
        ctx.fillStyle = '#111'; ctx.fillRect(-22, -22, 44, 10); ctx.fillRect(-22, 12, 44, 10);
        ctx.fillStyle = (boss.hp === 1) ? '#f0f' : '#f33'; ctx.fillRect(-18, -15, 36, 30);
        ctx.restore();

        bullets.forEach(b => {
            ctx.fillStyle = b.active ? '#0f0' : '#333';
            ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
        });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
