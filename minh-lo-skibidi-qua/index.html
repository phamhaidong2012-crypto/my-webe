<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Tank Maze v29.0 - Platinum AI</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 20px; left: 20px; color: #0f0; pointer-events: none; z-index: 10; font-size: 18px; background: rgba(0,0,0,0.7); padding: 15px; border-left: 5px solid #0f0; }
        #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 70px; display: none; z-index: 100; text-shadow: 0 0 30px #f05; font-weight: bold; }
        .stat { margin-bottom: 5px; }
        .k-hint { color: #ff0; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">[ STATUS: PLATINUM_AI_ACTIVE ]</div>
    <div class="stat">TANK HP: <span id="p-hp" style="color:#0f0">IMMORTAL</span></div>
    <div class="stat">BOSS HP: <span id="b-hp" style="color:#f05">15</span></div>
    <div id="ai-action" style="color: #0cf;">AI: ANALYZING BOUNCE VECTORS...</div>
    <div class="k-hint">GIỮ CHUỘT: DI CHUYỂN | SPACE/CLICK: BẮN</div>
</div>
<div id="msg"></div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const pHPText = document.getElementById('p-hp'), bHPText = document.getElementById('b-hp'), aiAct = document.getElementById('ai-action');

    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight;

    // CẤU HÌNH HỆ THỐNG
    const GRID = 90; 
    const B_SPEED = 3.5;
    const P_SPEED = 5.0;
    const BULLET_SPEED = 9;
    const COLS = Math.floor(canvas.width / GRID);
    const ROWS = Math.floor(canvas.height / GRID);
    
    // KHỞI TẠO MÊ CUNG (DFS Algorithm)
    let maze = [];
    for (let r = 0; r < ROWS; r++) {
        maze[r] = [];
        for (let c = 0; c < COLS; c++) maze[r][c] = { c, r, walls: [true, true, true, true], v: false };
    }

    function genMaze() {
        let curr = maze[0][0], stack = []; curr.v = true;
        while(true) {
            let neighbors = [], {c, r} = curr;
            [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]].forEach(d => {
                let n = maze[r+d[1]] && maze[r+d[1]][c+d[0]];
                if (n && !n.v) neighbors.push({cell: n, w1: d[2], w2: d[3]});
            });
            if (neighbors.length > 0) {
                let next = neighbors[Math.floor(Math.random()*neighbors.length)];
                next.cell.v = true; stack.push(curr);
                curr.walls[next.w1] = false; next.cell.walls[next.w2] = false; curr = next.cell;
            } else if (stack.length > 0) curr = stack.pop();
            else break;
        }
    }
    genMaze();

    // KHỞI TẠO ĐỐI TƯỢNG
    let player = { x: GRID/2, y: GRID/2, a: 0, hp: 999, size: 20 };
    let boss = { x: (COLS-1)*GRID+GRID/2, y: (ROWS-1)*GRID+GRID/2, a: 0, hp: 15, size: 24, targetA: 0 };
    let bullets = [], particles = [], gameOver = false;
    let mouse = { x: 0, y: 0, down: false };
    let keys = {};

    // VẬT LÝ VA CHẠM ĐA ĐIỂM (CHỐNG XUYÊN TƯỜNG 10000%)
    function isColliding(x, y, size) {
        const points = [
            {x: x - size, y: y - size}, {x: x + size, y: y - size},
            {x: x - size, y: y + size}, {x: x + size, y: y + size}
        ];
        for (let p of points) {
            let cx = Math.floor(p.x / GRID), cy = Math.floor(p.y / GRID);
            if (!maze[cy] || !maze[cy][cx]) return true;
            let cell = maze[cy][cx];
            let rx = p.x % GRID, ry = p.y % GRID;
            let buffer = 5;
            if (cell.walls[0] && ry < buffer) return true;
            if (cell.walls[1] && rx > GRID - buffer) return true;
            if (cell.walls[2] && ry > GRID - buffer) return true;
            if (cell.walls[3] && rx < buffer) return true;
        }
        return false;
    }

    // TÍNH TOÁN ĐƯỜNG ĐẠN NẢY (PREDICTION RAYCASTING)
    function calculateTrajectory(startX, startY, angle, maxBounces = 3) {
        let pts = [{x: startX, y: startY}];
        let tx = startX, ty = startY;
        let vx = Math.cos(angle) * BULLET_SPEED;
        let vy = Math.sin(angle) * BULLET_SPEED;
        let bounces = 0;

        for (let i = 0; i < 400; i++) {
            tx += vx; ty += vy;
            let cx = Math.floor(tx / GRID), cy = Math.floor(ty / GRID);
            if (!maze[cy] || !maze[cy][cx]) break;
            
            let rx = tx % GRID, ry = ty % GRID;
            let hit = false;
            if ((maze[cy][cx].walls[0] && ry < 8) || (maze[cy][cx].walls[2] && ry > GRID - 8)) { vy *= -1; hit = true; }
            else if ((maze[cy][cx].walls[3] && rx < 8) || (maze[cy][cx].walls[1] && rx > GRID - 8)) { vx *= -1; hit = true; }

            if (hit) {
                pts.push({x: tx, y: ty});
                bounces++;
                if (bounces > maxBounces) break;
            }
        }
        pts.push({x: tx, y: ty});
        return pts;
    }

    // AI TÌM ĐƯỜNG (A*)
    function getNextPath() {
        let start = {c: Math.floor(boss.x/GRID), r: Math.floor(boss.y/GRID)};
        let target = {c: Math.floor(player.x/GRID), r: Math.floor(player.y/GRID)};
        let q = [[start]], v = new Set([`${start.c},${start.r}`]);
        while(q.length > 0) {
            let path = q.shift(), curr = path[path.length-1];
            if(curr.c === target.c && curr.r === target.r) return path[1] || path[0];
            [[0,-1,0],[1,0,1],[0,1,2],[-1,0,3]].forEach(d => {
                if(maze[curr.r] && maze[curr.r][curr.c] && !maze[curr.r][curr.c].walls[d[2]]) {
                    let nc = curr.c+d[0], nr = curr.r+d[1];
                    if(maze[nr] && maze[nr][nc] && !v.has(`${nc},${nr}`)) { v.add(`${nc},${nr}`); q.push([...path, {c: nc, r: nr}]); }
                }
            });
        }
        return start;
    }

    function spawnParticles(x, y, color) {
        for(let i=0; i<8; i++) particles.push({x, y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 1, color});
    }

    function fire(obj, owner) {
        bullets.push({ 
            x: obj.x + Math.cos(obj.a)*30, 
            y: obj.y + Math.sin(obj.a)*30, 
            vx: Math.cos(obj.a)*BULLET_SPEED, 
            vy: Math.sin(obj.a)*BULLET_SPEED, 
            o: owner, 
            t: Date.now(),
            bounces: 0
        });
    }

    // INPUTS
    window.onmousemove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
    window.onmousedown = () => { mouse.down = true; if(!gameOver) fire(player, 'p'); };
    window.onmouseup = () => { mouse.down = false; };
    window.onkeydown = (e) => { 
        keys[e.code] = true; 
        if(e.code === 'Space' && !gameOver) fire(player, 'p'); 
    };
    window.onkeyup = (e) => { keys[e.code] = false; };

    function update() {
        if(gameOver) return;

        // PLAYER MOVEMENT (CHỈ KHI NHẤN CHUỘT)
        player.a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        if(mouse.down) {
            let dx = Math.cos(player.a) * P_SPEED;
            let dy = Math.sin(player.a) * P_SPEED;
            if(!isColliding(player.x + dx, player.y, player.size)) player.x += dx;
            if(!isColliding(player.x, player.y + dy, player.size)) player.y += dy;
        }

        // BOSS AI LOGIC
        let node = getNextPath();
        let tx = node.c * GRID + GRID/2, ty = node.r * GRID + GRID/2;
        let angleToNode = Math.atan2(ty - boss.y, tx - boss.x);
        
        // Di chuyển boss
        let bdx = Math.cos(angleToNode) * B_SPEED, bdy = Math.sin(angleToNode) * B_SPEED;
        if(!isColliding(boss.x + bdx, boss.y + bdy, boss.size)) {
            boss.x += bdx; boss.y += bdy;
        }

        // AI BẮN NẢY CAO CẤP
        let shotFound = false;
        for(let ra = 0; ra < Math.PI*2; ra += 0.2) {
            let traj = calculateTrajectory(boss.x, boss.y, ra, 2);
            for(let i=0; i < traj.length-1; i++) {
                let dist = distToSegment(player, traj[i], traj[i+1]);
                if(dist < 30) {
                    boss.targetA = ra;
                    shotFound = true;
                    break;
                }
            }
            if(shotFound) break;
        }

        // Xoay nòng boss mượt mà
        let adiff = boss.targetA - boss.a;
        while(adiff < -Math.PI) adiff += Math.PI*2;
        while(adiff > Math.PI) adiff -= Math.PI*2;
        boss.a += adiff * 0.1;

        if(shotFound && Math.abs(adiff) < 0.2 && Date.now() - boss.lastFire > 1200) {
            fire(boss, 'b');
            boss.lastFire = Date.now();
            aiAct.innerText = "AI: RICOCHET LETHAL VECTOR FOUND!";
        } else {
            aiAct.innerText = "AI: CALCULATING BOUNCE VECTORS...";
        }

        // XỬ LÝ ĐẠN
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            let cx = Math.floor(b.x/GRID), cy = Math.floor(b.y/GRID);
            if(!maze[cy] || !maze[cy][cx]) { bullets.splice(i, 1); return; }
            
            let rx = b.x % GRID, ry = b.y % GRID;
            let hit = false;
            if ((maze[cy][cx].walls[0] && ry < 10) || (maze[cy][cx].walls[2] && ry > GRID - 10)) { b.vy *= -1; hit = true; }
            else if ((maze[cy][cx].walls[3] && rx < 10) || (maze[cy][cx].walls[1] && rx > GRID - 10)) { b.vx *= -1; hit = true; }
            
            if(hit) { b.bounces++; spawnParticles(b.x, b.y, b.o==='p'?'#0f0':'#f05'); }
            if(b.bounces > 4 || Date.now() - b.t > 6000) bullets.splice(i, 1);

            // Va chạm nhân vật
            if(b.o === 'p' && Math.hypot(b.x - boss.x, b.y - boss.y) < 30) {
                boss.hp--; bullets.splice(i, 1);
                if(boss.hp <= 0) endGame("MISSION CLEAR");
            }
            if(b.o === 'b' && Math.hypot(b.x - player.x, b.y - player.y) < 25) {
                bullets.splice(i, 1); // Immortal
            }
        });

        // Particles
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            if(p.life <= 0) particles.splice(i, 1);
        });

        bHPText.innerText = boss.hp;
    }

    function distToSegment(p, v, w) {
        let l2 = Math.pow(v.x-w.x, 2) + Math.pow(v.y-w.y, 2);
        if (l2 == 0) return Math.hypot(p.x-v.x, p.y-v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function endGame(s) { gameOver = true; document.getElementById('msg').innerText = s; document.getElementById('msg').style.display = 'block'; setTimeout(()=>location.reload(), 3000); }

    function draw() {
        ctx.fillStyle = '#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
        
        // Vẽ lưới mê cung
        ctx.strokeStyle = '#333'; ctx.lineWidth = 4;
        maze.forEach(r => r.forEach(c => {
            let x = c.c*GRID, y = c.r*GRID;
            if(c.walls[0]) { ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+GRID,y); ctx.stroke(); }
            if(c.walls[1]) { ctx.beginPath(); ctx.moveTo(x+GRID,y); ctx.lineTo(x+GRID,y+GRID); ctx.stroke(); }
            if(c.walls[2]) { ctx.beginPath(); ctx.moveTo(x+GRID,y+GRID); ctx.lineTo(x,y+GRID); ctx.stroke(); }
            if(c.walls[3]) { ctx.beginPath(); ctx.moveTo(x,y+GRID); ctx.lineTo(x,y); ctx.stroke(); }
        }));

        // Đường đạn dự đoán của người chơi
        let pTraj = calculateTrajectory(player.x, player.y, player.a, 2);
        ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(0, 255, 0, 0.3)';
        ctx.beginPath(); pTraj.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke(); ctx.setLineDash([]);

        // Vẽ Player (Xanh lá)
        ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.a);
        ctx.fillStyle = '#0f0'; ctx.fillRect(-18, -18, 36, 36);
        ctx.fillStyle = '#fff'; ctx.fillRect(5, -5, 25, 10);
        ctx.restore();

        // Vẽ Boss (Đỏ neon)
        ctx.save(); ctx.translate(boss.x, boss.y); ctx.rotate(boss.a);
        ctx.shadowBlur = 15; ctx.shadowColor = '#f05';
        ctx.fillStyle = '#f05'; ctx.fillRect(-22, -22, 44, 44);
        ctx.fillStyle = '#fff'; ctx.fillRect(5, -6, 30, 12);
        ctx.restore(); ctx.shadowBlur = 0;

        // Đạn và hiệu ứng
        bullets.forEach(b => {
            ctx.fillStyle = b.o==='p'?'#0f0':'#f05';
            ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, 7); ctx.fill();
        });
        particles.forEach(p => {
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 3, 3);
        }); ctx.globalAlpha = 1;

        update(); requestAnimationFrame(draw);
    }
    boss.lastFire = 0;
    draw();
</script>
</body>
</html>
