<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI - Full Body Safety</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: white; pointer-events: none; z-index: 10; }
        .stat { font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">MÁU BOSS: <span id="hp" style="color: #ff3333;">3</span></div>
    <div style="font-size: 12px; color: #0ff;">HỆ THỐNG TÍNH TOÁN DIỆN TÍCH THÂN XE...</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 225;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;
    const BOSS_SIZE = 44; // Kích thước bao quát của xe

    let boss = { 
        x: ARENA_X, y: ARENA_Y, angle: 0, hp: 3, 
        targetX: ARENA_X, targetY: ARENA_Y,
        isMoving: false
    };
    
    let bullets = [];

    window.addEventListener('pointerdown', (e) => {
        if (Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y) <= ARENA_RADIUS) return;
        
        setTimeout(() => {
            const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
            bullets.push({ 
                x: e.clientX, y: e.clientY, 
                vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8 
            });
            // Tính toán lại ngay khi có đạn mới
            calculateBestEscape(); 
        }, 500);
    });

    function calculateBestEscape() {
        let bestPoint = { x: boss.x, y: boss.y };
        let minDanger = Infinity;

        // Quét lưới các điểm trong Arena
        for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 12) {
            for (let dist = 0; dist < ARENA_RADIUS - 30; dist += 40) {
                let testX = ARENA_X + Math.cos(angle) * dist;
                let testY = ARENA_Y + Math.sin(angle) * dist;

                let totalDanger = 0;
                
                bullets.forEach(b => {
                    // Dự đoán quỹ đạo đạn trong 150 frame tới
                    for (let t = 0; t <= 150; t += 15) {
                        let fbx = b.x + b.vx * t;
                        let fby = b.y + b.vy * t;
                        
                        // Tính khoảng cách từ đạn tới điểm test
                        let d = Math.hypot(testX - fbx, testY - fby);
                        
                        // Nếu đạn đi vào vùng diện tích của xe (có bù thêm buffer 15px)
                        if (d < (BOSS_SIZE / 2) + 15) {
                            totalDanger += (150 - t); 
                        }
                    }
                });

                // Ưu tiên các điểm gần vị trí hiện tại nếu độ nguy hiểm bằng nhau
                let distToCurrent = Math.hypot(testX - boss.x, testY - boss.y);
                let score = totalDanger * 1000 + distToCurrent;

                if (score < minDanger) {
                    minDanger = score;
                    bestPoint = { x: testX, y: testY };
                }
            }
        }

        // Nếu điểm tốt nhất vẫn an toàn hơn vị trí hiện tại đáng kể
        boss.targetX = bestPoint.x;
        boss.targetY = bestPoint.y;
        boss.isMoving = true;
    }

    function update() {
        if (boss.isMoving) {
            const dx = boss.targetX - boss.x;
            const dy = boss.targetY - boss.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 3) {
                const targetAngle = Math.atan2(dy, dx);
                let diff = targetAngle - boss.angle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                
                boss.angle += diff * 0.15;

                // Tiến/Lùi kết hợp để đến đích nhanh nhất
                let moveSpeed = 5;
                if (Math.abs(diff) > Math.PI / 2) moveSpeed = -5;
                
                boss.x += Math.cos(boss.angle) * moveSpeed;
                boss.y += Math.sin(boss.angle) * moveSpeed;
            } else {
                boss.isMoving = false;
            }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            
            // Va chạm chuẩn xác với thân xe
            if (Math.hypot(b.x - boss.x, b.y - boss.y) < 22) {
                boss.hp--;
                hpTxt.innerText = boss.hp;
                bullets.splice(i, 1);
                if (boss.hp <= 0) { alert("BẠN THẮNG!"); location.reload(); }
                continue;
            }
            if (b.x < -100 || b.x > canvas.width+100 || b.y < -100 || b.y > canvas.height+100) bullets.splice(i, 1);
        }
    }

    function draw() {
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Arena
        ctx.beginPath(); ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();

        // Vẽ vùng an toàn mục tiêu (Mờ)
        if (boss.isMoving) {
            ctx.beginPath();
            ctx.arc(boss.targetX, boss.targetY, 22, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.fill();
        }

        // Vẽ Boss
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(boss.angle);
        ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-22, -22, 44, 10); ctx.fillRect(-22, 12, 44, 10);
        ctx.fillStyle = boss.hp === 1 ? '#ff00ff' : '#ff3333';
        ctx.fillRect(-18, -15, 36, 30);
        ctx.fillStyle = '#000'; ctx.fillRect(0, -4, 25, 8);
        ctx.restore();

        // Vẽ đạn
        ctx.fillStyle = '#0f0';
        bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
