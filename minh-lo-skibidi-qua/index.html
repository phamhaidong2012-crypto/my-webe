<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tank Maze v20.0 - A* Boss Intelligence</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020202; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: #0f0; pointer-events: none; z-index: 10; font-weight: bold; }
        .hp-bar { color: #f00; font-size: 24px; }
        #death-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(136, 0, 0, 0.8); color: white; display: none;
            justify-content: center; align-items: center; flex-direction: column;
            font-size: 50px; font-weight: 900; z-index: 100;
        }
    </style>
</head>
<body>

<div id="ui">
    <div>TANK HP: <span id="p-hp" class="hp-bar">3</span> | BOSS HP: <span id="b-hp" class="hp-bar">5</span></div>
    <div style="font-size: 14px; color: #888;">GIỮ CHUỘT: DI CHUYỂN | SPACE/CLICK: BẮN</div>
</div>

<div id="death-screen">
    <div id="status-msg">MISSION FAILED</div>
    <button onclick="location.reload()" style="margin-top:20px; padding:15px 30px; font-size:20px; cursor:pointer;">THỬ LẠI</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const pHPText = document.getElementById('p-hp'), bHPText = document.getElementById('b-hp');
    const deathScreen = document.getElementById('death-screen'), statusMsg = document.getElementById('status-msg');

    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    const GRID_SIZE = 100, BULLET_SPEED = 8, BULLET_LIFE = 5000;
    const COLS = Math.floor(canvas.width / GRID_SIZE), ROWS = Math.floor(canvas.height / GRID_SIZE);
    
    // --- MÊ CUNG & PATHFINDING ---
    let maze = [];
    class Cell {
        constructor(c, r) { this.c = c; this.r = r; this.walls = [true, true, true, true]; this.visited = false; }
        draw() {
            let x = this.c * GRID_SIZE, y = this.r * GRID_SIZE;
            ctx.strokeStyle = '#444'; ctx.lineWidth = 6; ctx.beginPath();
            if (this.walls[0]) { ctx.moveTo(x, y); ctx.lineTo(x + GRID_SIZE, y); }
            if (this.walls[1]) { ctx.moveTo(x + GRID_SIZE, y); ctx.lineTo(x + GRID_SIZE, y + GRID_SIZE); }
            if (this.walls[2]) { ctx.moveTo(x + GRID_SIZE, y + GRID_SIZE); ctx.lineTo(x, y + GRID_SIZE); }
            if (this.walls[3]) { ctx.moveTo(x, y + GRID_SIZE); ctx.lineTo(x, y); }
            ctx.stroke();
        }
    }

    function initMaze() {
        for (let r = 0; r < ROWS; r++) { maze[r] = []; for (let c = 0; c < COLS; c++) maze[r][c] = new Cell(c, r); }
        let current = maze[0][0], stack = []; current.visited = true;
        do {
            let neighbors = [], c = current.c, r = current.r;
            [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]].forEach(d => {
                let nc = c+d[0], nr = r+d[1], n = maze[nr] && maze[nr][nc];
                if (n && !n.visited) neighbors.push({cell: n, w1: d[2], w2: d[3]});
            });
            if (neighbors.length > 0) {
                let next = neighbors[Math.floor(Math.random()*neighbors.length)];
                next.cell.visited = true; stack.push(current);
                current.walls[next.w1] = false; next.cell.walls[next.w2] = false; current = next.cell;
            } else if (stack.length > 0) current = stack.pop();
        } while (stack.length > 0);
    }
    initMaze();

    // --- ĐỐI TƯỢNG ---
    let player = { x: GRID_SIZE/2, y: GRID_SIZE/2, angle: 0, hp: 3 };
    let boss = { x: (COLS-1)*GRID_SIZE+50, y: (ROWS-1)*GRID_SIZE+50, angle: 0, hp: 5, path: [] };
    let bullets = [];
    let mouse = { x: 0, y: 0, down: false };

    window.onmousemove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
    window.onmousedown = () => { mouse.down = true; fire(player, '#0f0', 'player'); };
    window.onmouseup = () => { mouse.down = false; };
    window.onkeydown = (e) => { if(e.code === 'Space') fire(player, '#0f0', 'player'); };

    function fire(obj, color, owner) {
        let vx = Math.cos(obj.angle) * BULLET_SPEED, vy = Math.sin(obj.angle) * BULLET_SPEED;
        bullets.push({ x: obj.x, y: obj.y, vx, vy, color, owner, spawnTime: Date.now() });
    }

    // KIỂM TRA VA CHẠM TƯỜNG (CHỐNG XUYÊN)
    function checkCollision(x, y, vx, vy) {
        let cx = Math.floor(x/GRID_SIZE), cy = Math.floor(y/GRID_SIZE);
        if(!maze[cy] || !maze[cy][cx]) return { hit: true };
        let buffer = 12;
        if(vx > 0 && maze[cy][cx].walls[1] && x > (cx+1)*GRID_SIZE - buffer) return { hit: true, axis: 'x' };
        if(vx < 0 && maze[cy][cx].walls[3] && x < cx*GRID_SIZE + buffer) return { hit: true, axis: 'x' };
        if(vy > 0 && maze[cy][cx].walls[2] && y > (cy+1)*GRID_SIZE - buffer) return { hit: true, axis: 'y' };
        if(vy < 0 && maze[cy][cx].walls[0] && y < cy*GRID_SIZE + buffer) return { hit: true, axis: 'y' };
        return { hit: false };
    }

    // THUẬT TOÁN A* GIẢI MÊ CUNG CHO BOSS
    function findPath(startC, startR, endC, endR) {
        let openSet = [{c: startC, r: startR, f: 0, g: 0, parent: null}];
        let closedSet = new Set();
        while(openSet.length > 0) {
            let current = openSet.sort((a, b) => a.f - b.f).shift();
            if(current.c === endC && current.r === endR) {
                let path = [];
                while(current) { path.push({x: current.c*GRID_SIZE+50, y: current.r*GRID_SIZE+50}); current = current.parent; }
                return path.reverse();
            }
            closedSet.add(`${current.c},${current.r}`);
            [[0,-1,0],[1,0,1],[0,1,2],[-1,0,3]].forEach(d => {
                let nc = current.c+d[0], nr = current.r+d[1];
                if(nc>=0 && nc<COLS && nr>=0 && nr<ROWS && !maze[current.r][current.c].walls[d[2]] && !closedSet.has(`${nc},${nr}`)) {
                    let g = current.g + 1;
                    let f = g + Math.abs(nc-endC) + Math.abs(nr-endR);
                    if(!openSet.find(o => o.c===nc && o.r===nr && o.g <= g)) openSet.push({c: nc, r: nr, f, g, parent: current});
                }
            });
        }
        return [];
    }

    let lastBossFire = 0, lastPathUpdate = 0;

    function update() {
        if (player.hp <= 0 || boss.hp <= 0) return;

        // Player Move
        let dx = mouse.x - player.x, dy = mouse.y - player.y;
        player.angle = Math.atan2(dy, dx);
        if(mouse.down && Math.hypot(dx, dy) > 15) {
            let stepX = Math.cos(player.angle) * 4, stepY = Math.sin(player.angle) * 4;
            if(!checkCollision(player.x + stepX, player.y, stepX, 0).hit) player.x += stepX;
            if(!checkCollision(player.x, player.y + stepY, 0, stepY).hit) player.y += stepY;
        }

        // Boss A* Pathfinding (Update mỗi 0.5s để mượt)
        if(Date.now() - lastPathUpdate > 500) {
            boss.path = findPath(Math.floor(boss.x/GRID_SIZE), Math.floor(boss.y/GRID_SIZE), Math.floor(player.x/GRID_SIZE), Math.floor(player.y/GRID_SIZE));
            lastPathUpdate = Date.now();
        }
        if(boss.path.length > 1) {
            let target = boss.path[1];
            let bdx = target.x - boss.x, bdy = target.y - boss.y;
            boss.x += Math.sign(bdx) * 2.5; boss.y += Math.sign(bdy) * 2.5;
        }
        boss.angle = Math.atan2(player.y - boss.y, player.x - boss.x);

        if(Date.now() - lastBossFire > 1400) { fire(boss, '#f00', 'boss'); lastBossFire = Date.now(); }

        // Bullet Logic (Chống xuyên tường 100%)
        bullets.forEach((b, i) => {
            let subSteps = 4; // Chia nhỏ bước di chuyển để check va chạm kĩ hơn
            for(let s=0; s<subSteps; s++) {
                let nx = b.x + b.vx/subSteps, ny = b.y + b.vy/subSteps;
                let col = checkCollision(nx, ny, b.vx, b.vy);
                if(col.hit) {
                    if(col.axis === 'x') b.vx *= -1; else b.vy *= -1;
                    break; 
                }
                b.x = nx; b.y = ny;
            }
            
            if(Date.now() - b.spawnTime > BULLET_LIFE) bullets.splice(i, 1);
            if(Math.hypot(b.x - boss.x, b.y - boss.y) < 25 && b.owner === 'player') {
                boss.hp--; bHPText.innerText = boss.hp; bullets.splice(i, 1);
                if(boss.hp <= 0) { statusMsg.innerText = "CHIẾN THẮNG!"; deathScreen.style.display="flex"; }
            }
            if(Math.hypot(b.x - player.x, b.y - player.y) < 25 && b.owner === 'boss') {
                player.hp--; pHPText.innerText = player.hp; bullets.splice(i, 1);
                if(player.hp <= 0) { statusMsg.innerText = "BẠN ĐÃ THUA!"; deathScreen.style.display="flex"; }
            }
        });
    }

    function draw() {
        ctx.fillStyle = '#020202'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        maze.forEach(row => row.forEach(c => c.draw()));

        // Vẽ Path của Boss (Để bạn thấy Boss đang giải thuật toán)
        if(boss.path.length > 0) {
            ctx.beginPath(); ctx.strokeStyle = 'rgba(255,0,0,0.1)';
            boss.path.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
        }

        // Tank Player
        ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
        ctx.fillStyle = '#0f0'; ctx.fillRect(-22, -20, 44, 40); ctx.fillStyle = '#0a0'; ctx.fillRect(10, -6, 35, 12);
        ctx.restore();

        // Boss
        ctx.save(); ctx.translate(boss.x, boss.y); ctx.rotate(boss.angle);
        ctx.fillStyle = '#f33'; ctx.fillRect(-25, -25, 50, 50); ctx.fillStyle = '#900'; ctx.fillRect(10, -8, 30, 16);
        ctx.restore();

        // Đạn
        bullets.forEach(b => {
            ctx.fillStyle = b.color; ctx.shadowBlur = 10; ctx.shadowColor = b.color;
            ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
        });

        update(); requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
