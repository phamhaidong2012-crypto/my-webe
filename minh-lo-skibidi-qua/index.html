<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI - Tank Dodge</title>
    <style>
        body { margin: 0; overflow: hidden; background: #333; touch-action: none; font-family: sans-serif; }
        canvas { display: block; background: #222; }
        #ui { position: fixed; top: 10px; left: 10px; color: white; pointer-events: none; font-size: 20px; }
    </style>
</head>
<body>

<div id="ui">MÁU BOSS: <span id="hp">3</span></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let boss = { x: canvas.width / 2, y: 150, w: 50, h: 50, hp: 3, color: 'red', vx: 0, vy: 0 };
    let bullets = [];
    let spawnQueue = []; // Hàng đợi tạo đạn sau 0.5s

    // Nhấp chuột để bắn
    window.addEventListener('pointerdown', (e) => {
        // Không bắn nếu trúng vị trí Boss
        if (Math.hypot(e.clientX - boss.x, e.clientY - boss.y) < 50) return;

        // Đợi 0.5 giây rồi mới tạo đạn
        setTimeout(() => {
            const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
            bullets.push({
                x: e.clientX,
                y: e.clientY,
                vx: Math.cos(angle) * 7,
                vy: Math.sin(angle) * 7,
                active: true
            });
        }, 500);
    });

    function update() {
        // Boss AI: Tính toán né đạn
        let dodgeX = 0;
        let dodgeY = 0;

        bullets.forEach(b => {
            if (!b.active) return;

            // Dự đoán vị trí va chạm
            let dist = Math.hypot(b.x - boss.x, b.y - boss.y);
            
            // Nếu đạn đang bay đến gần (khoảng cách < 200px)
            if (dist < 200) {
                // Tính toán vector né vuông góc với quỹ đạo đạn
                let dx = boss.x - b.x;
                let dy = boss.y - b.y;
                
                // Boss di chuyển ngang để né
                dodgeX += dy > 0 ? 5 : -5;
                dodgeY += dx > 0 ? -5 : 5;
            }
        });

        // Áp dụng di chuyển né và giới hạn trong màn hình
        if (dodgeX !== 0) boss.x += (dodgeX > 0 ? 4 : -4);
        if (dodgeY !== 0) boss.y += (dodgeY > 0 ? 4 : -4);

        // Giới hạn biên màn hình
        boss.x = Math.max(50, Math.min(canvas.width - 50, boss.x));
        boss.y = Math.max(50, Math.min(canvas.height - 200, boss.y));

        // Cập nhật đạn
        bullets.forEach((b, index) => {
            b.x += b.vx;
            b.y += b.vy;

            // Kiểm tra va chạm với Boss
            if (b.active && Math.hypot(b.x - boss.x, b.y - boss.y) < 30) {
                boss.hp--;
                b.active = false;
                hpTxt.innerText = Math.max(0, boss.hp);
                if (boss.hp <= 0) {
                    setTimeout(() => { alert("Boss đã bị tiêu diệt!"); location.reload(); }, 100);
                }
            }

            // Xóa đạn ra khỏi màn hình
            if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                bullets.splice(index, 1);
            }
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Vẽ Boss (Xe tăng)
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.fillStyle = boss.color;
        ctx.fillRect(-25, -25, 50, 50); // Thân xe
        ctx.fillStyle = "black";
        ctx.fillRect(-5, -35, 10, 20); // Nòng pháo
        // Vẽ bánh xích
        ctx.fillStyle = "#555";
        ctx.fillRect(-30, -25, 10, 50);
        ctx.fillRect(20, -25, 10, 50);
        ctx.restore();

        // Vẽ đạn
        ctx.fillStyle = "yellow";
        bullets.forEach(b => {
            if (b.active) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        update();
        requestAnimationFrame(draw);
    }

    draw();
</script>

</body>
</html>
