<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trân skibidi - Hà Beo Hunter</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; color: white; }
        #bg { position: fixed; width: 100vw; height: 100vh; background-image: radial-gradient(#222 1px, transparent 1px); background-size: 60px 60px; z-index: 1; }
        canvas { position: relative; z-index: 10; display: block; }
        #ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 15px; border: 2px solid #00ffff; text-align: center; z-index: 100; min-width: 320px; box-shadow: 0 0 15px #00ffff; }
        .stats { display: flex; justify-content: center; gap: 8px; font-weight: bold; font-size: 13px; margin-top: 5px; }
        #move-controls { position: fixed; bottom: 20px; left: 20px; display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; z-index: 100; }
        #action-controls { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 100; }
        .btn { width: 60px; height: 60px; background: rgba(255,255,255,0.1); border: 2px solid white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; user-select: none; }
        #btn-shoot { width: 90px; height: 90px; background: #ff4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 4px solid white; box-shadow: 0 0 20px red; }
        .rotate-group { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div id="bg"></div>
<div id="ui">
    <div style="color: #00ffff; font-weight: bold;">TRÂN SKIBIDI VS HÀ BEO BÉO BÈO</div>
    <div class="stats">
        <div>HÀ: <span id="c1">0</span>/10 | BEO: <span id="c2">0</span>/10 | BÉO: <span id="c3">0</span>/10 | BÈO: <span id="c4">0</span>/10</div>
    </div>
</div>

<div id="move-controls">
    <div></div><div class="btn" id="up">↑</div><div></div>
    <div class="btn" id="left">←</div><div class="btn" id="down">↓</div><div class="btn" id="right">→</div>
</div>

<div id="action-controls">
    <div class="rotate-group">
        <div class="btn" id="rot-left">⟲</div>
        <div class="btn" id="rot-right">⟳</div>
    </div>
    <div id="btn-shoot">BẮN</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bg = document.getElementById('bg');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let worldX = 0, worldY = 0;
    const player = { angle: 0, speed: 5, rotSpeed: 0.08, hp: 10, lastHit: 0 };
    const bullets = [], enemies = [], particles = [];
    const counts = { 'HÀ': 0, 'BEO': 0, 'BÉO': 0, 'BÈO': 0 };
    const words = ['HÀ', 'BEO', 'BÉO', 'BÈO'];
    const keys = { up: false, down: false, left: false, right: false, rotL: false, rotR: false };

    function bind(id, key) {
        const el = document.getElementById(id);
        const start = (e) => { e.preventDefault(); keys[key] = true; };
        const end = (e) => { e.preventDefault(); keys[key] = false; };
        el.addEventListener('touchstart', start);
        el.addEventListener('touchend', end);
        el.onmousedown = start;
        el.onmouseup = end;
        el.onmouseleave = end;
    }

    bind('up', 'up'); bind('down', 'down'); bind('left', 'left'); bind('right', 'right');
    bind('rot-left', 'rotL'); bind('rot-right', 'rotR');

    function shoot() {
        bullets.push({
            x: worldX + canvas.width/2 + Math.cos(player.angle)*40,
            y: worldY + canvas.height/2 + Math.sin(player.angle)*40,
            vx: Math.cos(player.angle)*12,
            vy: Math.sin(player.angle)*12
        });
    }
    document.getElementById('btn-shoot').onclick = (e) => { e.preventDefault(); shoot(); };

    setInterval(() => {
        const angle = Math.random() * Math.PI * 2;
        enemies.push({
            x: worldX + canvas.width/2 + Math.cos(angle)*600,
            y: worldY + canvas.height/2 + Math.sin(angle)*600,
            text: words[Math.floor(Math.random()*4)],
            speed: 1.6,
            color: `hsl(${Math.random()*360}, 100%, 75%)`
        });
    }, 900);

    function update() {
        if(keys.up) worldY -= player.speed;
        if(keys.down) worldY += player.speed;
        if(keys.left) worldX -= player.speed;
        if(keys.right) worldX += player.speed;
        if(keys.rotL) player.angle -= player.rotSpeed;
        if(keys.rotR) player.angle += player.rotSpeed;

        bg.style.backgroundPosition = `${-worldX}px ${-worldY}px`;

        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            if(Math.abs(b.x - (worldX+canvas.width/2)) > 1000) bullets.splice(i, 1);
        });

        const now = Date.now();
        enemies.forEach((en, i) => {
            const dx = (worldX + canvas.width/2) - en.x;
            const dy = (worldY + canvas.height/2) - en.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            en.x += (dx/dist)*en.speed;
            en.y += (dy/dist)*en.speed;

            if(dist < 45 && now - player.lastHit > 1000) {
                player.hp--; player.lastHit = now;
                if(player.hp <= 0) { alert("SKIBIDI TOILET THẤT BẠI! HÀ BEO QUÁ MẠNH."); location.reload(); }
            }

            bullets.forEach((b, bi) => {
                if(Math.sqrt((b.x-en.x)**2 + (b.y-en.y)**2) < 35) {
                    for(let k=0; k<12; k++) particles.push({x: en.x, y: en.y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1, color: en.color});
                    if(counts[en.text] < 10) {
                        counts[en.text]++;
                        ['c1','c2','c3','c4'].forEach((id, idx) => document.getElementById(id).innerText = counts[words[idx]]);
                    }
                    enemies.splice(i, 1); bullets.splice(bi, 1);
                    if(Object.values(counts).every(v => v >= 10)) { alert("CHÚC MỪNG TRÂN SKIBIDI ĐÃ CHIẾN THẮNG!"); location.reload(); }
                }
            });
        });
        particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.03; if(p.life <= 0) particles.splice(i, 1); });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(-worldX, -worldY);
        particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#ffaa00'; bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });
        ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center';
        enemies.forEach(en => { ctx.fillStyle = en.color; ctx.fillText(en.text, en.x, en.y); });
        ctx.restore();

        const cx = canvas.width/2, cy = canvas.height/2;
        ctx.fillStyle = '#333'; ctx.fillRect(cx - 30, cy - 60, 60, 10);
        ctx.fillStyle = '#00ff00'; ctx.fillRect(cx - 30, cy - 60, (player.hp/10)*60, 10);
        
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(player.angle);
        ctx.fillStyle = '#ff00ff'; ctx.beginPath(); ctx.arc(0, 0, 35, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'white'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.fillText("Trân skibidi", 0, 4);
        ctx.fillStyle = 'white'; ctx.fillRect(30, -5, 18, 10); // Nòng súng
        ctx.restore();

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
