<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI - Future Prediction</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: white; pointer-events: none; z-index: 10; }
        .stat { font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">MÁU BOSS: <span id="hp" style="color: #ff3333;">3</span></div>
    <div style="font-size: 12px; color: #0f0;">HỆ THỐNG DỰ BÁO QUỸ ĐẠO ĐANG CHẠY...</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 225;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;

    let boss = { 
        x: ARENA_X, y: ARENA_Y, angle: 0, hp: 3, 
        targetX: ARENA_X, targetY: ARENA_Y,
        isMoving: false
    };
    
    let bullets = [];

    window.addEventListener('pointerdown', (e) => {
        if (Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y) <= ARENA_RADIUS) return;
        
        // Giả lập 0.5s chuẩn bị của Boss khi người chơi nhấn
        setTimeout(() => {
            const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
            bullets.push({ 
                x: e.clientX, y: e.clientY, 
                vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8 
            });
            calculateBestEscape(); // Boss tính toán ngay khi đạn xuất hiện
        }, 500);
    });

    // Hàm tìm vị trí an toàn nhất
    function calculateBestEscape() {
        let bestPoint = { x: boss.x, y: boss.y };
        let minDanger = Infinity;

        // Boss quét 36 điểm xung quanh trong vòng tròn arena để tìm chỗ trống
        for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 18) {
            for (let dist = 30; dist < 120; dist += 30) {
                let testX = boss.x + Math.cos(angle) * dist;
                let testY = boss.y + Math.sin(angle) * dist;

                // Kiểm tra xem điểm test có nằm trong Arena không
                if (Math.hypot(testX - ARENA_X, testY - ARENA_Y) > ARENA_RADIUS - 30) continue;

                let totalDanger = 0;
                // Dự đoán vị trí đạn trong 1s, 2s tới (60 frame, 120 frame)
                bullets.forEach(b => {
                    for (let t = 0; t <= 120; t += 20) {
                        let futureBX = b.x + b.vx * t;
                        let futureBY = b.y + b.vy * t;
                        let d = Math.hypot(testX - futureBX, testY - futureBY);
                        if (d < 50) totalDanger += (120 - t); // Càng gần thời điểm hiện tại càng nguy hiểm
                    }
                });

                if (totalDanger < minDanger) {
                    minDanger = totalDanger;
                    bestPoint = { x: testX, y: testY };
                }
            }
        }
        boss.targetX = bestPoint.x;
        boss.targetY = bestPoint.y;
        boss.isMoving = true;
    }

    function update() {
        if (boss.isMoving) {
            const dx = boss.targetX - boss.x;
            const dy = boss.targetY - boss.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 2) {
                // Xoay về phía mục tiêu
                const targetAngle = Math.atan2(dy, dx);
                let diff = targetAngle - boss.angle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                
                boss.angle += diff * 0.15; // Xoay mượt

                // Quyết định Tiến hoặc Lùi để đến mục tiêu nhanh nhất
                let moveSpeed = 4.5;
                if (Math.abs(diff) > Math.PI / 2) {
                    moveSpeed = -4.5; // Lùi xe
                }
                
                boss.x += Math.cos(boss.angle) * moveSpeed;
                boss.y += Math.sin(boss.angle) * moveSpeed;
            } else {
                boss.isMoving = false; // Đã đến chỗ an toàn
            }
        }

        // Xử lý đạn và va chạm
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            
            if (Math.hypot(b.x - boss.x, b.y - boss.y) < 22) {
                boss.hp--;
                hpTxt.innerText = boss.hp;
                bullets.splice(i, 1);
                if (boss.hp <= 0) { alert("BẠN THẮNG!"); location.reload(); }
                continue;
            }
            if (b.x < -100 || b.x > canvas.width+100 || b.y < -100 || b.y > canvas.height+100) bullets.splice(i, 1);
        }
    }

    function draw() {
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Vẽ Arena
        ctx.beginPath(); ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = '#222'; ctx.stroke();

        // Vẽ đường dự báo đạn (Chỉ vẽ khi đạn xuất hiện)
        ctx.setLineDash([5, 5]);
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x + b.vx * 100, b.y + b.vy * 100);
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.2)';
            ctx.stroke();
        });
        ctx.setLineDash([]);

        // Vẽ Boss
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(boss.angle);
        ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-22, -22, 44, 10); ctx.fillRect(-22, 12, 44, 10);
        ctx.fillStyle = boss.hp === 1 ? '#ff00ff' : '#ff3333';
        ctx.fillRect(-18, -15, 36, 30);
        ctx.fillStyle = '#000'; ctx.fillRect(0, -4, 25, 8);
        ctx.restore();

        // Vẽ đạn
        ctx.fillStyle = '#0f0';
        bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
