<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minh Lỏ Shooter</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: sans-serif; touch-action: none; color: white; }
        canvas { display: block; }
        #ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 15px; border: 2px solid cyan; text-align: center; z-index: 100; min-width: 280px; }
        .stats { display: flex; justify-content: center; gap: 10px; font-weight: bold; font-size: 14px; margin-top: 5px; }
        #controls { position: fixed; bottom: 20px; left: 20px; display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; z-index: 100; }
        .btn { width: 60px; height: 60px; background: rgba(255,255,255,0.1); border: 2px solid white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; user-select: none; }
        #btn-shoot { position: fixed; bottom: 30px; right: 30px; width: 100px; height: 100px; background: red; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; border: 4px solid white; box-shadow: 0 0 20px red; }
    </style>
</head>
<body>

<div id="ui">
    <div style="color: cyan; letter-spacing: 2px;">MINH LỎ SHOOTER (DIỆT 2 MỖI LOẠI)</div>
    <div class="stats">
        <div>M: <span id="c1">0</span>/2</div>
        <div>L: <span id="c2">0</span>/2</div>
        <div>S: <span id="c3">0</span>/2</div>
        <div>Q: <span id="c4">0</span>/2</div>
    </div>
</div>

<div id="controls">
    <div></div><div class="btn" id="up">↑</div><div></div>
    <div class="btn" id="left">←</div><div class="btn" id="down">↓</div><div class="btn" id="right">→</div>
</div>
<div id="btn-shoot">BẮN</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const player = { x: canvas.width/2, y: canvas.height/2, angle: 0, size: 30 };
    const bullets = [];
    const enemies = [];
    const counts = { 'Minh': 0, 'Lỏ': 0, 'Skibidi': 0, 'Quá': 0 };
    const words = ['Minh', 'Lỏ', 'Skibidi', 'Quá'];
    let gameWin = false;

    // Sinh quái mỗi 1 giây
    setInterval(() => {
        if(gameWin) return;
        const side = Math.floor(Math.random() * 4);
        let x, y;
        if(side === 0) { x = Math.random()*canvas.width; y = -50; }
        else if(side === 1) { x = canvas.width+50; y = Math.random()*canvas.height; }
        else if(side === 2) { x = Math.random()*canvas.width; y = canvas.height+50; }
        else { x = -50; y = Math.random()*canvas.height; }
        
        enemies.push({
            x, y, 
            text: words[Math.floor(Math.random()*words.length)],
            speed: 1.5 + Math.random(),
            color: `hsl(${Math.random()*360}, 100%, 70%)`
        });
    }, 1000);

    function shoot() {
        bullets.push({
            x: player.x + Math.cos(player.angle) * 40,
            y: player.y + Math.sin(player.angle) * 40,
            vx: Math.cos(player.angle) * 7,
            vy: Math.sin(player.angle) * 7
        });
    }

    // Điều khiển
    const keys = {};
    window.onkeydown = (e) => { keys[e.key.toLowerCase()] = true; if(e.key === ' ') shoot(); };
    window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

    const setupBtn = (id, angle) => {
        document.getElementById(id).ontouchstart = (e) => { e.preventDefault(); player.angle = angle; shoot(); };
        document.getElementById(id).onmousedown = () => { player.angle = angle; shoot(); };
    };
    setupBtn('up', -Math.PI/2); setupBtn('down', Math.PI/2);
    setupBtn('left', Math.PI); setupBtn('right', 0);
    document.getElementById('btn-shoot').onclick = shoot;

    function update() {
        if(gameWin) return;

        // Xoay nhân vật bằng phím
        if(keys['arrowup'] || keys['w']) player.angle = -Math.PI/2;
        if(keys['arrowdown'] || keys['s']) player.angle = Math.PI/2;
        if(keys['arrowleft'] || keys['a']) player.angle = Math.PI;
        if(keys['arrowright'] || keys['d']) player.angle = 0;

        bullets.forEach((b, bi) => {
            b.x += b.vx; b.y += b.vy;
            if(b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(bi, 1);
        });

        enemies.forEach((en, ei) => {
            const dx = player.x - en.x;
            const dy = player.y - en.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            en.x += (dx/dist) * en.speed;
            en.y += (dy/dist) * en.speed;

            // Va chạm đạn
            bullets.forEach((b, bi) => {
                if(Math.sqrt((b.x-en.x)**2 + (b.y-en.y)**2) < 30) {
                    const txt = en.text;
                    if(counts[txt] < 2) {
                        counts[txt]++;
                        document.getElementById('c1').innerText = counts['Minh'];
                        document.getElementById('c2').innerText = counts['Lỏ'];
                        document.getElementById('c3').innerText = counts['Skibidi'];
                        document.getElementById('c4').innerText = counts['Quá'];
                    }
                    enemies.splice(ei, 1);
                    bullets.splice(bi, 1);
                    
                    if(Object.values(counts).every(v => v >= 2)) {
                        gameWin = true;
                        alert("CHÚC MỪNG XẠ THỦ MINH LỎ!");
                        location.reload();
                    }
                }
            });
        });
    }

    function draw() {
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Vẽ người chơi (Tam giác)
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);
        ctx.fillStyle = 'lime';
        ctx.beginPath();
        ctx.moveTo(30, 0); ctx.lineTo(-15, -20); ctx.lineTo(-15, 20); ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'white'; ctx.strokeWidth = 2; ctx.stroke();
        ctx.restore();

        // Vẽ đạn
        bullets.forEach(b => {
            ctx.fillStyle = 'yellow';
            ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
        });

        // Vẽ kẻ địch
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        enemies.forEach(en => {
            ctx.fillStyle = en.color;
            ctx.fillText(en.text, en.x, en.y);
        });

        update();
        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
