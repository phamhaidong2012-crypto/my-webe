<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minh Lỏ Pro Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; touch-action: none; }
        
        /* Nền gạch */
        #bg {
            position: fixed; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(to right, #111 1px, transparent 1px),
                linear-gradient(to bottom, #111 1px, transparent 1px);
            background-size: 80px 80px; z-index: 1;
        }

        /* Bảng nhiệm vụ ở giữa góc trên */
        #game-ui { 
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%); 
            background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 20px; 
            border: 2px solid lime; z-index: 200; color: white; text-align: center;
            min-width: 250px; box-shadow: 0 0 15px lime;
        }
        .task-list { display: flex; justify-content: center; gap: 10px; font-weight: bold; font-size: 14px; margin-top: 5px; }

        /* Nhân vật chính trung tâm */
        #player { 
            position: fixed; top: 50%; left: 50%; width: 70px; height: 70px; 
            background: #00ff00; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; color: black; font-weight: bold;
            box-shadow: 0 0 30px #00ff00; transform: translate(-50%, -50%); z-index: 100;
        }

        #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }

        /* Bản sao sinh ra mỗi 0.5s */
        .ghost { 
            position: absolute; width: 70px; height: 70px; background: rgba(0, 255, 0, 0.1); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.1); font-size: 8px; z-index: 5; pointer-events: none;
            transform: translate(-50%, -50%); transition: opacity 2s;
        }

        .item { position: absolute; font-weight: bold; font-size: 20px; transform: translate(-50%, -50%); z-index: 20; text-shadow: 0 0 5px white; }
        
        /* Nút bấm */
        #controls { position: fixed; bottom: 20px; left: 20px; display: grid; grid-template-columns: repeat(3, 55px); gap: 8px; z-index: 200; }
        .btn { width: 55px; height: 55px; background: rgba(255,255,255,0.15); border: 1px solid white; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; user-select: none; }
        #btn-n { position: fixed; bottom: 30px; right: 30px; width: 90px; height: 90px; background: gold; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; z-index: 210; border: 5px solid #fff; font-size: 30px; box-shadow: 0 0 20px orange; }

        /* Hiệu ứng pháo hoa chữ */
        .firework-text {
            position: fixed; pointer-events: none; font-weight: bold; z-index: 300;
            animation: fly 1.5s ease-out forwards;
        }
        @keyframes fly {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(3) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="bg"></div>
<div id="game-ui">
    <div style="color: gold; font-size: 16px;">NHIỆM VỤ THU THẬP</div>
    <div class="task-list">
        <div>M: <span id="c1" style="color:lime">0</span>/10</div>
        <div>L: <span id="c2" style="color:lime">0</span>/10</div>
        <div>S: <span id="c3" style="color:lime">0</span>/10</div>
        <div>Q: <span id="c4" style="color:lime">0</span>/10</div>
    </div>
</div>

<div id="container"></div>
<div id="player">Minh Lỏ</div>

<div id="controls">
    <div></div><div class="btn" id="up">↑</div><div></div>
    <div class="btn" id="left">←</div><div class="btn" id="down">↓</div><div class="btn" id="right">→</div>
</div>
<div id="btn-n">N</div>

<script>
    let posX = 0, posY = 0;
    const container = document.getElementById('container');
    const bg = document.getElementById('bg');
    const counts = { 'Minh': 0, 'Lỏ': 0, 'Skibidi': 0, 'Quá': 0 };
    let gameFinished = false, nPressed = 0;

    function draw() {
        bg.style.backgroundPosition = `${-posX}px ${-posY}px`;
        container.style.transform = `translate(${-posX}px, ${-posY}px)`;
        checkCollision();
    }

    // SINH BẢN SAO MỖI 0.5 GIÂY (0,5 GIÂY)
    setInterval(() => {
        if(gameFinished) return;
        const ghost = document.createElement('div');
        ghost.className = 'ghost';
        ghost.innerText = 'Minh Lỏ';
        ghost.style.left = (posX + window.innerWidth/2) + 'px';
        ghost.style.top = (posY + window.innerHeight/2) + 'px';
        container.appendChild(ghost);
        setTimeout(() => ghost.style.opacity = '0', 3000);
        setTimeout(() => ghost.remove(), 5000);
    }, 500);

    // Tạo vật phẩm
    const words = ['Minh', 'Lỏ', 'Skibidi', 'Quá'];
    words.forEach(word => {
        for(let i=0; i<10; i++) {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerText = word;
            item.style.color = `hsl(${Math.random()*360}, 100%, 70%)`;
            item.style.left = (Math.random() * 4000 - 2000) + 'px';
            item.style.top = (Math.random() * 4000 - 2000) + 'px';
            container.appendChild(item);
        }
    });

    function move(dx, dy) {
        if(gameFinished && nPressed < 10) return; 
        posX += dx; posY += dy;
        draw();
    }

    // Điều khiển phím
    const speed = 40;
    window.addEventListener('keydown', e => {
        if(e.key === 'w' || e.key === 'ArrowUp') move(0, -speed);
        if(e.key === 's' || e.key === 'ArrowDown') move(0, speed);
        if(e.key === 'a' || e.key === 'ArrowLeft') move(-speed, 0);
        if(e.key === 'd' || e.key === 'ArrowRight') move(speed, 0);
        if(e.key.toLowerCase() === 'n') handleN();
    });

    // Điều khiển nút
    const setupBtn = (id, dx, dy) => {
        const btn = document.getElementById(id);
        let interval;
        const start = () => interval = setInterval(() => move(dx, dy), 50);
        const stop = () => clearInterval(interval);
        btn.onmousedown = start; btn.onmouseup = stop;
        btn.ontouchstart = e => { e.preventDefault(); start(); };
        btn.ontouchend = stop;
    };
    setupBtn('up', 0, -25); setupBtn('down', 0, 25); setupBtn('left', -25, 0); setupBtn('right', 25, 0);

    function checkCollision() {
        const items = document.querySelectorAll('.item');
        const px = posX + window.innerWidth/2;
        const py = posY + window.innerHeight/2;

        items.forEach(item => {
            const ix = parseFloat(item.style.left);
            const iy = parseFloat(item.style.top);
            const d = Math.sqrt((px-ix)**2 + (py-iy)**2);
            if(d < 50) {
                const t = item.innerText;
                counts[t]++;
                document.getElementById('c1').innerText = counts['Minh'];
                document.getElementById('c2').innerText = counts['Lỏ'];
                document.getElementById('c3').innerText = counts['Skibidi'];
                document.getElementById('c4').innerText = counts['Quá'];
                item.remove();
                if(Object.values(counts).every(v => v >= 10)) {
                    gameFinished = true;
                    document.getElementById('btn-n').style.display = 'flex';
                    alert("NHIỆM VỤ XONG! ẤN N 10 LẦN ĐỂ KẾT HỢP!");
                }
            }
        });
    }

    function handleN() {
        if(!gameFinished || nPressed >= 10) return;
        nPressed++;
        // Hiệu ứng pháo hoa mỗi lần ấn
        spawnFireworkText();
        
        if(nPressed === 10) {
            for(let i=0; i<20; i++) setTimeout(spawnFireworkText, i * 100);
            setTimeout(() => {
                alert("CHÚC MỪNG MINH LỎ SKIBIDI QUÁ!");
                location.reload();
            }, 3000);
        }
    }

    function spawnFireworkText() {
        const wordsFW = ['Minh', 'Lỏ', 'Skibidi', 'Quá'];
        const word = wordsFW[Math.floor(Math.random()*wordsFW.length)];
        const fw = document.createElement('div');
        fw.className = 'firework-text';
        fw.innerText = word;
        fw.style.left = '50%';
        fw.style.top = '50%';
        fw.style.color = `hsl(${Math.random()*360}, 100%, 50%)`;
        fw.style.setProperty('--tx', (Math.random() - 0.5) * 800 + 'px');
        fw.style.setProperty('--ty', (Math.random() - 0.5) * 800 + 'px');
        document.body.appendChild(fw);
        setTimeout(() => fw.remove(), 1500);
    }

    document.getElementById('btn-n').onclick = handleN;
</script>
</body>
</html>
