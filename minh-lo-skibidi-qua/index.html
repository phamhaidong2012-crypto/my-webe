<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI v7 - Precision Threading</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: white; pointer-events: none; z-index: 10; }
        .stat { font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">MÁU BOSS: <span id="hp" style="color: #ff3333;">3</span></div>
    <div style="font-size: 11px; color: #aaa;">THREADING MODE: ACTIVE</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 225;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;

    let boss = { x: ARENA_X, y: ARENA_Y, angle: 0, hp: 3, targetX: ARENA_X, targetY: ARENA_Y, isMoving: false };
    let bullets = [];

    window.addEventListener('pointerdown', (e) => {
        if (Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y) <= ARENA_RADIUS) return;
        setTimeout(() => {
            const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
            bullets.push({ x: e.clientX, y: e.clientY, vx: Math.cos(angle) * 8.5, vy: Math.sin(angle) * 8.5 });
        }, 500);
    });

    function distPointToLine(px, py, b) {
        const dx = b.vx, dy = b.vy;
        const t = ((px - b.x) * dx + (py - b.y) * dy) / (dx * dx + dy * dy);
        if (t < 0) return Infinity;
        return Math.hypot(px - (b.x + t * dx), py - (b.y + t * dy));
    }

    function findSafePath() {
        // Kiểm tra xem vị trí hiện tại có thực sự bị đạn đâm trúng không (hitbox 25px)
        let isSafe = !bullets.some(b => distPointToLine(boss.x, boss.y, b) < 30);
        if (isSafe) {
            boss.isMoving = false;
            return;
        }

        let bestPoint = { x: boss.x, y: boss.y };
        let minScore = Infinity;

        // Boss quét tìm các "khe hở" nhỏ nhất có thể lách qua
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 16) {
            for (let r = 15; r < 100; r += 20) {
                let tx = boss.x + Math.cos(a) * r;
                let ty = boss.y + Math.sin(a) * r;

                if (Math.hypot(tx - ARENA_X, ty - ARENA_Y) > ARENA_RADIUS - 22) continue;

                let danger = 0;
                bullets.forEach(b => {
                    let d = distPointToLine(tx, ty, b);
                    if (d < 30) danger += (30 - d) * 5; // Phạt nặng nếu điểm này vẫn trúng đạn
                });

                // Ưu tiên điểm cực gần để lách xuyên qua thay vì chạy xa
                let score = danger * 1000 + Math.hypot(tx - boss.x, ty - boss.y);
                if (score < minScore) {
                    minScore = score;
                    bestPoint = { x: tx, y: ty };
                }
            }
        }
        boss.targetX = bestPoint.x;
        boss.targetY = bestPoint.y;
        boss.isMoving = true;
    }

    function update() {
        findSafePath();

        if (boss.isMoving) {
            const dx = boss.targetX - boss.x;
            const dy = boss.targetY - boss.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 1.5) {
                const angleToTarget = Math.atan2(dy, dx);
                let diff = angleToTarget - boss.angle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;

                let moveSpeed = 0;
                let steerAmount = 0;

                // THREADING LOGIC: Xoay trái/phải để tiến lên né xuyên qua nếu góc hẹp
                if (Math.abs(diff) <= Math.PI / 2) {
                    steerAmount = diff * 0.25;
                    moveSpeed = 6.5;
                } else {
                    let reverseDiff = diff > 0 ? diff - Math.PI : diff + Math.PI;
                    steerAmount = reverseDiff * 0.25;
                    moveSpeed = -6.5;
                }

                boss.angle += steerAmount;
                boss.x += Math.cos(boss.angle) * moveSpeed;
                boss.y += Math.sin(boss.angle) * moveSpeed;
            } else {
                boss.isMoving = false;
            }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            if (Math.hypot(b.x - boss.x, b.y - boss.y) < 20) {
                boss.hp--; hpTxt.innerText = boss.hp;
                bullets.splice(i, 1);
                if (boss.hp <= 0) { alert("VICTORY!"); location.reload(); }
                continue;
            }
            if (b.x < -100 || b.x > canvas.width+100 || b.y < -100 || b.y > canvas.height+100) bullets.splice(i, 1);
        }
    }

    function draw() {
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Arena
        ctx.beginPath(); ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.stroke();

        // Chỉ vẽ ĐƯỜNG KẺ quỹ đạo (Không màu đỏ)
        ctx.lineWidth = 1;
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x + b.vx * 350, b.y + b.vy * 350);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.stroke();
        });

        // Vẽ Boss
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(boss.angle);
        ctx.fillStyle = '#111'; ctx.fillRect(-22, -22, 44, 10); ctx.fillRect(-22, 12, 44, 10);
        ctx.fillStyle = boss.hp === 1 ? '#ff00ff' : '#ff3333';
        ctx.fillRect(-18, -15, 36, 30);
        ctx.fillStyle = '#000'; ctx.fillRect(0, -4, 25, 8);
        ctx.restore();

        // Vẽ đạn
        ctx.fillStyle = '#0f0';
        bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
