<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tank Maze v24.0 - Full Arsenal</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; touch-action: none; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; color: #0f0; pointer-events: none; z-index: 10; text-shadow: 2px 2px #000; }
        .boss-hp { color: #ff0055; font-size: 22px; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui">
    <div>[ SYSTEM: ARMORY_LOADED ]</div>
    <div>TANK HP: <span id="p-hp" style="color:#0f0">3</span> | BOSS HP: <span id="b-hp" class="boss-hp">5</span></div>
    <div style="font-size: 12px; color: #aaa; margin-top:5px;">PHÍM [SPACE] HOẶC CHUỘT TRÁI ĐỂ KHAI HỎA</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const pHPText = document.getElementById('p-hp'), bHPText = document.getElementById('b-hp');

    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    const GRID = 100, B_SPEED = 8, P_MOVE_SPEED = 4.5;
    const COLS = Math.floor(canvas.width / GRID), ROWS = Math.floor(canvas.height / GRID);
    
    // --- MÊ CUNG ---
    let maze = [];
    for (let r = 0; r < ROWS; r++) {
        maze[r] = [];
        for (let c = 0; c < COLS; c++) maze[r][c] = { c, r, walls: [true, true, true, true], v: false };
    }

    function genMaze() {
        let current = maze[0][0], stack = []; current.v = true;
        while(true) {
            let neighbors = [], {c, r} = current;
            [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]].forEach(d => {
                let n = maze[r+d[1]] && maze[r+d[1]][c+d[0]];
                if (n && !n.v) neighbors.push({cell: n, w1: d[2], w2: d[3]});
            });
            if (neighbors.length > 0) {
                let next = neighbors[Math.floor(Math.random()*neighbors.length)];
                next.cell.v = true; stack.push(current);
                current.walls[next.w1] = false; next.cell.walls[next.w2] = false; current = next.cell;
            } else if (stack.length > 0) current = stack.pop();
            else break;
        }
    }
    genMaze();

    let player = { x: 50, y: 50, a: 0, hp: 3 }, boss = { x: (COLS-1)*GRID+50, y: (ROWS-1)*GRID+50, a: 0, hp: 5 };
    let bullets = [], particles = [], mouse = { x: 0, y: 0, down: false };

    // --- ĐIỀU KHIỂN ---
    window.onmousemove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
    window.onmousedown = () => { mouse.down = true; fire(player, '#0f0', 'p'); };
    window.onmouseup = () => { mouse.down = false; };
    window.onkeydown = (e) => { if(e.code === 'Space') fire(player, '#0f0', 'p'); };

    function fire(obj, color, owner) {
        bullets.push({ x: obj.x, y: obj.y, vx: Math.cos(obj.a)*B_SPEED, vy: Math.sin(obj.a)*B_SPEED, c: color, o: owner, t: Date.now() });
    }

    function spawnExplosion(x, y, color) {
        for(let i=0; i<10; i++) particles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1, c: color });
    }

    function checkWall(x, y) {
        let cx = Math.floor(x/GRID), cy = Math.floor(y/GRID);
        if(!maze[cy] || !maze[cy][cx]) return true;
        let b = 18, rx = x % GRID, ry = y % GRID;
        if(maze[cy][cx].walls[0] && ry < b) return true;
        if(maze[cy][cx].walls[1] && rx > GRID-b) return true;
        if(maze[cy][cx].walls[2] && ry > GRID-b) return true;
        if(maze[cy][cx].walls[3] && rx < b) return true;
        return false;
    }

    function getRisk(tx, ty) {
        if(checkWall(tx, ty)) return 9999;
        let risk = 0;
        bullets.forEach(b => {
            if(b.o === 'p') {
                let dx = tx - b.x, dy = ty - b.y;
                let dot = (dx*b.vx + dy*b.vy) / B_SPEED;
                if(dot > 0 && dot < 180) {
                    let cross = Math.abs(dx*b.vy - dy*b.vx) / B_SPEED;
                    if(cross < 65) risk += (65 - cross) * 20;
                }
            }
        });
        return risk;
    }

    function update() {
        if (player.hp <= 0 || boss.hp <= 0) return;

        // Player di chuyển về phía chuột khi nhấn giữ
        player.a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        if(mouse.down && Math.hypot(mouse.x-player.x, mouse.y-player.y) > 20) {
            let nx = player.x + Math.cos(player.a)*P_MOVE_SPEED, ny = player.y + Math.sin(player.a)*P_MOVE_SPEED;
            if(!checkWall(nx, player.y)) player.x = nx;
            if(!checkWall(player.x, ny)) player.y = ny;
        }

        // BOSS AI: HUNTER + EVASION
        let bx = boss.x, by = boss.y, minR = getRisk(bx, by);
        for(let i=0; i<12; i++) {
            let ang = i * Math.PI / 6;
            let tx = boss.x + Math.cos(ang)*45, ty = boss.y + Math.sin(ang)*45;
            // Risk = Nguy cơ đạn + Khoảng cách đến người chơi (càng gần điểm risk càng thấp để ép Boss chạy tới)
            let r = getRisk(tx, ty) + (Math.hypot(tx-player.x, ty-player.y) * 0.8);
            if(r < minR) { minR = r; bx = tx; by = ty; }
        }
        boss.x += (bx - boss.x) * 0.1; boss.y += (by - boss.y) * 0.1;
        boss.a = Math.atan2(player.y - boss.y, player.x - boss.x);

        if(Math.random() < 0.03) fire(boss, '#f05', 'b');

        // Bullets & Particles
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            if(checkWall(b.x, b.y)) bullets.splice(i, 1);
            else {
                if(Math.hypot(b.x-boss.x, b.y-boss.y) < 25 && b.o==='p') { 
                    boss.hp--; bHPText.innerText=boss.hp; spawnExplosion(b.x, b.y, '#f05'); bullets.splice(i, 1); 
                }
                if(Math.hypot(b.x-player.x, b.y-player.y) < 25 && b.o==='b') { 
                    player.hp--; pHPText.innerText=player.hp; spawnExplosion(b.x, b.y, '#0f0'); bullets.splice(i, 1); 
                }
            }
        });
        particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; if(p.life <= 0) particles.splice(i, 1); });
    }

    function drawTank(x, y, a, color, isBoss) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(a);
        ctx.fillStyle = color;
        // Thân xe
        ctx.fillRect(-18, -18, 36, 36);
        // Nòng pháo (Đây cái nòng của ông đây!)
        ctx.fillStyle = '#fff';
        ctx.fillRect(10, -5, 25, 10);
        ctx.restore();
    }

    function draw() {
        ctx.fillStyle = '#050505'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
        maze.forEach(r => r.forEach(c => {
            let x = c.c*GRID, y = c.r*GRID;
            ctx.beginPath();
            if(c.walls[0]) { ctx.moveTo(x,y); ctx.lineTo(x+GRID,y); }
            if(c.walls[1]) { ctx.moveTo(x+GRID,y); ctx.lineTo(x+GRID,y+GRID); }
            if(c.walls[2]) { ctx.moveTo(x+GRID,y+GRID); ctx.lineTo(x,y+GRID); }
            if(c.walls[3]) { ctx.moveTo(x,y+GRID); ctx.lineTo(x,y); }
            ctx.stroke();
        }));

        drawTank(player.x, player.y, player.a, '#0f0', false);
        drawTank(boss.x, boss.y, boss.a, '#f05', true);

        bullets.forEach(b => { ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x,b.y,6,0,7); ctx.fill(); });
        particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 3, 3); ctx.globalAlpha = 1; });

        update(); requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
