<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minh Lỏ Center Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; color: white; touch-action: none; }
        /* Thế giới di chuyển */
        #world { position: absolute; width: 5000px; height: 5000px; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 50px 50px; transition: 0.1s linear; }
        #game-ui { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; border: 2px solid lime; z-index: 100; pointer-events: none; }
        /* Nhân vật chính luôn ở giữa */
        #player { 
            position: fixed; top: 50%; left: 50%; width: 70px; height: 70px; background: lime; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; color: black; font-weight: bold;
            box-shadow: 0 0 20px lime; z-index: 50; transform: translate(-50%, -50%); text-align: center;
        }
        /* Bản sao trong suốt */
        .ghost { 
            position: absolute; width: 70px; height: 70px; background: rgba(0, 255, 0, 0.2); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,0.3); font-size: 10px; pointer-events: none; z-index: 5;
        }
        .item { position: absolute; font-weight: bold; font-size: 18px; z-index: 10; }
        #controls { position: fixed; bottom: 20px; left: 20px; display: grid; grid-template-columns: repeat(3, 55px); gap: 10px; z-index: 100; }
        .btn { width: 55px; height: 55px; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 10px; display: flex; align-items: center; justify-content: center; user-select: none; }
        #btn-n { position: fixed; bottom: 20px; right: 20px; width: 80px; height: 80px; background: gold; color: black; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; font-size: 30px; z-index: 100; border: 4px solid white; }
        #message { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); font-size: 24px; text-align: center; display: none; z-index: 100; background: rgba(0,0,0,0.5); padding: 10px; }
        .firework { position: absolute; font-size: 40px; animation: explode 1s forwards; pointer-events: none; z-index: 200; }
        @keyframes explode { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3) translate(var(--x), var(--y)); opacity: 0; } }
    </style>
</head>
<body>

<div id="game-ui">
    <div>Minh: <span id="c1">0</span>/10 | Lỏ: <span id="c2">0</span>/10</div>
    <div>Skibidi: <span id="c3">0</span>/10 | Quá: <span id="c4">0</span>/10</div>
</div>

<div id="message"></div>
<div id="world"></div>
<div id="player">Minh Lỏ</div>

<div id="controls">
    <div></div><div class="btn" id="up">↑</div><div></div>
    <div class="btn" id="left">←</div><div class="btn" id="down">↓</div><div class="btn" id="right">→</div>
</div>
<div id="btn-n">N</div>

<script>
    const world = document.getElementById('world');
    const player = document.getElementById('player');
    const btnN = document.getElementById('btn-n');
    const counts = { 'Minh': 0, 'Lỏ': 0, 'Skibidi': 0, 'Quá': 0 };
    let wx = -2500 + window.innerWidth/2, wy = -2500 + window.innerHeight/2;
    let nPressed = 0, gameFinished = false;

    // Cập nhật vị trí thế giới
    function updateWorld() {
        world.style.left = wx + 'px';
        world.style.top = wy + 'px';
        checkCollision();
    }
    updateWorld();

    // Sinh bản sao mỗi 1 giây
    setInterval(() => {
        if(gameFinished) return;
        const ghost = document.createElement('div');
        ghost.className = 'ghost';
        ghost.innerText = 'Minh Lỏ';
        // Đặt bản sao tại vị trí người chơi đang đứng trong thế giới
        ghost.style.left = (Math.abs(wx) + window.innerWidth/2 - 35) + 'px';
        ghost.style.top = (Math.abs(wy) + window.innerHeight/2 - 35) + 'px';
        world.appendChild(ghost);
    }, 1000);

    // Tạo mảnh nhặt rải rác trong thế giới
    const words = ['Minh', 'Lỏ', 'Skibidi', 'Quá'];
    words.forEach(word => {
        for(let i=0; i<10; i++) {
            const el = document.createElement('div');
            el.className = 'item';
            el.innerText = word;
            el.style.color = `hsl(${Math.random()*360}, 100%, 70%)`;
            el.style.left = (2000 + Math.random() * 1000) + 'px';
            el.style.top = (2000 + Math.random() * 1000) + 'px';
            world.appendChild(el);
        }
    });

    function move(dx, dy) {
        if (gameFinished) return;
        wx -= dx; wy -= dy;
        updateWorld();
    }

    // Điều khiển
    window.addEventListener('keydown', (e) => {
        const s = 25;
        if (e.key === 'ArrowUp' || e.key === 'w') move(0, -s);
        if (e.key === 'ArrowDown' || e.key === 's') move(0, s);
        if (e.key === 'ArrowLeft' || e.key === 'a') move(-s, 0);
        if (e.key === 'ArrowRight' || e.key === 'd') move(s, 0);
        if (e.key.toLowerCase() === 'n') handleN();
    });

    const setupBtn = (id, dx, dy) => {
        const btn = document.getElementById(id);
        let timer;
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); timer = setInterval(() => move(dx, dy), 50); });
        btn.addEventListener('touchend', () => clearInterval(timer));
    };
    setupBtn('up', 0, -20); setupBtn('down', 0, 20); setupBtn('left', -20, 0); setupBtn('right', 20, 0);

    function checkCollision() {
        const items = document.querySelectorAll('.item');
        const px = Math.abs(wx) + window.innerWidth/2;
        const py = Math.abs(wy) + window.innerHeight/2;

        items.forEach(item => {
            const ix = parseFloat(item.style.left);
            const iy = parseFloat(item.style.top);
            const dist = Math.sqrt((px-ix)**2 + (py-iy)**2);
            
            if (dist < 50) {
                const txt = item.innerText;
                counts[txt]++;
                document.getElementById('c1').innerText = counts['Minh'];
                document.getElementById('c2').innerText = counts['Lỏ'];
                document.getElementById('c3').innerText = counts['Skibidi'];
                document.getElementById('c4').innerText = counts['Quá'];
                item.remove();
                if (Object.values(counts).every(v => v >= 10)) {
                    gameFinished = true;
                    document.getElementById('message').style.display = 'block';
                    document.getElementById('message').innerText = "NHIỆM VỤ XONG! ẤN N 10 LẦN";
                    btnN.style.display = 'flex';
                }
            }
        });
    }

    function handleN() {
        if (!gameFinished || nPressed >= 10) return;
        nPressed++;
        document.getElementById('message').innerText = `KẾT HỢP: ${nPressed}/10`;
        if (nPressed === 10) {
            document.getElementById('message').innerHTML = "<h1 style='color:lime'>CHÚC MỪNG MINH LỎ!</h1>";
            btnN.style.display = 'none';
            for (let i = 0; i < 15; i++) setTimeout(createFirework, i * 200);
        }
    }

    function createFirework() {
        const fw = document.createElement('div');
        fw.className = 'firework'; fw.innerText = 'MINH LỎ SKIBIDI QUÁ';
        fw.style.left = Math.random() * window.innerWidth + 'px';
        fw.style.top = Math.random() * window.innerHeight + 'px';
        fw.style.setProperty('--x', (Math.random() - 0.5) * 500 + 'px');
        fw.style.setProperty('--y', (Math.random() - 0.5) * 500 + 'px');
        fw.style.color = `hsl(${Math.random()*360}, 100%, 50%)`;
        document.body.appendChild(fw);
        setTimeout(() => fw.remove(), 1000);
    }
</script>
</body>
</html>
