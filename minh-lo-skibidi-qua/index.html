<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI Ultra - Tank Physics</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: fixed; top: 10px; left: 10px; color: white; pointer-events: none; font-size: 20px; text-shadow: 2px 2px 4px black; }
    </style>
</head>
<body>

<div id="ui">MÁU BOSS: <span id="hp">3</span></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 160;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;

    let boss = { 
        x: ARENA_X, y: ARENA_Y, 
        angle: 0, 
        speed: 0, 
        rotSpeed: 0,
        hp: 3, 
        radius: 20, // Bán kính va chạm của xe
        color: '#ff4444'
    };
    
    let bullets = [];

    window.addEventListener('pointerdown', (e) => {
        const dist = Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y);
        if (dist <= ARENA_RADIUS) return;

        setTimeout(() => {
            const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
            bullets.push({
                x: e.clientX, y: e.clientY,
                vx: Math.cos(angle) * 8.5,
                vy: Math.sin(angle) * 8.5,
                active: true
            });
        }, 500);
    });

    function getDistToLine(px, py, x1, y1, vx, vy) {
        // Tính khoảng cách gần nhất từ Boss đến quỹ đạo viên đạn
        const dx = vx; const dy = vy;
        const t = ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy);
        if (t < 0) return Infinity; // Đạn chưa bay tới hoặc bay qua rồi
        const nearestX = x1 + t * dx;
        const nearestY = y1 + t * dy;
        return Math.hypot(px - nearestX, py - nearestY);
    }

    function update() {
        boss.speed *= 0.8; // Ma sát
        boss.rotSpeed *= 0.7;

        let bestDodgeMove = 0; // -1: lùi, 1: tiến
        let bestDodgeTurn = 0; // -1: trái, 1: phải
        let dangerFound = false;

        bullets.forEach(b => {
            if (!b.active) return;

            // Kiểm tra xem đạn có đang nhắm vào mình không
            const distToPath = getDistToLine(boss.x, boss.y, b.x, b.y, b.vx, b.vy);
            const distToBullet = Math.hypot(b.x - boss.x, b.y - boss.y);

            if (distToPath < 45 && distToBullet < 200) { 
                dangerFound = true;
                // AI tính toán hướng lách:
                // Tìm vector vuông góc với hướng đạn
                const perpX = -b.vy; const perpY = b.vx;
                const side = (boss.x - b.x) * perpX + (boss.y - b.y) * perpY;
                
                // Quyết định tiến hay lùi dựa trên hướng xe hiện tại so với hướng cần né
                const targetAngle = Math.atan2(perpY * (side > 0 ? 1 : -1), perpX * (side > 0 ? 1 : -1));
                let angleDiff = targetAngle - boss.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

                bestDodgeTurn = angleDiff > 0 ? 0.15 : -0.15;
                bestDodgeMove = Math.abs(angleDiff) < Math.PI/2 ? 5 : -5;
            }
        });

        // Áp dụng AI vào cơ chế vật lý xe tăng (Tiến/Lùi/Xoay)
        if (dangerFound) {
            boss.angle += bestDodgeTurn;
            let nextX = boss.x + Math.cos(boss.angle) * bestDodgeMove;
            let nextY = boss.y + Math.sin(boss.angle) * bestDodgeMove;

            // Chặn không cho Boss ra khỏi vòng
            if (Math.hypot(nextX - ARENA_X, nextY - ARENA_Y) < ARENA_RADIUS - 22) {
                boss.x = nextX;
                boss.y = nextY;
            }
        }

        // Cập nhật đạn
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            if (b.active && Math.hypot(b.x - boss.x, b.y - boss.y) < 22) {
                boss.hp--; b.active = false;
                hpTxt.innerText = Math.max(0, boss.hp);
                if (boss.hp <= 0) { alert("VICTORY!"); location.reload(); }
            }
            if (b.x < -50 || b.x > canvas.width+50 || b.y < -50 || b.y > canvas.height+50) bullets.splice(i, 1);
        });
    }

    function draw() {
        ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Vẽ Arena
        ctx.beginPath();
        ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = '#555'; ctx.setLineDash([10, 10]); ctx.stroke();
        ctx.setLineDash([]);

        // Vẽ Boss (Xe tăng)
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(boss.angle);
        // Bánh xích
        ctx.fillStyle = '#333';
        ctx.fillRect(-22, -22, 44, 10);
        ctx.fillRect(-22, 12, 44, 10);
        // Thân
        ctx.fillStyle = boss.color;
        ctx.fillRect(-18, -15, 36, 30);
        // Nòng
        ctx.fillStyle = '#000';
        ctx.fillRect(0, -4, 25, 8);
        ctx.restore();

        // Vẽ đạn
        ctx.fillStyle = '#0f0';
        bullets.forEach(b => {
            if (b.active) {
                ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
            }
        });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
