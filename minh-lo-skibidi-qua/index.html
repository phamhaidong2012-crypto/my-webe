<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boss AI v20 - Smart Trajectory</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; touch-action: none; font-family: sans-serif; color: white; }
        canvas { display: block; }
        #ui { position: fixed; top: 15px; left: 15px; pointer-events: none; z-index: 10; }
        .stat { font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #timer { position: fixed; top: 15px; right: 15px; font-size: 30px; color: #ff3333; font-weight: 900; }
        #hotkeys { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; opacity: 0.7; }
        .key { border: 1px solid #0f0; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">MÁU BOSS: <span id="hp" style="color: #ff3333;">3</span></div>
    <div class="stat" style="color: #ffd700;">XU: <span id="coins">0</span></div>
</div>
<div id="timer">01:00</div>

<div id="hotkeys">
    <div class="key">[1] LASER</div>
    <div class="key">[2] 5 ĐẠN</div>
    <div class="key">[3] 3 MÌN</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hpTxt = document.getElementById('hp');
    const coinsTxt = document.getElementById('coins');
    const timerTxt = document.getElementById('timer');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ARENA_RADIUS = 225;
    const ARENA_X = canvas.width / 2;
    const ARENA_Y = canvas.height / 2;
    const BOSS_HITBOX = 17;

    let boss = { x: ARENA_X, y: ARENA_Y, angle: 0, hp: 3, targetX: ARENA_X, targetY: ARENA_Y };
    let bullets = [];
    let lasers = [];
    let timeLeft = 60;
    let coins = parseInt(localStorage.getItem('tankCoins') || 0);
    let mousePos = { x: 0, y: 0 };
    
    coinsTxt.innerText = coins;

    // Controls
    window.addEventListener('keydown', (e) => {
        if (e.key === '1') useSkill('laser');
        if (e.key === '2') useSkill('storm');
        if (e.key === '3') useSkill('mine');
    });

    window.addEventListener('mousemove', (e) => { mousePos.x = e.clientX; mousePos.y = e.clientY; });

    const timerInterval = setInterval(() => {
        timeLeft--;
        timerTxt.innerText = `00:${timeLeft.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) { clearInterval(timerInterval); alert("THUA!"); location.reload(); }
    }, 1000);

    function useSkill(type) {
        if (type === 'laser') {
            const angle = Math.atan2(boss.y - mousePos.y, boss.x - mousePos.x);
            lasers.push({ x: mousePos.x, y: mousePos.y, angle: angle, timer: 60 });
        } else if (type === 'storm') {
            for(let i=0; i<5; i++) {
                let a = Math.random() * Math.PI * 2;
                let startX = ARENA_X + Math.cos(a) * (ARENA_RADIUS + 100);
                let startY = ARENA_Y + Math.sin(a) * (ARENA_RADIUS + 100);
                let angleToBoss = Math.atan2(boss.y - startY, boss.x - startX);
                bullets.push({ x: startX, y: startY, vx: Math.cos(angleToBoss)*7, vy: Math.sin(angleToBoss)*7 });
            }
        } else if (type === 'mine') {
            for(let i=0; i<3; i++) {
                bullets.push({ x: mousePos.x + (Math.random()-0.5)*40, y: mousePos.y + (Math.random()-0.5)*40, vx: 0, vy: 0, timer: 300, type: 'mine' });
            }
        }
    }

    window.addEventListener('pointerdown', (e) => {
        if (Math.hypot(e.clientX - ARENA_X, e.clientY - ARENA_Y) <= ARENA_RADIUS) return;
        const angle = Math.atan2(boss.y - e.clientY, boss.x - e.clientX);
        bullets.push({ x: e.clientX, y: e.clientY, vx: Math.cos(angle) * 8.5, vy: Math.sin(angle) * 8.5 });
    });

    // Hệ thống tính toán va chạm tương lai cực kỳ chính xác
    function checkFutureCollision(testX, testY, futureFrames) {
        for (let b of bullets) {
            if (b.vx === 0 && b.vy === 0) { // Check mìn đứng yên
                if (Math.hypot(testX - b.x, testY - b.y) < BOSS_HITBOX + 25) return true;
                continue;
            }
            // Check đạn đang bay
            for (let f = 1; f <= futureFrames; f++) {
                let fbX = b.x + b.vx * f;
                let fbY = b.y + b.vy * f;
                if (Math.hypot(testX - fbX, testY - fbY) < BOSS_HITBOX + 15) return true;
            }
        }
        return false;
    }

    function findSafePath() {
        // Nếu điểm hiện tại ĐÃ AN TOÀN, không cần di chuyển (Fix lỗi chạy vòng vòng)
        if (!checkFutureCollision(boss.x, boss.y, 40)) {
            boss.targetX = boss.x;
            boss.targetY = boss.y;
            return;
        }

        let bestPoint = { x: boss.x, y: boss.y };
        let minScore = Infinity;

        for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
            for (let r = 0; r < ARENA_RADIUS - 20; r += 60) {
                let tx = ARENA_X + Math.cos(a) * r;
                let ty = ARENA_Y + Math.sin(a) * r;
                
                let score = 0;
                if (checkFutureCollision(tx, ty, 50)) {
                    score += 100000;
                } else {
                    // Ưu tiên điểm gần tâm và gần Boss nhất để không đi xa lãng phí
                    score = Math.hypot(tx - ARENA_X, ty - ARENA_Y) * 0.5 + Math.hypot(tx - boss.x, ty - boss.y);
                }

                if (score < minScore) {
                    minScore = score;
                    bestPoint = { x: tx, y: ty };
                }
            }
        }
        boss.targetX = bestPoint.x;
        boss.targetY = bestPoint.y;
    }

    function update() {
        findSafePath();

        const dx = boss.targetX - boss.x;
        const dy = boss.targetY - boss.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 3) { // Chỉ di chuyển nếu khoảng cách đủ lớn để tránh rung
            boss.angle = Math.atan2(dy, dx);
            boss.x += Math.cos(boss.angle) * 5.5;
            boss.y += Math.sin(boss.angle) * 5.5;
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            if (b.type === 'mine') { b.timer--; if(b.timer <= 0) { bullets.splice(i,1); continue; } }
            if (Math.hypot(b.x - boss.x, b.y - boss.y) < BOSS_HITBOX) {
                boss.hp--; hpTxt.innerText = boss.hp; bullets.splice(i, 1);
                if (boss.hp <= 0) { coins += 10; localStorage.setItem('tankCoins', coins); alert("WIN!"); location.reload(); }
            } else if (b.x < -300 || b.x > canvas.width+300 || b.y < -300 || b.y > canvas.height+300) bullets.splice(i, 1);
        }

        // Update Lasers
        for (let i = lasers.length - 1; i >= 0; i--) {
            let l = lasers[i]; l.timer--;
            if (l.timer <= 0) {
                for(let j=0; j<25; j++) bullets.push({ x: l.x, y: l.y, vx: Math.cos(l.angle)*(10+j*0.5), vy: Math.sin(l.angle)*(10+j*0.5), isLaser: true });
                lasers.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Vẽ Arena
        ctx.beginPath(); ctx.arc(ARENA_X, ARENA_Y, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();

        // Vẽ đường quỹ đạo đạn (Trajectory)
        bullets.forEach(b => {
            if (b.vx !== 0) {
                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.lineTo(b.x + b.vx * 50, b.y + b.vy * 50); // Đường kẻ ngắn hướng đi
                ctx.strokeStyle = 'rgba(0, 255, 150, 0.2)';
                ctx.stroke();
            }
        });

        // Vẽ Laser Warning
        lasers.forEach(l => {
            ctx.beginPath(); ctx.moveTo(l.x, l.y);
            ctx.lineTo(l.x + Math.cos(l.angle)*1200, l.y + Math.sin(l.angle)*1200);
            ctx.strokeStyle = `rgba(255, 0, 255, ${0.1 + (1 - l.timer/60)*0.5})`;
            ctx.stroke();
        });

        // Boss
        ctx.save();
        ctx.translate(boss.x, boss.y); ctx.rotate(boss.angle);
        ctx.fillStyle = '#111'; ctx.fillRect(-20, -20, 40, 10); ctx.fillRect(-20, 10, 40, 10);
        ctx.fillStyle = boss.hp === 1 ? '#f0f' : '#f33'; ctx.fillRect(-18, -15, 36, 30);
        ctx.restore();

        // Đạn thực tế
        bullets.forEach(b => {
            ctx.fillStyle = b.type === 'mine' ? '#ff0' : (b.isLaser ? '#f0f' : '#0f0');
            ctx.beginPath(); ctx.arc(b.x, b.y, b.isLaser ? 6 : 4, 0, Math.PI*2); ctx.fill();
        });

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
