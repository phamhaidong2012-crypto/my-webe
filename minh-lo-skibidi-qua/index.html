<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minh Lỏ Original</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #bg { position: fixed; width: 100vw; height: 100vh; background-image: radial-gradient(#222 1px, transparent 1px); background-size: 60px 60px; z-index: 1; }
        #game-ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; border: 2px solid lime; z-index: 200; color: white; text-align: center; min-width: 250px; }
        .task-list { display: flex; justify-content: center; gap: 10px; font-weight: bold; margin-top: 5px; font-size: 14px; }
        #player { position: fixed; top: 50%; left: 50%; width: 70px; height: 70px; background: lime; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; font-weight: bold; transform: translate(-50%, -50%); z-index: 100; box-shadow: 0 0 30px lime; }
        #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        .item { position: absolute; font-weight: bold; font-size: 22px; transform: translate(-50%, -50%); z-index: 20; text-shadow: 0 0 10px white; }
        #controls { position: fixed; bottom: 20px; left: 20px; display: grid; grid-template-columns: repeat(3, 55px); gap: 8px; z-index: 200; }
        .btn { width: 55px; height: 55px; background: rgba(255,255,255,0.2); border: 1px solid white; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; user-select: none; }
        #btn-n { position: fixed; bottom: 30px; right: 30px; width: 90px; height: 90px; background: gold; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; z-index: 210; border: 5px solid #fff; font-size: 35px; box-shadow: 0 0 20px orange; }
        .fw { position: fixed; pointer-events: none; font-weight: bold; z-index: 300; animation: fly 1s ease-out forwards; }
        @keyframes fly { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(4); opacity: 0; } }
    </style>
</head>
<body>

<div id="bg"></div>
<div id="game-ui">
    <div style="color: gold;">BẢN ĐỒ NHIỆM VỤ</div>
    <div class="task-list">
        <div>M: <span id="c1">0</span>/10</div>
        <div>L: <span id="c2">0</span>/10</div>
        <div>S: <span id="c3">0</span>/10</div>
        <div>Q: <span id="c4">0</span>/10</div>
    </div>
</div>

<div id="container"></div>
<div id="player">Minh Lỏ</div>

<div id="controls">
    <div></div><div class="btn" id="up">↑</div><div></div>
    <div class="btn" id="left">←</div><div class="btn" id="down">↓</div><div class="btn" id="right">→</div>
</div>
<div id="btn-n">N</div>

<script>
    let posX = 0, posY = 0;
    const container = document.getElementById('container');
    const bg = document.getElementById('bg');
    const counts = { 'Minh': 0, 'Lỏ': 0, 'Skibidi': 0, 'Quá': 0 };
    const words = ['Minh', 'Lỏ', 'Skibidi', 'Quá'];
    let gameFinished = false, nPressed = 0;

    function draw() {
        bg.style.backgroundPosition = `${-posX}px ${-posY}px`;
        container.style.transform = `translate(${-posX}px, ${-posY}px)`;
        checkCollision();
    }

    setInterval(() => {
        if(gameFinished) return;
        const item = document.createElement('div');
        item.className = 'item';
        item.innerText = words[Math.floor(Math.random() * words.length)];
        item.style.color = `hsl(${Math.random()*360}, 100%, 75%)`;
        item.style.left = (posX + window.innerWidth/2) + 'px';
        item.style.top = (posY + window.innerHeight/2) + 'px';
        container.appendChild(item);
    }, 500);

    function move(dx, dy) {
        if(gameFinished) return;
        posX += dx; posY += dy;
        draw();
    }

    const speed = 35;
    window.onkeydown = e => {
        if(e.key === 'w' || e.key === 'ArrowUp') move(0, -speed);
        if(e.key === 's' || e.key === 'ArrowDown') move(0, speed);
        if(e.key === 'a' || e.key === 'ArrowLeft') move(-speed, 0);
        if(e.key === 'd' || e.key === 'ArrowRight') move(speed, 0);
        if(e.key.toLowerCase() === 'n') handleN();
    };

    const setupBtn = (id, dx, dy) => {
        const btn = document.getElementById(id);
        let inv;
        const start = () => inv = setInterval(() => move(dx, dy), 50);
        const stop = () => clearInterval(inv);
        btn.onmousedown = start; btn.onmouseup = stop;
        btn.ontouchstart = e => { e.preventDefault(); start(); };
        btn.ontouchend = stop;
    };
    setupBtn('up', 0, -25); setupBtn('down', 0, 25); setupBtn('left', -25, 0); setupBtn('right', 20, 0);

    function checkCollision() {
        const items = document.querySelectorAll('.item');
        const px = posX + window.innerWidth/2, py = posY + window.innerHeight/2;
        items.forEach(item => {
            const ix = parseFloat(item.style.left), iy = parseFloat(item.style.top);
            if(Math.sqrt((px-ix)**2 + (py-iy)**2) < 45) {
                const t = item.innerText;
                if(counts[t] < 10) {
                    counts[t]++;
                    document.getElementById('c1').innerText = counts['Minh'];
                    document.getElementById('c2').innerText = counts['Lỏ'];
                    document.getElementById('c3').innerText = counts['Skibidi'];
                    document.getElementById('c4').innerText = counts['Quá'];
                    item.remove();
                    if(Object.values(counts).every(v => v >= 10)) {
                        gameFinished = true;
                        document.getElementById('btn-n').style.display = 'flex';
                    }
                }
            }
        });
    }

    function handleN() {
        if(!gameFinished || nPressed >= 10) return;
        nPressed++;
        for(let i=0; i<8; i++) spawnFW();
        if(nPressed === 10) {
            document.getElementById('btn-n').style.display = 'none';
            alert("CHÚC MỪNG: MINH LỎ SKIBIDI QUÁ!");
            location.reload();
        }
    }

    function spawnFW() {
        const fw = document.createElement('div');
        fw.className = 'fw';
        fw.innerText = words[Math.floor(Math.random()*4)];
        fw.style.left = '50%'; fw.style.top = '50%';
        fw.style.color = `hsl(${Math.random()*360}, 100%, 60%)`;
        fw.style.setProperty('--tx', (Math.random()-0.5)*800+'px');
        fw.style.setProperty('--ty', (Math.random()-0.5)*800+'px');
        document.body.appendChild(fw);
        setTimeout(() => fw.remove(), 1000);
    }
    document.getElementById('btn-n').onclick = handleN;
</script>
</body>
</html>
